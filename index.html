                if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
                e.preventDefault();
            });
            window.addEventListener('dragstart', (e) => { e.preventDefault(); });
            window.addEventListener('selectstart', (e) => {
                const tag = e.target?.tagName;
                if (tag === 'INPUT' || tag === 'TEXTAREA' || e.target?.isContentEditable) return;
                e.preventDefault();
            });
            window.addEventListener('keydown', (e) => {
                const key = String(e.key || '').toLowerCase();
                if (
                    e.key === 'F12' ||
                    (e.ctrlKey && e.shiftKey && (key === 'i' || key === 'j' || key === 'c' || key === 'k')) ||
                    (e.ctrlKey && (key === 'u' || key === 's' || key === 'p')) ||

                    e.preventDefault();

        let portalFbDb = null;
        try {
            const fbConfig = {

        // 백그라운드 프리로드 캐시 (고객이 닉네임/비번을 입력하는 동안 미리 로드하여 조회 시 0.1초 즉시 오픈!)
        const portalSheetCache = {

        const preloadPortalDataInBackground = (force = false) => {
            const now = Date.now();
            if (!force && portalSheetCache.staffOrderRows && (now - portalSheetCache.lastFetchedAt < 15000)) {
                return Promise.resolve(portalSheetCache.staffOrderRows);

            if (portalSheetCache.fetchingPromise) {

            }
            // 1) 직원용 시트('메인주문') + 2) 사장님 실시간 생방송 시트(DEFAULT_MASTER_SHEET_ID '메인주문') 동시 초고속 로드!
            const staffGvizPromise = fetchSheetDirectGviz(DEFAULT_STAFF_SHEET_ID, '메인주문').catch(() => null);
            const staffGasPromise = fetchGasWithRetry(`${DEFAULT_GAS_URL}?action=get_orders&masterId=${DEFAULT_STAFF_SHEET_ID}&tabName=${encodeURIComponent('메인주문')}&t=${now}`, {}, 1)
                .then(res => (res && Array.isArray(res.data) && res.data.length > 0) ? res.data : null)
                .catch(() => null);

            const bossGvizPromise = fetchSheetDirectGviz(DEFAULT_MASTER_SHEET_ID, '메인주문').catch(() => null);
            const bossGasPromise = fetchGasWithRetry(`${DEFAULT_GAS_URL}?action=get_orders&masterId=${DEFAULT_MASTER_SHEET_ID}&tabName=${encodeURIComponent('메인주문')}&t=${now}`, {}, 1)
                .then(res => (res && Array.isArray(res.data) && res.data.length > 0) ? res.data : null)
                .catch(() => null);

            Promise.race([
                bossGvizPromise.then(r => (Array.isArray(r) && r.length > 0) ? r : bossGasPromise),
                bossGasPromise.then(r => (Array.isArray(r) && r.length > 0) ? r : bossGvizPromise)
            ]).then(bossRows => {
                if (Array.isArray(bossRows)) {
                    portalSheetCache.bossLiveOrderRows = bossRows;
                }
                bossGasPromise.then(freshBoss => {
                    if (Array.isArray(freshBoss)) portalSheetCache.bossLiveOrderRows = freshBoss;

            portalSheetCache.fetchingPromise = Promise.race([
                staffGvizPromise.then(r => (Array.isArray(r) && r.length > 0) ? r : staffGasPromise),
                staffGasPromise.then(r => (Array.isArray(r) && r.length > 0) ? r : staffGvizPromise)
            ]).then(rows => {

                    portalSheetCache.staffOrderRows = rows;

                }

        const Icon = ({ name, className = "", weight = "regular", size = 16 }) => (
            <i className={`ph ph-${name} ${className}`} data-phosphor-icon-weight={weight} style={{ fontSize: size }}></i>
        );

        const normalizeNick = (str) => {
            return String(str || "").replace(/[\s\(\)\[\]\{\}\-\_\.\,\/]/g, "").toLowerCase();
        };

        const cleanHandle = (str) => {
            if (!str) return "";
            let s = String(str).trim();
            s = s.replace(/-[a-zA-Z0-9_]{1,10}$/, "");
            return s.replace(/[\s\(\)\[\]\{\}\-\_\.\,\/]/g, "").toLowerCase();
        };

        const extractKorean = (str) => {
            if (!str) return "";
            return String(str).replace(/[^가-힣]/g, "");
        };

        const normalizeKoreanVowel = (str) => {
            const s = normalizeNick(str);
            let out = "";
            for (let i = 0; i < s.length; i++) {
                const code = s.charCodeAt(i);
                if (code >= 0xAC00 && code <= 0xD7A3) {
                    const offset = code - 0xAC00;
                    let cho = Math.floor(offset / 588);
                    let jung = Math.floor((offset % 588) / 28);
                    const jong = offset % 28;
                    if (cho === 1 || cho === 15) cho = 0;
                    else if (cho === 4 || cho === 16) cho = 3;
                    else if (cho === 8 || cho === 17) cho = 7;
                    else if (cho === 13 || cho === 14) cho = 12;
                    if (jung === 1) jung = 5;
                    if (jung === 3) jung = 7;
                    out += String.fromCharCode(0xAC00 + cho * 588 + jung * 28 + jong);
                } else {
                    out += s[i];
                }
            }
            return out;
        };

        const getNickMatchScore = (dbNick, dbRealname, userInput) => {
            if (!userInput || !dbNick) return 0;
            const rawDb = String(dbNick).trim();
            const rawIn = String(userInput).trim();
            const nDb = normalizeNick(rawDb);
            const nIn = normalizeNick(rawIn);
            if (!nIn || !nDb) return 0;

            // 1순위: 전체 닉네임 100% 완전 일치 (점수 4점)
            if (nDb === nIn) return 4;

            // ⚠️ 만약 사용자가 직접 핸들(-3k4)이나 뒤에 숫자(홍당무1)를 붙여서 입력했는데 DB 닉네임과 다르다면 다른 사람이므로 즉시 0점 차단!
            const inHasHandle = /-[a-zA-Z0-9_]{1,10}$/.test(rawIn);
            const dbHasHandle = /-[a-zA-Z0-9_]{1,10}$/.test(rawDb);
            if (inHasHandle && nDb !== nIn) return 0;

            const inTrailingNum = (rawIn.replace(/-[a-zA-Z0-9_]{1,10}$/, '').match(/(\d+)$/) || [])[1] || '';
            const dbTrailingNum = (rawDb.replace(/-[a-zA-Z0-9_]{1,10}$/, '').match(/(\d+)$/) || [])[1] || '';
            // 홍당무1 vs 홍당무2 처럼 뒤 숫자가 다르면 완전히 다른 사람!
            if (inTrailingNum !== dbTrailingNum) return 0;

            // 2순위: 유튜브 자동 핸들(-3k4 등)만 뗀 기본 닉네임이 100% 일치할 때 (점수 3점)
            const cDb = cleanHandle(rawDb);
            const cIn = cleanHandle(rawIn);
            if (cDb && cIn && cDb === cIn) return 3;

            // 3순위: 한글 부분 일치 (단, 숫자가 붙은 다른 닉네임끼리는 위에서 이미 차단됨)
            const kDb = extractKorean(cDb || nDb);
            const kIn = extractKorean(cIn || nIn);
            if (kDb && kIn) {
                if (kDb.length >= 2 && kDb === kIn) return 3;
                if (kIn.length >= 2 && kDb.length >= 2 && kDb.includes(kIn)) return 2;
                const vDb = normalizeKoreanVowel(kDb);
                const vIn = normalizeKoreanVowel(kIn);
                if (vDb.length >= 2 && vDb === vIn) return 2;
                if (vIn.length >= 2 && vDb.length >= 2 && vDb.includes(vIn)) return 2;
            }

            const nReal = normalizeNick(dbRealname);
            if (nReal && nIn.length >= 2 && nReal === nIn) return 1;

            return 0;
        };

        const isFlexibleNickMatch = (rowNick, inputNick, rowRealname = "") => {
            return getNickMatchScore(rowNick, rowRealname, inputNick) > 0;
        };

        const fixPhoneStr = (p) => {
            if (!p) return "";
            let c = String(p).replace(/[^0-9]/g, "");
            if (c.length === 10 && !c.startsWith("0")) c = "0" + c;
            return c;
        };

        const normalizePin4 = (val) => {
            if (val === undefined || val === null) return "";
            const digits = String(val).replace(/[^0-9]/g, "");
            if (!digits) return "";
            return digits.length < 4 ? digits.padStart(4, "0") : digits.slice(-4);
        };

        const maskName = (name) => {
            if (!name) return "";
            const s = String(name).trim();
            if (s.length <= 1) return s;
            if (s.length === 2) return s[0] + "*";
            return s[0] + "*".repeat(s.length - 2) + s[s.length - 1];
        };

        const maskPhone = (phone) => {
            if (!phone) return "";
            const clean = String(phone).replace(/[^0-9]/g, "");
            if (clean.length < 7) return phone;
            return `${clean.slice(0, 3)}-****-${clean.slice(-4)}`;
        };

        const maskAddress = (baseAddr, detailAddr, zipcode) => {
            const cleanZip = String(zipcode || "").replace(/[^0-9]/g, "");
            const cleanBase = String(baseAddr || "").replace(/^\(\d{5}\)\s*/, "").trim();
            const d = String(detailAddr || "").trim();
            const full = `${cleanBase} ${d}`.trim();
            if (!full) return "";

            const zipPart = cleanZip ? `(${cleanZip.slice(0, 3)}**) ` : "";

            let masked = full.replace(/\(([^)]+)\)/g, (match, inner) => {
                if (inner.includes(",")) {
                    const parts = inner.split(",");
                    return `(${parts[0].trim()}, *****)`;
                }
                return inner.length > 2 ? `(${inner.slice(0, 2)}***)` : `(${inner})`;
            });

            masked = masked.replace(/(\d+)\s*(동|호|층|번지|길|로\s*\d*)/g, (m, num, unit) => {
                if (unit.startsWith("길") || unit.startsWith("로")) return m;
                return `${"*".repeat(Math.max(2, num.length))}${unit}`;
            });

            masked = masked.replace(/\d+-\d+/g, "***-****");
            masked = masked.replace(/([가-힣]+(?:로|길|동|읍|면|리))\s+(\d+)(-\d+)?/g, "$1 ***");
            masked = masked.replace(/\d{2,}/g, (n) => "*".repeat(n.length));

            return `${zipPart}${masked}`;
        };

        const formatKstDateString = (val) => {
            if (!val) return "";
            const s = String(val).trim();
            if (/^\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}/.test(s)) return s.slice(0, 16);
            const dt = new Date(s);
            if (!isNaN(dt.getTime()) && (s.includes("T") || s.includes("GMT") || s.endsWith("Z"))) {
                const kst = new Date(dt.getTime() + 9 * 60 * 60 * 1000);
                const yyyy = kst.getUTCFullYear();
                const mm = String(kst.getUTCMonth() + 1).padStart(2, '0');
                const dd = String(kst.getUTCDate()).padStart(2, '0');
                const hh = String(kst.getUTCHours()).padStart(2, '0');
                const min = String(kst.getUTCMinutes()).padStart(2, '0');
                return `${yyyy}-${mm}-${dd} ${hh}:${min}`;
            }
            return s;
        };

        const getKstNowString = () => {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd} ${hh}:${min}`;
        };

        const cleanBroadcastKey = (name) => {
            return String(name || '')
                .replace(/^주문_/, '')
                .replace(/\s*주문\s*목록\s*/g, '')
                .replace(/\s+/g, ' ')
                .trim();
        };

        // 방송 제목에서 월/일 날짜 키(예: "10/20", "10/18")만 추출하는 헬퍼 함수
        const extractMonthDayKey = (titleOrTab) => {
            const s = cleanBroadcastKey(titleOrTab);
            if (!s) return '';
            const fullMatch = s.match(/(?:20)?(\d{2})[./\-\s년]+(\d{1,2})[./\-\s월]+(\d{1,2})/);
            if (fullMatch) {
                return `${parseInt(fullMatch[2], 10)}/${parseInt(fullMatch[3], 10)}`;
            }
            const mdMatch = s.match(/(?:^|[^\d])(1[0-2]|0?[1-9])[./\-\s월]+([0-2]?\d|3[01])(?:일|\b|\s|[^0-9])/);
            if (mdMatch) {
                return `${parseInt(mdMatch[1], 10)}/${parseInt(mdMatch[2], 10)}`;
            }
            return '';
        };

        // 주문 품목 구성이 동일한지 판별하기 위한 품목 시그니처 생성 함수
        const getOrderItemsSignature = (itemObj) => {
            if (!itemObj || !Array.isArray(itemObj.items) || itemObj.items.length === 0) return '';
            return itemObj.items
                .map(it => `${normalizeNick(it.product || '')}:${Number(it.qty) || 1}:${Number(it.price) || 0}`)
                .sort()
                .join('|');
        };

        const extractBroadcastDateScore = (titleOrTab, isLiveItem = false) => {
            const s = cleanBroadcastKey(titleOrTab);
            if (!s) return 0;
            const activeLiveKey = cleanBroadcastKey(portalSheetCache.activeBroadcastName);
            if (isLiveItem || (portalSheetCache.isLiveActive && activeLiveKey && s === activeLiveKey) || s === '오늘의방송') {
                return 99999999;
            }
            const fullMatch = s.match(/(?:20)?(\d{2})[./\-\s년]+(\d{1,2})[./\-\s월]+(\d{1,2})/);
            if (fullMatch) {
                const yy = parseInt(fullMatch[1], 10);
                const mm = parseInt(fullMatch[2], 10);
                const dd = parseInt(fullMatch[3], 10);
                if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) {
                    return (2000 + yy) * 10000 + mm * 100 + dd;
                }
            }
            const mdMatch = s.match(/(?:^|[^\d])(1[0-2]|0?[1-9])[./\-\s월]+([0-2]?\d|3[01])(?:일|\b|\s|[^0-9])/);
            if (mdMatch) {
                const mm = parseInt(mdMatch[1], 10);
                const dd = parseInt(mdMatch[2], 10);
                return 2026 * 10000 + mm * 100 + dd;
            }
            return 0;
        };

        // 방송 이름(broadcastName) 기준으로만 정확히 중복을 제거하여, 같은 날짜의 서로 다른 방송('10/26 스카프' vs '10/26 사무실악세', '10/20 악세사리' vs '10/20 모이사')이 절대 합쳐지거나 누락되지 않도록 보호하는 함수!
        const deduplicateHistoryByBroadcastName = (list) => {
            if (!Array.isArray(list)) return [];
            const map = new Map();

            // 실시간 생방송 데이터(_isLiveSource) > 직원이 수정한 실시간 클라우드 데이터(_fromStaffRealtime) > 실제 직원 시트 데이터(_fromStaffSheet) 순으로 우선 정렬
            const prioritized = [...list].sort((a, b) => {
                const aScore = (a?._isLiveSource ? 8 : 0) + (a?._fromStaffRealtime ? 4 : 0) + (a?._fromStaffSheet ? 2 : 0);
                const bScore = (b?._isLiveSource ? 8 : 0) + (b?._fromStaffRealtime ? 4 : 0) + (b?._fromStaffSheet ? 2 : 0);
                return bScore - aScore;
            });

            prioritized.forEach(item => {
                if (!item) return;
                let bKey = cleanBroadcastKey(item.broadcastName || item.sheetTabName || '주문내역');
                if (!bKey) return;

                // 🔴 현재 생방송 중인 주문서(_isLiveSource)가 만약 이전 마감 방송과 같은 이름이면 절대 옛날 방송에 먹히지 않도록 구분!
                if (item._isLiveSource && map.has(bKey) && !map.get(bKey)._isLiveSource) {
                    bKey = `${bKey} (실시간 라이브)`;
                }

                // 오직 방송 이름(bKey)이 100% 똑같고 생방송 여부가 같을 때만 병합! (같은 날짜라도 '10/26 스카프'와 '10/26 사무실악세'는 절대 합치지 않음!)
                let matchedKey = null;
                if (map.has(bKey)) {
                    const ex = map.get(bKey);
                    if (Boolean(ex._isLiveSource) === Boolean(item._isLiveSource)) {
                        matchedKey = bKey;
                    }
                }

                if (!matchedKey) {
                    map.set(bKey, {
                        ...item,
                        broadcastName: bKey,
                        sheetTabName: item._isLiveSource ? '메인주문' : ('주문_' + bKey)
                    });
                } else {
                    const existing = map.get(matchedKey);
                    const exItems = Array.isArray(existing.items) ? existing.items : [];
                    const newItems = Array.isArray(item.items) ? item.items : [];
                    const preferExisting = Boolean(existing._isLiveSource || existing._fromStaffRealtime);
                    const preferIncoming = Boolean(!preferExisting && (item._isLiveSource || item._fromStaffRealtime));
                    const bestItems = preferExisting
                        ? exItems
                        : (preferIncoming ? newItems : (newItems.length >= exItems.length ? newItems : exItems));
                    const finalBName = existing.broadcastName || bKey;

                    // 고객이 직접 포털에서 입력/수정한 배송지(_hasBcastCustomAddr)가 있으면 어떤 경우에도 최우선으로 유지!
                    const mergedAddress = item._hasBcastCustomAddr
                        ? item.address
                        : (existing._hasBcastCustomAddr
                            ? existing.address
                            : ((existing.address && existing.address.baseAddress) ? existing.address : (item.address || existing.address)));

                    const mergedCard = {
                        ...item,
                        ...existing,
                        broadcastName: finalBName,
                        sheetTabName: (existing._isLiveSource || item._isLiveSource) ? '메인주문' : ('주문_' + finalBName),
                        _fromStaffRealtime: Boolean(existing._fromStaffRealtime || item._fromStaffRealtime),
                        _fromStaffSheet: Boolean(existing._fromStaffSheet || item._fromStaffSheet),
                        _isLiveSource: Boolean(existing._isLiveSource || item._isLiveSource),
                        _hasBcastCustomAddr: Boolean(existing._hasBcastCustomAddr || item._hasBcastCustomAddr),
                        items: bestItems,
                        shipping: preferExisting
                            ? (Number(existing.shipping) || 0)
                            : (preferIncoming ? (Number(item.shipping) || 0) : (existing.shipping !== undefined ? Number(existing.shipping) : Number(item.shipping) || 0)),
                        depositTotal: preferExisting
                            ? (Number(existing.depositTotal) || 0)
                            : (preferIncoming ? (Number(item.depositTotal) || 0) : Math.max(Number(existing.depositTotal) || 0, Number(item.depositTotal) || 0)),
                        deposits: preferExisting
                            ? (Array.isArray(existing.deposits) ? existing.deposits : [])
                            : (preferIncoming ? (Array.isArray(item.deposits) ? item.deposits : []) : ((Array.isArray(existing.deposits) && existing.deposits.length > 0) ? existing.deposits : (item.deposits || []))),
                        address: mergedAddress,
                        trackingNumbers: (Array.isArray(existing.trackingNumbers) && existing.trackingNumbers.length > 0) ? existing.trackingNumbers : (item.trackingNumbers || []),
                        isConfirmed: Boolean(existing.isConfirmed || item.isConfirmed)
                    };

                    map.set(finalBName, mergedCard);
                }
            });
            return Array.from(map.values());
        };

        const sortHistoryByNewestDate = (list) => {
            const deduped = deduplicateHistoryByBroadcastName(list);
            return deduped.sort((a, b) => {
                const scoreA = extractBroadcastDateScore(a?.broadcastName || a?.sheetTabName || '', a?._isLiveSource);
                const scoreB = extractBroadcastDateScore(b?.broadcastName || b?.sheetTabName || '', b?._isLiveSource);
                if (scoreA !== scoreB) return scoreB - scoreA;
                return 0;
            });
        };

        const removeDummyEmptyOrdersIfRealExists = (list) => {
            if (!Array.isArray(list) || list.length <= 1) return list || [];
            const realOrders = list.filter(item =>
                item &&
                item.broadcastName !== '최근 주문 내역 없음' &&
                item.sheetTabName !== '메인주문_빈카드' &&
                Array.isArray(item.items) && item.items.length > 0
            );
            return realOrders.length > 0 ? realOrders : [list[0]];
        };

        const hasRealOrderItems = (list) => {
            if (!Array.isArray(list) || list.length === 0) return false;
            return list.some(item =>
                item &&
                item.broadcastName !== '최근 주문 내역 없음' &&
                item.sheetTabName !== '메인주문_빈카드' &&
                Array.isArray(item.items) && item.items.length > 0
            );
        };

        const filterVerifiedHistoryList = (rawList, rawNickInput, cleanPinInput, lockedFullNick = "") => {
            if (!Array.isArray(rawList) || rawList.length === 0) return [];
            const normInPin = normalizePin4(cleanPinInput);

            // 1단계: 조회된 전체 카드 중 비밀번호(뒷 4자리)가 일치하는 정확한 닉네임들을 먼저 찾음!
            // ⚠️ 핵심: 홍당무-3k4(비번 1111)와 홍당무-5kj(비번 2222)가 있을 때, 비번 1111을 친 사람에게는 오직 홍당무-3k4만 허용하고 홍당무-5kj는 100% 배제!
            const pinVerifiedNicks = new Set();
            const pinMismatchedNicks = new Set();

            rawList.forEach(item => {
                if (!item || !item.nickname) return;
                const itemPin = normalizePin4(
                    item.phoneLast4 ||
                    (item.address && item.address.phone ? String(item.address.phone).slice(-4) : "")
                );
                const sc = getNickMatchScore(item.nickname, item.address?.realname || "", rawNickInput);
                if (sc <= 0) return;

                const exactKey = normalizeNick(item.nickname);
                if (itemPin && normInPin) {
                    if (itemPin === normInPin) {
                        pinVerifiedNicks.add(exactKey);
                    } else {
                        pinMismatchedNicks.add(exactKey);
                    }
                }
            });

            const step1 = rawList.filter(item => {
                if (!item || !item.nickname) return false;
                const exactKey = normalizeNick(item.nickname);
                const itemPin = normalizePin4(
                    item.phoneLast4 ||
                    (item.address && item.address.phone ? String(item.address.phone).slice(-4) : "")
                );
                // 비밀번호가 다르면 무조건 차단!
                if (itemPin && normInPin && itemPin !== normInPin) return false;
                if (pinMismatchedNicks.has(exactKey) && !pinVerifiedNicks.has(exactKey)) return false;

                const sc = getNickMatchScore(item.nickname, item.address?.realname || "", rawNickInput);
                const lockedSc = lockedFullNick ? getNickMatchScore(item.nickname, "", lockedFullNick) : 0;
                if (sc <= 0 && lockedSc <= 0) return false;

                // 이 닉네임(예: 홍당무-3k4)이 다른 방송에서라도 본인 비번 인증이 완료된 닉네임이면 통과!
                if (pinVerifiedNicks.has(exactKey)) return true;

                // 만약 비밀번호가 아직 없는 신규 생방송 카드인데, 다른 동명이인(홍당무-5kj)이 이미 비번 인증된 상태라면, 핸들이 다른 카드는 절대 끼어들지 못하게 차단!
                if (!itemPin) {
                    if (pinVerifiedNicks.size > 0) {
                        // 오직 비번 인증된 닉네임과 전체 닉네임이 같거나, 한쪽이 핸들 없는 순수 동일 닉네임일 때만 허용
                        const itemHasHandle = /-[a-zA-Z0-9_]{1,10}$/.test(String(item.nickname).trim());
                        if (itemHasHandle) return false;
                        const cHandle = cleanHandle(item.nickname);
                        const matchesVerifiedBase = Array.from(pinVerifiedNicks).some(vn => cleanHandle(vn) === cHandle);
                        return matchesVerifiedBase;
                    }
                    return sc >= 3;
                }
                return true;
            });

            if (step1.length === 0) return [];

            // 점수 및 비밀번호 일치 여부에 따라 가장 정확한 주인공 닉네임 1개(예: 홍당무-3k4)를 확정!
            step1.sort((a, b) => {
                const aPinOk = pinVerifiedNicks.has(normalizeNick(a.nickname)) ? 10 : 0;
                const bPinOk = pinVerifiedNicks.has(normalizeNick(b.nickname)) ? 10 : 0;
                if (aPinOk !== bPinOk) return bPinOk - aPinOk;
                const scA = getNickMatchScore(a.nickname, a.address?.realname || "", lockedFullNick || rawNickInput);
                const scB = getNickMatchScore(b.nickname, b.address?.realname || "", lockedFullNick || rawNickInput);
                return scB - scA;
            });

            const bestNick = lockedFullNick || step1[0].nickname;
            const bestNorm = normalizeNick(bestNick);
            const bestHandle = cleanHandle(bestNick);
            const bestHasExplicitHandle = /-[a-zA-Z0-9_]{1,10}$/.test(String(bestNick).trim());

            // ⚠️ 최종 필터: 홍당무-3k4와 홍당무-5kj가 절대 한 화면에 섞이지 않도록 분리!
            return step1.filter(item => {
                const itemNorm = normalizeNick(item.nickname);
                if (itemNorm === bestNorm) return true;

                // 만약 둘 다 서로 다른 명시적 핸들(-3k4 vs -5kj)을 가지고 있다면, 설령 비밀번호 뒷자리가 우연히 같더라도 다른 계정일 수 있으므로 비밀번호까지 둘 다 일치할 때만 허용하고 그 외에는 칼같이 분리!
                const itemHasExplicitHandle = /-[a-zA-Z0-9_]{1,10}$/.test(String(item.nickname).trim());
                if (bestHasExplicitHandle && itemHasExplicitHandle && itemNorm !== bestNorm) {
                    const itemPin = normalizePin4(item.phoneLast4 || (item.address?.phone ? String(item.address.phone).slice(-4) : ""));
                    return Boolean(itemPin && normInPin && itemPin === normInPin);
                }

                // 한쪽은 핸들이 있고(홍당무-3k4) 예전 방송에는 핸들 없이(홍당무) 적힌 경우: 뒷 4자리 번호가 다르면 차단, 같거나 없을 때만 같은 사람으로 연결
                if (bestHandle && cleanHandle(item.nickname) === bestHandle) {
                    const itemPin = normalizePin4(item.phoneLast4 || (item.address?.phone ? String(item.address.phone).slice(-4) : ""));
                    if (itemPin && normInPin && itemPin !== normInPin) return false;
                    // 홍당무1 vs 홍당무2 처럼 숫자가 다르면 차단
                    if (getNickMatchScore(item.nickname, "", bestNick) <= 0) return false;
                    return true;
                }
                return false;
            });
        };

        const fetchGasWithRetry = async (url, options = {}, retries = 2) => {
            for (let i = 0; i <= retries; i++) {
                try {
                    const controller = new AbortController();
                    const timer = setTimeout(() => controller.abort(), 12000);
                    const res = await fetch(url, { ...options, redirect: 'follow', signal: controller.signal });
                    clearTimeout(timer);
                    const text = await res.text();
                    return JSON.parse(text);
                } catch (err) {
                    if (i === retries) throw err;
                    await new Promise(r => setTimeout(r, 400));
                }
            }
        };

        const fetchSheetDirectGviz = async (sheetId, sheetName) => {
            try {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 5500);
                const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}&headers=1&t=${Date.now()}`;
                const response = await fetch(url, { signal: controller.signal });
                clearTimeout(timer);
                const text = await response.text();
                const jsonStart = text.indexOf('{');
                const jsonEnd = text.lastIndexOf('}');
                if (jsonStart === -1 || jsonEnd === -1) return null;
                const res = JSON.parse(text.substring(jsonStart, jsonEnd + 1));
                if (!res || res.status === 'error' || !res.table) return null;
                const cols = (res.table.cols || []).map((c, idx) => String(c?.label || '').trim() || `col_${idx}`);
                return (res.table.rows || []).map(r => {
                    const obj = {};
                    (r.c || []).forEach((cell, idx) => {
                        const val = cell ? (cell.f !== undefined && cell.f !== null ? String(cell.f) : (cell.v !== undefined && cell.v !== null ? String(cell.v) : '')) : '';
                        obj[cols[idx] || `col_${idx}`] = val;
                        obj[`col_${idx}`] = val;
                    });
                    return obj;
                });
            } catch (e) {
                return null;
            }
        };

        const lookupOrderFromStaffSheetDirect = async (rawNick, cleanPin, forceFresh = false) => {
            const normInPin = normalizePin4(cleanPin);
            let rows = (!forceFresh && portalSheetCache.staffOrderRows) ? portalSheetCache.staffOrderRows : null;
            if (!rows) {
                rows = await preloadPortalDataInBackground(forceFresh);
            }
            if (!Array.isArray(rows) || rows.length === 0) {
                return { status: 'not_found', historyList: [], validSheetBroadcasts: [] };
            }

            let curBName = '기본방송';
            let curMeta = { fThresh: 70000, dShip: 4000, cRate: 10 };
            const blocks = {};
            const validBroadcastNames = new Set();

            const ensureBlock = (bTitle) => {
                const cleanB = cleanBroadcastKey(bTitle) || '기본방송';
                if (cleanB === '10/24 라이브' || cleanB === '오늘의방송' || cleanB === '기본방송') {
                    return { bName: cleanB, fThresh: 70000, dShip: 4000, cRate: 10, custMap: {} };
                }
                validBroadcastNames.add(cleanB);
                if (!blocks[cleanB]) {
                    blocks[cleanB] = {
                        bName: cleanB,
                        fThresh: curMeta.fThresh,
                        dShip: curMeta.dShip,
                        cRate: curMeta.cRate,
                        custMap: {}
                    };
                }
                return blocks[cleanB];
            };

            rows.forEach((r, idx) => {
                const nick = String(r['닉네임'] || r['주문자'] || r.col_0 || '').trim();
                const prod = String(r['상품명'] || r['품목'] || r.col_1 || '').trim();
                const qtyVal = r['수량'] ?? r.col_2;
                const priceVal = r['단가(제품금액)'] ?? r.col_3;
                const shipVal = r['배송비'] ?? r.col_4;
                const realname = String(r['수령인명'] ?? r.col_7 ?? '').trim();
                const phone = String(r['연락처'] ?? r.col_8 ?? '').trim();

                const isImplicitMeta = (!nick && prod && prod !== '상품명' && !realname && !phone && (Number(qtyVal) >= 10000 || Number(priceVal) === 4000 || Number(shipVal) === 10));
                if (nick.startsWith('___WORKSPACE') || isImplicitMeta) {
                    if (prod) curBName = cleanBroadcastKey(prod);
                    curMeta = {
                        fThresh: Number(qtyVal) > 0 ? Number(qtyVal) : 70000,
                        dShip: (priceVal !== '' && Number(priceVal) >= 0) ? Number(priceVal) : 4000,
                        cRate: Number(shipVal) > 0 ? Number(shipVal) : 10
                    };
                    ensureBlock(curBName);
                    return;
                }
                if (!nick || nick === '닉네임' || nick === '주문자') return;
                if (curBName === '10/24 라이브' || curBName === '오늘의방송' || curBName === '기본방송') return;
                if (prod.includes('222222')) return;
                const blk = ensureBlock(curBName);
                if (!blk.custMap[nick]) blk.custMap[nick] = [];
                blk.custMap[nick].push({ r, idx });
            });

            portalSheetCache.validSheetBroadcasts = Array.from(validBroadcastNames);

            const matchedCards = [];
            let wrongPinDetected = false;

            Object.values(blocks).forEach(blk => {
                if (blk.bName === '기본방송' || blk.bName === '오늘의방송' || blk.bName === '10/24 라이브') return;
                Object.keys(blk.custMap).forEach(custNick => {
                    const entries = blk.custMap[custNick];
                    const firstR = entries[0].r;
                    const rReal = String(firstR['수령인명'] || firstR.col_7 || '').trim();
                    const sc = getNickMatchScore(custNick, rReal, rawNick);
                    if (sc <= 0) return;

                    let sheetPin = '';
                    let sheetPhone = '';
                    let sheetAddr = '';
                    let sheetMemo = '';
                    let isVip = false;
                    let isConfirmed = false;
                    let cardStr = '';
                    let shipNum = blk.dShip;
                    let depTotal = 0;
                    let depositsArr = [];
                    const trkSet = new Set();
                    const itemsArr = [];

                    entries.forEach((ent, eIdx) => {
                        const row = ent.r;
                        const col9Val = String(row.col_9 || '').trim();
                        const isCol9Zip = /^\(\d{5}\)$/.test(col9Val) || /^\d{5}$/.test(col9Val);
                        const shift = isCol9Zip ? 1 : 0;

                        const p = normalizePin4(row['비밀번호'] || row[`col_${14 + shift}`]);
                        const ph = fixPhoneStr(row['연락처'] || row.col_8);
                        if (p && !sheetPin) sheetPin = p;
                        if (ph && !sheetPhone) sheetPhone = ph;

                        const rawA = String(row['주소'] || row[`col_${9 + shift}`] || '').replace(/^\(\d{5}\)\s*/, '').trim();
                        if (rawA && !sheetAddr) sheetAddr = rawA;

                        const rawM = String(row['요청사항'] || row[`col_${10 + shift}`] || '').trim();
                        if (rawM && !sheetMemo) sheetMemo = rawM;

                        if (String(row['VIP여부'] || row[`col_${11 + shift}`] || '').trim() === 'O') isVip = true;
                        if (String(row['주문확인'] || row[`col_${15 + shift}`] || '').trim() === 'O') isConfirmed = true;
                        if (row['카드결제'] && !cardStr) cardStr = String(row['카드결제']).trim();

                        if (eIdx === 0 && row['배송비'] !== undefined && row['배송비'] !== '') {
                            const sVal = Number(String(row['배송비']).replace(/[^0-9.-]/g, ''));
                            if (!isNaN(sVal)) shipNum = sVal;
                        }
                        const dVal = Number(String(row['입금액'] || '0').replace(/[^0-9.-]/g, '')) || 0;
                        if (dVal > 0) depTotal += dVal;

                        const depJson = String(row['입금내역JSON'] || row[`col_${16 + shift}`] || '').trim();
                        if (depJson) {
                            try {
                                const parsed = JSON.parse(depJson);
                                if (Array.isArray(parsed)) depositsArr = parsed;
                            } catch (e) {}
                        }
                        const trk = String(row['송장번호'] || row[`col_${17 + shift}`] || '').replace(/^'+/, '').trim();
                        if (trk) trkSet.add(trk);

                        const prodName = String(row['상품명'] || row.col_1 || '').trim();
                        if (prodName) {
                            const wStr = String(row['대기여부'] || row[`col_${13 + shift}`] || '').trim();
                            const isW = wStr === 'O' || wStr.includes('대기');
                            const wM = wStr.match(/(\d+)/);
                            itemsArr.push({
                                id: eIdx + 1,
                                product: prodName,
                                qty: Number(String(row['수량'] || row.col_2 || '1').replace(/[^0-9.-]/g, '')) || 1,
                                price: Number(String(row['단가(제품금액)'] || row.col_3 || '0').replace(/[^0-9.-]/g, '')) || 0,
                                isWaitlist: isW,
                                waitlistOrder: wM ? Number(wM[1]) : (isW ? 1 : 0)
                            });
                        }
                    });

                    const effPin = sheetPin || (sheetPhone.length >= 4 ? normalizePin4(sheetPhone.slice(-4)) : '');
                    if (effPin && normInPin && effPin !== normInPin) {
                        wrongPinDetected = true;
                        return;
                    }

                    matchedCards.push({
                        sheetTabName: '주문_' + blk.bName,
                        nickname: custNick,
                        phoneLast4: effPin || '',
                        broadcastName: blk.bName,
                        isVip: isVip,
                        credit: 0,
                        freeShippingThreshold: blk.fThresh,
                        cardFeeRate: blk.cRate,
                        isCard: cardStr,
                        shipping: isVip ? 0 : shipNum,
                        depositTotal: depTotal,
                        deposits: depositsArr,
                        items: itemsArr,
                        address: (sheetAddr || rReal) ? {
                            realname: rReal,
                            phone: sheetPhone,
                            zipcode: '',
                            baseAddress: sheetAddr,
                            detailAddress: '',
                            memo: sheetMemo,
                            updatedAt: ''
                        } : null,
                        trackingNumbers: Array.from(trkSet),
                        isConfirmed: isConfirmed,
                        _fromStaffSheet: true
                    });
                });
            });

            if (matchedCards.length > 0) {
                return {
                    status: 'success',
                    historyList: matchedCards,
                    validSheetBroadcasts: Array.from(validBroadcastNames)
                };
            }
            if (wrongPinDetected) {
                return {
                    status: 'error',
                    errorType: 'WRONG_PIN',
                    historyList: [],
                    validSheetBroadcasts: Array.from(validBroadcastNames)
                };
            }
            return {
                status: 'not_found',
                historyList: [],
                validSheetBroadcasts: Array.from(validBroadcastNames)
            };
        };

        // 🔴 사장님의 마스터 구글 시트(DEFAULT_MASTER_SHEET_ID) '메인주문' 탭에서 현재 생방송 중인 주문을 직접 읽어오는 함수!
        const lookupOrderFromBossLiveSheetDirect = async (rawNick, cleanPin, forceFresh = false) => {
            const normInPin = normalizePin4(cleanPin);
            let rows = (!forceFresh && Array.isArray(portalSheetCache.bossLiveOrderRows)) ? portalSheetCache.bossLiveOrderRows : null;
            if (!rows) {
                const now = Date.now();
                const gvizP = fetchSheetDirectGviz(DEFAULT_MASTER_SHEET_ID, '메인주문').catch(() => null);
                const gasP = fetchGasWithRetry(`${DEFAULT_GAS_URL}?action=get_orders&masterId=${DEFAULT_MASTER_SHEET_ID}&tabName=${encodeURIComponent('메인주문')}&t=${now}`, {}, 1)
                    .then(res => (res && Array.isArray(res.data)) ? res.data : null)
                    .catch(() => null);
                rows = await Promise.race([
                    gvizP.then(r => (Array.isArray(r) && r.length > 0) ? r : gasP),
                    gasP.then(r => (Array.isArray(r) && r.length > 0) ? r : gvizP)
                ]);
                if (Array.isArray(rows)) portalSheetCache.bossLiveOrderRows = rows;
            }
            if (!Array.isArray(rows) || rows.length === 0) {
                return { status: 'not_found', historyList: [] };
            }

            let curBName = '오늘의 라이브';
            let curMeta = { fThresh: 70000, dShip: 4000, cRate: 10 };
            const blocks = {};

            const ensureBossBlock = (bTitle) => {
                const cleaned = cleanBroadcastKey(bTitle);
                const finalTitle = (!cleaned || cleaned === '오늘의방송' || cleaned === '기본방송') ? '오늘의 라이브' : cleaned;
                if (!blocks[finalTitle]) {
                    blocks[finalTitle] = {
                        bName: finalTitle,
                        fThresh: curMeta.fThresh,
                        dShip: curMeta.dShip,
                        cRate: curMeta.cRate,
                        custMap: {}
                    };
                }
                return blocks[finalTitle];
            };

            rows.forEach((r, idx) => {
                const nick = String(r['닉네임'] || r['주문자'] || r.col_0 || '').trim();
                const prod = String(r['상품명'] || r['품목'] || r.col_1 || '').trim();
                const qtyVal = r['수량'] ?? r.col_2;
                const priceVal = r['단가(제품금액)'] ?? r.col_3;
                const shipVal = r['배송비'] ?? r.col_4;
                const realname = String(r['수령인명'] ?? r.col_7 ?? '').trim();
                const phone = String(r['연락처'] ?? r.col_8 ?? '').trim();

                const isImplicitMeta = (!nick && prod && prod !== '상품명' && !realname && !phone && (Number(qtyVal) >= 10000 || Number(priceVal) === 4000 || Number(shipVal) === 10));
                if (nick.startsWith('___WORKSPACE') || isImplicitMeta) {
                    if (prod) {
                        const cleaned = cleanBroadcastKey(prod);
                        curBName = (cleaned === '오늘의방송' || cleaned === '기본방송' || !cleaned) ? '오늘의 라이브' : cleaned;
                    }
                    curMeta = {
                        fThresh: Number(qtyVal) > 0 ? Number(qtyVal) : 70000,
                        dShip: (priceVal !== '' && Number(priceVal) >= 0) ? Number(priceVal) : 4000,
                        cRate: Number(shipVal) > 0 ? Number(shipVal) : 10
                    };
                    ensureBossBlock(curBName);
                    return;
                }
                if (!nick || nick === '닉네임' || nick === '주문자') return;
                if (prod.includes('222222')) return;
                const blk = ensureBossBlock(curBName);
                if (!blk.custMap[nick]) blk.custMap[nick] = [];
                blk.custMap[nick].push({ r, idx });
            });

            const matchedCards = [];
            let wrongPinDetected = false;

            Object.values(blocks).forEach(blk => {
                Object.keys(blk.custMap).forEach(custNick => {
                    const entries = blk.custMap[custNick];
                    const firstR = entries[0].r;
                    const rReal = String(firstR['수령인명'] || firstR.col_7 || '').trim();
                    const sc = getNickMatchScore(custNick, rReal, rawNick);
                    if (sc <= 0) return;

                    let sheetPin = '';
                    let sheetPhone = '';
                    let sheetAddr = '';
                    let sheetMemo = '';
                    let isVip = false;
                    let isConfirmed = false;
                    let cardStr = '';
                    let shipNum = blk.dShip;
                    let depTotal = 0;
                    let depositsArr = [];
                    const trkSet = new Set();
                    const itemsArr = [];

                    entries.forEach((ent, eIdx) => {
                        const row = ent.r;
                        const col9Val = String(row.col_9 || '').trim();
                        const isCol9Zip = /^\(\d{5}\)$/.test(col9Val) || /^\d{5}$/.test(col9Val);
                        const shift = isCol9Zip ? 1 : 0;

                        const p = normalizePin4(row['비밀번호'] || row[`col_${14 + shift}`]);
                        const ph = fixPhoneStr(row['연락처'] || row.col_8);
                        if (p && !sheetPin) sheetPin = p;
                        if (ph && !sheetPhone) sheetPhone = ph;

                        const rawA = String(row['주소'] || row[`col_${9 + shift}`] || '').replace(/^\(\d{5}\)\s*/, '').trim();
                        if (rawA && !sheetAddr) sheetAddr = rawA;

                        const rawM = String(row['요청사항'] || row[`col_${10 + shift}`] || '').trim();
                        if (rawM && !sheetMemo) sheetMemo = rawM;

                        if (String(row['VIP여부'] || row[`col_${11 + shift}`] || '').trim() === 'O') isVip = true;
                        if (String(row['주문확인'] || row[`col_${15 + shift}`] || '').trim() === 'O') isConfirmed = true;
                        if (row['카드결제'] && !cardStr) cardStr = String(row['카드결제']).trim();

                        if (eIdx === 0 && row['배송비'] !== undefined && row['배송비'] !== '') {
                            const sVal = Number(String(row['배송비']).replace(/[^0-9.-]/g, ''));
                            if (!isNaN(sVal)) shipNum = sVal;
                        }
                        const dVal = Number(String(row['입금액'] || '0').replace(/[^0-9.-]/g, '')) || 0;
                        if (dVal > 0) depTotal += dVal;

                        const depJson = String(row['입금내역JSON'] || row[`col_${16 + shift}`] || '').trim();
                        if (depJson) {
                            try {
                                const parsed = JSON.parse(depJson);
                                if (Array.isArray(parsed)) depositsArr = parsed;
                            } catch (e) {}
                        }
                        const trk = String(row['송장번호'] || row[`col_${17 + shift}`] || '').replace(/^'+/, '').trim();
                        if (trk) trkSet.add(trk);

                        const prodName = String(row['상품명'] || row.col_1 || '').trim();
                        if (prodName) {
                            const wStr = String(row['대기여부'] || row[`col_${13 + shift}`] || '').trim();
                            const isW = wStr === 'O' || wStr.includes('대기');
                            const wM = wStr.match(/(\d+)/);
                            itemsArr.push({
                                id: eIdx + 1,
                                product: prodName,
                                qty: Number(String(row['수량'] || row.col_2 || '1').replace(/[^0-9.-]/g, '')) || 1,
                                price: Number(String(row['단가(제품금액)'] || row.col_3 || '0').replace(/[^0-9.-]/g, '')) || 0,
                                isWaitlist: isW,
                                waitlistOrder: wM ? Number(wM[1]) : (isW ? 1 : 0)
                            });
                        }
                    });

                    if (itemsArr.length === 0) return;

                    const effPin = sheetPin || (sheetPhone.length >= 4 ? normalizePin4(sheetPhone.slice(-4)) : '');
                    if (effPin && normInPin && effPin !== normInPin) {
                        wrongPinDetected = true;
                        return;
                    }

                    matchedCards.push({
                        sheetTabName: '메인주문',
                        nickname: custNick,
                        phoneLast4: effPin || '',
                        broadcastName: blk.bName,
                        isVip: isVip,
                        credit: 0,
                        freeShippingThreshold: blk.fThresh,
                        cardFeeRate: blk.cRate,
                        isCard: cardStr,
                        shipping: isVip ? 0 : shipNum,
                        depositTotal: depTotal,
                        deposits: depositsArr,
                        items: itemsArr,
                        address: (sheetAddr || rReal) ? {
                            realname: rReal,
                            phone: sheetPhone,
                            zipcode: '',
                            baseAddress: sheetAddr,
                            detailAddress: '',
                            memo: sheetMemo,
                            updatedAt: ''
                        } : null,
                        trackingNumbers: Array.from(trkSet),
                        isConfirmed: isConfirmed,
                        _isLiveSource: true
                    });
                });
            });

            if (matchedCards.length > 0) {
                return { status: 'success', historyList: matchedCards };
            }
            if (wrongPinDetected) {
                return { status: 'error', errorType: 'WRONG_PIN', historyList: [] };
            }
            return { status: 'not_found', historyList: [] };
        };

        const lookupOrderFromFirebase = async (rawNick, cleanPin) => {
            if (!portalFbDb) return { status: 'not_found', historyList: [] };
            const normInPin = normalizePin4(cleanPin);
            try {
                let rootVal = portalSheetCache.fbSnapshot;
                if (!rootVal) {
                    const snap = await portalFbDb.ref('ember_live_data').once('value');
                    rootVal = snap.val() || {};
                    portalSheetCache.fbSnapshot = rootVal;
                }

                const ordersVal = rootVal._portal_orders || {};
                const bcastAddrsVal = rootVal._portal_broadcast_addresses || {};
                const confVal = rootVal._portal_confirmed || {};
                const bcastConfVal = rootVal._portal_broadcast_confirmed || {};
                const credVal = rootVal._portal_credits || {};

                const matchedList = [];
                let wrongPinDetected = false;

                Object.keys(ordersVal).forEach(safeBKey => {
                    const node = ordersVal[safeBKey];
                    if (!node || !Array.isArray(node.customers)) return;
                    const isLiveNode = safeBKey === '__MAIN_LIVE__';
                    const bName = cleanBroadcastKey(node.broadcastName || safeBKey);

                    node.customers.forEach(cust => {
                        if (!cust || !cust.nickname) return;
                        const sc = getNickMatchScore(cust.nickname, cust.address?.realname || '', rawNick);
                        if (sc <= 0) return;

                        const cPin = normalizePin4(cust.phoneLast4 || (cust.address?.phone ? String(cust.address.phone).slice(-4) : ''));
                        if (cPin && normInPin && cPin !== normInPin) {
                            wrongPinDetected = true;
                            return;
                        }

                        const safeNickKey = String(cust.nickname).replace(/[.#$\[\]\/]/g, '_');
                        const allAddrsVal = rootVal._portal_addresses || {};
                        const bAddr = bcastAddrsVal[safeBKey]?.[safeNickKey]
                            || Object.values(bcastAddrsVal[safeBKey] || {}).find(x => x && normalizeNick(x.nickname) === normalizeNick(cust.nickname))
                            || allAddrsVal[safeNickKey]
                            || Object.values(allAddrsVal).find(x => x && normalizeNick(x.nickname) === normalizeNick(cust.nickname));
                        const credEntry = credVal[safeNickKey] || Object.values(credVal).find(x => x && normalizeNick(x.nickname) === normalizeNick(cust.nickname));
                        const isBcastConf = Boolean(
                            bcastConfVal[safeBKey]?.[safeNickKey] ||
                            Object.values(bcastConfVal[safeBKey] || {}).some(x => x && normalizeNick(x.nickname) === normalizeNick(cust.nickname))
                        );
                        const isGlobalConf = Boolean(
                            confVal[safeNickKey] &&
                            (!confVal[safeNickKey].broadcastName || normalizeNick(cleanBroadcastKey(confVal[safeNickKey].broadcastName)) === normalizeNick(bName))
                        );
                        const isConf = Boolean(cust.isConfirmed || isBcastConf || isGlobalConf);

                        matchedList.push({
                            ...cust,
                            broadcastName: bName,
                            sheetTabName: isLiveNode ? '메인주문' : ('주문_' + bName),
                            phoneLast4: cPin || (bAddr?.phone ? normalizePin4(String(bAddr.phone).slice(-4)) : ''),
                            credit: credEntry ? Number(credEntry.credit || 0) : (Number(cust.credit) || 0),
                            creditLogs: credEntry && Array.isArray(credEntry.logs) ? credEntry.logs : [],
                            creditUpdatedAt: credEntry?.updatedAtStr || '',
                            address: bAddr ? {
                                realname: bAddr.realname || cust.address?.realname || '',
                                phone: fixPhoneStr(bAddr.phone || cust.address?.phone || ''),
                                zipcode: '',
                                baseAddress: String(bAddr.address || bAddr.baseAddress || '').replace(/^\(\d{5}\)\s*/, '').trim(),
                                detailAddress: '',
                                memo: bAddr.memo ?? cust.address?.memo ?? '',
                                updatedAt: bAddr.updatedAt || ''
                            } : cust.address,
                            isConfirmed: isConf,
                            _hasBcastCustomAddr: Boolean(bAddr && (bAddr.address || bAddr.baseAddress)),
                            _isLiveSource: isLiveNode,
                            _fromStaffRealtime: Boolean(node.updatedBy === 'staff')
                        });
                    });
                });

                if (matchedList.length > 0) {
                    return { status: 'success', historyList: matchedList };
                }
                if (wrongPinDetected) {
                    return { status: 'error', errorType: 'WRONG_PIN', historyList: [] };
                }
                return { status: 'not_found', historyList: [] };
            } catch (e) {
                return { status: 'not_found', historyList: [] };
            }
        };

        const lookupCustomerCsRecords = async (nickCandidates, cleanPin) => {
            const nicks = (Array.isArray(nickCandidates) ? nickCandidates : [nickCandidates]).filter(Boolean);
            if (nicks.length === 0) return [];
            const normInPin = normalizePin4(cleanPin);

            try {
                let rootVal = portalSheetCache.fbSnapshot;
                if (!rootVal && portalFbDb) {
                    const snap = await portalFbDb.ref('ember_live_data').once('value');
                    rootVal = snap.val() || {};
                    portalSheetCache.fbSnapshot = rootVal;
                }
                if (rootVal) {
                    const csVal = rootVal._portal_cs;
                    const accVal = rootVal._portal_cs_accounts || {};
                    if (csVal && Array.isArray(csVal.items)) {
                        return csVal.items.filter(c => {
                            if (!c || !c.nick) return false;
                            const cPin = normalizePin4(c.phone ? String(c.phone).slice(-4) : '');
                            if (cPin && normInPin && cPin !== normInPin) return false;
                            return nicks.some(n => getNickMatchScore(c.nick, c.realname || '', n) >= 2);
                        }).map(c => ({
                            ...c,
                            refundAccount: accVal[c.id]?.refundAccount ?? c.refundAccount ?? ''
                        }));
                    }
                }
            } catch (e) {}
            return [];
        };

        const formatTrackingDisplay = (trk) => {
            const d = String(trk || '').replace(/[^0-9]/g, '');
            if (d.length === 12) return `${d.slice(0, 4)}-${d.slice(4, 8)}-${d.slice(8)}`;
            return trk;
        };

        const PortalApp = () => {
            const [nickInput, setNickInput] = useState("");
            const [pinInput, setPinInput] = useState("");
            const [loginError, setLoginError] = useState("");
            const [isLoading, setIsLoading] = useState(false);
            const [isRefreshing, setIsRefreshing] = useState(false);

            const [orderHistoryList, setOrderHistoryList] = useState([]);
            const [selectedBroadcastIdx, setSelectedBroadcastIdx] = useState(0);
            const [currentUser, setCurrentUser] = useState(null);
            const [customerCsList, setCustomerCsList] = useState([]);
            const [editingCsAccountMap, setEditingCsAccountMap] = useState({});

            const [isEditingAddress, setIsEditingAddress] = useState(false);
            const [isSavingAddress, setIsSavingAddress] = useState(false);
            const [isPostcodeModalOpen, setIsPostcodeModalOpen] = useState(false);
            const postcodeContainerRef = useRef(null);
            const [addrForm, setAddrForm] = useState({ realname: "", phone: "", zipcode: "", baseAddress: "", detailAddress: "", memo: "" });
            const [agreePrivacy, setAgreePrivacy] = useState(false);
            const [agreeThirdParty, setAgreeThirdParty] = useState(false);

            const [isDepositHistoryOpen, setIsDepositHistoryOpen] = useState(false);
            const [isCreditHistoryOpen, setIsCreditHistoryOpen] = useState(false);
            const [trackingMap, setTrackingMap] = useState({});
            const [toastMsg, setToastMsg] = useState("");
            const [showBizFooter, setShowBizFooter] = useState(false);

            // 📢 실시간 공지사항 팝업 상태 및 관리자 바로 수정 모달 상태
            const [noticeConfig, setNoticeConfig] = useState({ enabled: false, title: "📢 엠버언니 공지사항", content: "", updatedAt: 0 });
            const [isNoticePopupOpen, setIsNoticePopupOpen] = useState(false);
            const [isAdminNoticeModalOpen, setIsAdminNoticeModalOpen] = useState(false);
            const [adminPinInput, setAdminPinInput] = useState("");
            const [isAdminVerified, setIsAdminVerified] = useState(false);
            const [editNoticeForm, setEditNoticeForm] = useState({ enabled: true, title: "📢 엠버언니 공지사항", content: "" });
            const logoClickCountRef = useRef(0);
            const logoClickTimerRef = useRef(null);

            // ⚡ 고객이 포털에 접속하여 닉네임과 비밀번호를 입력하는 동안 백그라운드에서 시트와 파이어베이스 데이터를 미리 로드!
            useEffect(() => {
                preloadPortalDataInBackground(false);

                const handleSnap = (snap) => {

                    portalSheetCache.fbSnapshot = val;

                    // 📢 실시간 공지사항 동기화

                    if (nc && typeof nc === 'object') {
                        setNoticeConfig({
                            enabled: Boolean(nc.enabled),
                            title: nc.title || "📢 엠버언니 공지사항",
                            content: nc.content || "",
                            updatedAt: Number(nc.updatedAt) || 0
                        });
                        if (nc.enabled && String(nc.content || "").trim() !== "") {
                            const todayStr = new Date().toLocaleDateString('ko-KR');
                            const dismissKey = `ember_notice_hide_${nc.updatedAt || 0}`;
                            let isDismissedToday = false;
                            try {
                                isDismissedToday = localStorage.getItem(dismissKey) === todayStr;

                            if (!isDismissedToday) {
                                setIsNoticePopupOpen(true);

                        } else {
                            setIsNoticePopupOpen(false);
                        }
                    }
                };
                ref.on('value', handleSnap);
                return () => ref.off('value', handleSnap);
            }, []);

            const handleDismissNoticeToday = () => {
                try {
                    const todayStr = new Date().toLocaleDateString('ko-KR');
                    const dismissKey = `ember_notice_hide_${noticeConfig.updatedAt || 0}`;
                    localStorage.setItem(dismissKey, todayStr);
                } catch (e) {}
                setIsNoticePopupOpen(false);
            };

            const handleOpenAdminNoticeEditor = () => {
                setEditNoticeForm({
                    enabled: noticeConfig.enabled,
                    title: noticeConfig.title || "📢 엠버언니 공지사항",
                    content: noticeConfig.content || ""
                });
                setIsAdminNoticeModalOpen(true);
            };

            const handleLogoSecretClick = () => {
                logoClickCountRef.current += 1;
                clearTimeout(logoClickTimerRef.current);
                if (logoClickCountRef.current >= 3) {
                    logoClickCountRef.current = 0;
                    handleOpenAdminNoticeEditor();
                } else {
                    logoClickTimerRef.current = setTimeout(() => {
                        logoClickCountRef.current = 0;
                    }, 900);
                }
            };

            const handleSaveAdminNotice = async (e) => {
                if (e && e.preventDefault) e.preventDefault();
                if (!portalFbDb) return;
                const payload = {
                    enabled: Boolean(editNoticeForm.enabled),
                    title: String(editNoticeForm.title || "📢 엠버언니 공지사항").trim(),
                    content: String(editNoticeForm.content || "").trim(),
                    updatedAt: Date.now()
                };
                await portalFbDb.ref('ember_live_data/_global_config/customerNotice').set(payload);
                setIsAdminNoticeModalOpen(false);
                showToast(payload.enabled ? "📢 고객 공지사항 팝업이 즉시 반영되었습니다!" : "공지사항 팝업이 숨김(OFF) 처리되었습니다.");
            };

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(""), 2600);
            };

            const copyText = (txt, label = "텍스트가") => {
                if (!txt) return;
                const ta = document.createElement("textarea");

                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand("copy"); showToast(`${label} 복사되었습니다!`); } catch (e) {}
                document.body.removeChild(ta);

            const initAddressState = (userObj) => {
                if (userObj && userObj.address && userObj.address.baseAddress) {

                        realname: userObj.address.realname || "",
                        phone: fixPhoneStr(userObj.address.phone || ""),
                        zipcode: userObj.address.zipcode || "",
                        baseAddress: String(userObj.address.baseAddress || "").replace(/^\(\d{5}\)\s*/, "").trim(),
                        detailAddress: userObj.address.detailAddress || "",
                        memo: userObj.address.memo || ""
                    });

                    setAddrForm({ realname: "", phone: "", zipcode: "", baseAddress: "", detailAddress: "", memo: "" });
                    setIsEditingAddress(true);
