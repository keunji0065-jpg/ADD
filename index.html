                                    <div className="flex items-center justify-between pb-2.5 mb-2.5 border-b border-gray-200">
                                        <div className="flex flex-col min-w-0">
                                            <div className="flex items-center gap-1.5">
                                                <span className="text-[14px] font-extrabold text-gray-900 shrink-0">
                                                    [{cleanBroadcastKey(currentUser.broadcastName || '주문서')}] 배송지
                                                </span>
                                            </div>
                                            {currentUser.address && currentUser.address.baseAddress && currentUser.address.updatedAt && !isEditingAddress && (
                                                <span className="text-[11.5px] font-semibold text-gray-500 truncate mt-0.5">
                                                    최근 입력·확인: {formatKstDateString(currentUser.address.updatedAt)}
                                                </span>
                                            )}
                                        </div>
                                        {isAddressLockedByTracking ? (
                                            <span className="text-[11.5px] font-extrabold text-gray-600 bg-gray-100 px-2.5 py-1 rounded border border-gray-300 shrink-0 flex items-center gap-1">
                                                <Icon name="lock-key" weight="fill" size={13} className="text-gray-500" />
                                                <span>출고완료(변경불가)</span>
                                            </span>
                                        ) : (
                                            currentUser.address && !isEditingAddress && (
                                                <button 
                                                    onClick={() => {
                                                        setAddrForm({
                                                            realname: "",
                                                            phone: "",
                                                            zipcode: "",
                                                            baseAddress: "",
                                                            detailAddress: "",
                                                            memo: ""
                                                        });
                                                        setAgreePrivacy(false);
                                                        setAgreeThirdParty(false);
                                                        setIsEditingAddress(true);
                                                    }}
                                                    className="text-[12.5px] font-bold text-gray-800 bg-gray-100 hover:bg-gray-200 px-2.5 py-1 rounded border border-gray-300 shrink-0"
                                                >
                                                    변경
                                                </button>
                                            )
                                        )}
                                    </div>

                                    {(!isEditingAddress || isAddressLockedByTracking) && currentUser.address ? (
                                        <div className="text-[14px] space-y-1.5 bg-gray-50 p-3 rounded border border-gray-200">
                                            <div className="flex items-center gap-2 font-extrabold text-gray-900 text-[15px]">
                                                <span>{maskName(currentUser.address.realname)}</span>
                                                <span className="text-gray-300">·</span>
                                                <span>{maskPhone(currentUser.address.phone)}</span>
                                            </div>
                                            <div className="text-gray-800 leading-snug font-medium">
                                                {maskAddress(currentUser.address.baseAddress, currentUser.address.detailAddress, currentUser.address.zipcode)}
                                            </div>
                                            {currentUser.address.memo && (
                                                <div className="text-[13px] text-gray-600 pt-0.5">
                                                    메모: {currentUser.address.memo}
                                                </div>
                                            )}
                                        </div>
                                    ) : isAddressLockedByTracking ? (
                                        <div className="text-[13px] text-gray-500 bg-gray-50 p-3 rounded border border-gray-200 font-semibold">
                                            운송장이 등록(출고)되어 배송지 정보를 변경할 수 없습니다.
                                        </div>
                                    ) : (
                                        <form onSubmit={handleSaveAddress} className="space-y-2.5">
                                            {(!currentUser.address || !currentUser.address.baseAddress) && (
                                                <div className="bg-red-50 border border-red-200 text-red-600 rounded-lg px-3 py-2 text-[13px] font-extrabold flex items-center gap-1.5">
                                                    <Icon name="warning-circle" weight="fill" size={16} className="shrink-0" />
                                                    <span>등록된 배송지가 없습니다. 배송지를 입력해주세요.</span>
                                                </div>
                                            )}
                                            <div className="grid grid-cols-2 gap-2">
                                                <div>
                                                    <label className="block text-[12px] font-bold text-gray-700 mb-1">수령인 성함 *</label>
                                                    <input 
                                                        type="text"
                                                        value={addrForm.realname}
                                                        onChange={(e) => setAddrForm({...addrForm, realname: e.target.value})}
                                                        placeholder="홍길동"
                                                        className="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded text-[14px] font-bold outline-none focus:border-blue-600 focus:bg-white"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-[12px] font-bold text-gray-700 mb-1">연락처 (숫자만) *</label>
                                                    <input 
                                                        type="tel"
                                                        inputMode="numeric"
                                                        value={addrForm.phone}
                                                        onChange={(e) => setAddrForm({...addrForm, phone: e.target.value.replace(/[^0-9]/g, "")})}
                                                        placeholder="01012345678"
                                                        className="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded text-[14px] font-bold outline-none focus:border-blue-600 focus:bg-white"
                                                    />
                                                </div>
                                            </div>

                                            <div>
                                                <label className="block text-[12px] font-bold text-gray-700 mb-1">주소 *</label>
                                                <div className="flex gap-1.5 mb-2">
                                                    <input 
                                                        type="text"
                                                        readOnly
                                                        value={addrForm.zipcode}
                                                        placeholder="우편번호"
                                                        className="w-24 px-3 py-2 bg-gray-100 border border-gray-300 rounded text-[14px] text-gray-600"
                                                    />
                                                    <button 
                                                        type="button"
                                                        onClick={handleOpenPostcode}
                                                        className="bg-gray-800 hover:bg-black text-white px-3.5 py-2 rounded text-[13px] font-bold"
                                                    >
                                                        주소 검색
                                                    </button>
                                                </div>
                                                <input 
                                                    type="text"
                                                    readOnly
                                                    value={addrForm.baseAddress}
                                                    onClick={handleOpenPostcode}
                                                    placeholder="주소 검색을 눌러주세요"
                                                    className="w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded text-[14px] text-gray-800 mb-2 cursor-pointer"
                                                />
                                                <input 
                                                    type="text"
                                                    value={addrForm.detailAddress}
                                                    onChange={(e) => setAddrForm({...addrForm, detailAddress: e.target.value})}
                                                    placeholder="상세주소 (동, 호수 등)"
                                                    className="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded text-[14px] font-bold outline-none focus:border-blue-600 focus:bg-white"
                                                />
                                            </div>

                                            <div>
                                                <label className="block text-[12px] font-bold text-gray-700 mb-1">배송 메모</label>
                                                <input 
                                                    type="text"
                                                    value={addrForm.memo}
                                                    onChange={(e) => setAddrForm({...addrForm, memo: e.target.value})}
                                                    placeholder="예: 문 앞에 놓아주세요"
                                                    className="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded text-[14px] outline-none focus:border-blue-600 focus:bg-white"
                                                />
                                            </div>

                                            <div className="bg-gray-50 p-3 rounded-lg border border-gray-200 space-y-2.5">
                                                <div className="flex items-center justify-between border-b border-gray-200 pb-2">
                                                    <span className="text-[12.5px] font-extrabold text-gray-900 flex items-center gap-1">
                                                        <Icon name="shield-check" weight="fill" className="text-blue-600" size={15} />
                                                        <span>개인정보 수집·이용 및 제3자 제공 동의</span>
                                                    </span>
                                                    <label className="flex items-center gap-1.5 cursor-pointer">
                                                        <input 
                                                            type="checkbox" 
                                                            checked={agreePrivacy && agreeThirdParty} 
                                                            onChange={(e) => { 
                                                                setAgreePrivacy(e.target.checked); 
                                                                setAgreeThirdParty(e.target.checked); 
                                                            }} 
                                                            className="w-4 h-4 accent-blue-600 rounded" 
                                                        />
                                                        <span className="text-[12px] font-extrabold text-blue-700">전체 동의</span>
                                                    </label>
                                                </div>

                                                {/* 1. 개인정보 수집 및 이용 동의 */}
                                                <div className="space-y-1">
                                                    <label className="flex items-center gap-2 cursor-pointer">
                                                        <input 
                                                            type="checkbox" 
                                                            checked={agreePrivacy} 
                                                            onChange={(e) => setAgreePrivacy(e.target.checked)} 
                                                            className="w-3.5 h-3.5 accent-gray-900 rounded shrink-0" 
                                                        />
                                                        <span className="text-[12px] font-extrabold text-gray-900">
                                                            [필수] 개인정보 수집 및 이용 동의
                                                        </span>
                                                    </label>
                                                    <div className="bg-white border border-gray-200 rounded p-2 text-[11px] text-gray-600 leading-relaxed space-y-0.5 max-h-24 overflow-y-auto">
                                                        <div><strong className="text-gray-800">1. 수집 목적:</strong> 라이브 방송 주문 상품 배송, 본인 확인, 입금·결제 정산, 고객 상담 및 교환/반품(CS) 처리</div>
                                                        <div><strong className="text-gray-800">2. 수집 항목:</strong> 유튜브 닉네임, 수령인 성함, 연락처(휴대폰번호), 배송지 주소, 배송 메모, 환불 계좌정보(반품/환불 시)</div>
                                                        <div><strong className="text-gray-800">3. 보유 및 이용 기간:</strong> <span className="underline font-bold text-gray-800">수집일로부터 1년</span> (단, 관계법령에 따라 보존이 필요한 경우 해당 기간까지 보관 후 지체 없이 파기)</div>
                                                        <div className="text-[10.5px] text-gray-400 pt-0.5">※ 동의를 거부할 권리가 있으나, 미동의 시 상품 발송이 불가합니다.</div>
                                                    </div>
                                                </div>

                                                {/* 2. 개인정보 제3자 제공 동의 */}
                                                <div className="space-y-1 pt-0.5">
                                                    <label className="flex items-center gap-2 cursor-pointer">
                                                        <input 
                                                            type="checkbox" 
                                                            checked={agreeThirdParty} 
                                                            onChange={(e) => setAgreeThirdParty(e.target.checked)} 
                                                            className="w-3.5 h-3.5 accent-gray-900 rounded shrink-0" 
                                                        />
                                                        <span className="text-[12px] font-extrabold text-gray-900">
                                                            [필수] 배송을 위한 개인정보 제3자 제공 동의
                                                        </span>
                                                    </label>
                                                    <div className="bg-white border border-gray-200 rounded p-2 text-[11px] text-gray-600 leading-relaxed space-y-0.5 max-h-24 overflow-y-auto">
                                                        <div><strong className="text-gray-800">1. 제공받는 자:</strong> 롯데택배(롯데글로벌로지스) 및 계약 물류사</div>
                                                        <div><strong className="text-gray-800">2. 제공 목적:</strong> 주문 상품의 택배 배송, 배송 위치 추적 및 반품 수거 서비스 이행</div>
                                                        <div><strong className="text-gray-800">3. 제공 항목:</strong> 수령인 성함, 연락처(휴대폰번호), 배송지 주소, 배송 요청사항(메모)</div>
                                                        <div><strong className="text-gray-800">4. 보유 및 이용 기간:</strong> 배송 완료 후 3개월까지</div>
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="flex gap-2 pt-1">
                                                {currentUser.address && (
                                                    <button type="button" onClick={() => setIsEditingAddress(false)} className="flex-1 py-3 bg-gray-200 text-gray-700 font-bold rounded text-[14px]">
                                                        취소
                                                    </button>
                                                )}
                                                <button type="submit" disabled={isSavingAddress} className="flex-1 py-3 bg-gray-900 hover:bg-black text-white font-extrabold rounded text-[14px] shadow-sm transition-all">
                                                    {isSavingAddress ? "저장 중..." : "배송지 저장"}
                                                </button>
                                            </div>
                                        </form>
                                    )}

                                    <div className="mt-3 pt-3 border-t border-dashed border-gray-200">
                                        <div className="flex items-center justify-between mb-2">
                                            <span className="text-[13.5px] font-extrabold text-gray-900 flex items-center gap-1.5">
                                                <span className="inline-block w-2.5 h-2.5 rounded-full bg-[#E60012]"></span>
                                                <span>롯데택배 송장번호 · 실시간 이동흐름</span>
                                            </span>
                                            {userTrackingList.length > 0 && (
                                                <span className="text-[11px] font-extrabold text-[#E60012] bg-red-50 px-2 py-0.5 rounded border border-red-200">
                                                    출고 {userTrackingList.length}건
                                                </span>
                                            )}
                                        </div>

                                        {userTrackingList.length === 0 ? (
                                            <div className="bg-gray-50 border border-gray-200 rounded-lg px-3 py-2.5 text-[12.5px] text-gray-500 font-semibold flex items-center justify-between">
                                                <span>📦 상품 준비 중 (출고 후 송장번호와 이동흐름이 바로 표시됩니다)</span>
                                            </div>
                                        ) : (
                                            <div className="space-y-3">
                                                {userTrackingList.map((trk, tIdx) => {
                                                    const cleanDigits = String(trk).replace(/[^0-9]/g, '');
                                                    const trkInfo = trackingMap[cleanDigits] || { loading: true, steps: [] };
                                                    return (
                                                        <div key={tIdx} className="bg-white border-2 border-red-200 rounded-xl overflow-hidden shadow-sm">
                                                            <div className="bg-red-50/80 px-3 py-2.5 border-b border-red-100 flex items-center justify-between gap-2">
                                                                <div className="min-w-0">
                                                                    <div className="flex items-center gap-1.5">
                                                                        <span className="bg-[#E60012] text-white text-[10px] font-black px-1.5 py-0.5 rounded">롯데택배</span>
                                                                        <span className="text-[14.5px] font-black text-gray-900 tabular-nums tracking-tight">
                                                                            {formatTrackingDisplay(trk)}
                                                                        </span>
                                                                    </div>
                                                                    <div className="text-[12px] font-extrabold text-[#E60012] mt-1 flex items-center gap-1">
                                                                        <Icon name="truck" weight="fill" size={13} />
                                                                        <span>현재상태: {trkInfo.stateText || "배송 조회중..."}</span>
                                                                    </div>
                                                                </div>
                                                                <div className="flex items-center gap-1 shrink-0">
                                                                    <button
                                                                        type="button"
                                                                        onClick={() => copyText(cleanDigits, "송장번호가")}
                                                                        className="bg-white hover:bg-gray-100 text-gray-800 border border-gray-300 px-2.5 py-1.5 rounded-lg text-[11.5px] font-extrabold shadow-sm"
                                                                    >
                                                                        번호복사
                                                                    </button>
                                                                    <button
                                                                        type="button"
                                                                        onClick={() => fetchInlineTracking(cleanDigits, true)}
                                                                        className="bg-white hover:bg-gray-100 text-gray-700 border border-gray-300 p-1.5 rounded-lg text-[12px] font-bold shadow-sm"
                                                                    >
                                                                        <Icon name="arrows-clockwise" weight="bold" size={14} className={trkInfo.loading ? "animate-spin text-[#E60012]" : ""} />
                                                                    </button>
                                                                </div>
                                                            </div>
                                                            <div className="p-3 bg-white">
                                                                {trkInfo.loading ? (
                                                                    <div className="py-4 flex items-center justify-center gap-2 text-[12.5px] font-bold text-gray-500">
                                                                        <Icon name="spinner" className="animate-spin text-[#E60012]" size={18} />
                                                                        <span>실시간 택배 이동흐름을 불러오고 있습니다...</span>
                                                                    </div>
                                                                ) : trkInfo.steps && trkInfo.steps.length > 0 ? (
                                                                    <div className="relative pl-3.5 border-l-2 border-red-200 space-y-3 my-1 ml-1">
                                                                        {trkInfo.steps.map((st, sIdx) => (
                                                                            <div key={sIdx} className="relative">
                                                                                <span className={`absolute -left-[19px] top-1 w-2.5 h-2.5 rounded-full border-2 border-white ${sIdx === 0 ? 'bg-[#E60012] ring-2 ring-red-200' : 'bg-gray-300'}`}></span>
                                                                                <div className={`text-[13px] font-extrabold leading-snug ${sIdx === 0 ? 'text-gray-900' : 'text-gray-600'}`}>
                                                                                    {st.status}
                                                                                </div>
                                                                                <div className="text-[11.5px] font-semibold text-gray-500 flex items-center gap-1.5 mt-0.5">
                                                                                    <span className="text-gray-700 font-bold">📍 {st.location}</span>
                                                                                    <span>·</span>
                                                                                    <span className="tabular-nums">{st.time}</span>
                                                                                </div>
                                                                            </div>
                                                                        ))}
                                                                    </div>
                                                                ) : (
                                                                    <div className="py-3 px-3 bg-amber-50/80 border border-amber-200 rounded-lg text-center space-y-1">
                                                                        <div className="text-[13px] font-extrabold text-amber-900 flex items-center justify-center gap-1.5">
                                                                            <span>📦 현재 상품을 꼼꼼하게 포장 중입니다!</span>
                                                                        </div>
                                                                        <div className="text-[11.5px] text-amber-800 font-semibold leading-relaxed">
                                                                            롯데택배 운송장이 먼저 출력되어 포장 작업이 진행 중이며,<br/>
                                                                            롯데택배 기사님 수거(집하) 후 저녁부터 실시간 이동흐름이 표시됩니다.
                                                                        </div>
                                                                    </div>
                                                                )}
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )}
                                    </div>
                                </section>

                                {/* 3-2. 미송 / 교환 / 반품 내역 (직원용 CS메모는 비공개) */}
                                {customerCsList.length > 0 && (
                                    <section className="bg-white rounded-lg p-3.5 border-2 border-purple-200 shadow-sm space-y-3">
                                        <div className="flex items-center justify-between pb-2 border-b border-gray-200">
                                            <span className="text-[14px] font-extrabold text-gray-900 flex items-center gap-1.5">
                                                <Icon name="arrows-left-right" weight="bold" className="text-purple-600" size={16} />
                                                <span>미송 / 교환 / 반품 내역</span>
                                            </span>
                                            <span className="text-[11.5px] font-extrabold text-purple-700 bg-purple-50 px-2 py-0.5 rounded border border-purple-200">
                                                총 {customerCsList.length}건
                                            </span>
                                        </div>

                                        <div className="space-y-3">
                                            {customerCsList.map((cs, cIdx) => {
                                                const isDone = cs.csStatus === '처리완료';
                                                const hasReturnItem = (cs.items || []).some(it => it.csTag === '반품');
                                                const showRefundSection = Number(cs.refundAmount) > 0 || Boolean(cs.refundAccount) || hasReturnItem;
                                                const isEditingAcc = editingCsAccountMap[cs.id] !== undefined;
                                                const csTrackDigits = String(cs.csTracking || '').replace(/[^0-9]/g, '');
                                                const csTrkInfo = csTrackDigits ? (trackingMap[csTrackDigits] || { loading: true, steps: [] }) : null;

                                                return (
                                                    <div key={cs.id || cIdx} className="rounded-xl border border-gray-200 overflow-hidden bg-gray-50/60">
                                                        <div className="bg-white px-3 py-2 border-b border-gray-200 flex items-center justify-between gap-2">
                                                            <div className="flex items-center gap-1.5 min-w-0">
                                                                <Icon name="calendar-check" weight="fill" className="text-blue-600 shrink-0" size={14} />
                                                                <span className="text-[12.5px] font-extrabold text-gray-800 truncate">
                                                                    {cs.sourceBroadcast || '주문 내역'}
                                                                </span>
                                                            </div>
                                                            <span className={`text-[11px] font-extrabold px-2 py-0.5 rounded shrink-0 ${
                                                                isDone
                                                                    ? 'bg-emerald-600 text-white'
                                                                    : 'bg-amber-100 text-amber-800 border border-amber-300'
                                                            }`}>
                                                                {isDone ? '✅ 처리완료' : '⏳ 처리 진행중'}
                                                            </span>
                                                        </div>

                                                        <div className="p-3 bg-white divide-y divide-gray-100">
                                                            {(cs.items || []).map((it, idx) => {
                                                                const tag = it.csTag || '정상';
                                                                const badgeStyle =
                                                                    tag === '미송' ? 'bg-purple-100 text-purple-800 border-purple-300' :
                                                                    tag === '교환' ? 'bg-blue-50 text-blue-700 border-blue-200' :
                                                                    tag === '반품' ? 'bg-rose-50 text-rose-700 border-rose-200' :
                                                                    tag === '불량/오배송' ? 'bg-red-50 text-red-700 border-red-200' :
                                                                    'bg-gray-100 text-gray-600 border-gray-200';
                                                                return (
                                                                    <div key={idx} className="py-1.5 first:pt-0 last:pb-0 flex items-center justify-between gap-2 text-[13.5px]">
                                                                        <div className="flex items-center gap-1.5 min-w-0 flex-1">
                                                                            <span className={`text-[11px] font-extrabold px-1.5 py-0.5 rounded border shrink-0 ${badgeStyle}`}>
                                                                                {tag === '미송' ? '미송대기' : tag}
                                                                            </span>
                                                                            <span className="font-bold text-gray-900 truncate">{it.product}</span>
                                                                        </div>
                                                                        <div className="flex items-center gap-2 shrink-0 text-[13px]">
                                                                            <span className="font-bold text-gray-600">{it.qty}개</span>
                                                                            <span className="font-extrabold text-gray-900 tabular-nums">{Number(it.price || 0).toLocaleString()}원</span>
                                                                        </div>
                                                                    </div>
                                                                );
                                                            })}
                                                        </div>

                                                        {(showRefundSection || Number(cs.csFee) > 0 || cs.csTracking) && (
                                                            <div className="p-3 bg-gray-50 border-t border-gray-200 space-y-2 text-[13px]">
                                                                {showRefundSection && (
                                                                    <div className="bg-white p-2.5 rounded-lg border border-rose-200 space-y-2">
                                                                        <div className="flex items-center justify-between">
                                                                            <span className="font-extrabold text-gray-800">💸 환불예정 금액</span>
                                                                            <div className="flex items-center gap-1.5">
                                                                                <span className="text-[15px] font-black text-rose-600 tabular-nums">
                                                                                    {Number(cs.refundAmount || 0).toLocaleString()}원
                                                                                </span>
                                                                                <span className={`text-[11px] font-extrabold px-2 py-0.5 rounded ${
                                                                                    cs.convertedToCredit
                                                                                        ? 'bg-teal-600 text-white'
                                                                                        : cs.refundCompleted
                                                                                            ? 'bg-blue-600 text-white'
                                                                                            : 'bg-rose-50 text-rose-700 border border-rose-200'
                                                                                }`}>
                                                                                    {cs.convertedToCredit ? '💰 적립금전환완료' : (cs.refundCompleted ? '환불완료' : '환불대기')}
                                                                                </span>
                                                                            </div>
                                                                        </div>

                                                                        {!cs.convertedToCredit && (
                                                                            <div className="pt-2 border-t border-gray-100">
                                                                                <div className="flex items-center justify-between mb-1">
                                                                                    <span className="text-[12px] font-bold text-gray-600">🏦 환불 계좌번호</span>
                                                                                    {!cs.refundCompleted && !isEditingAcc && (
                                                                                        <button
                                                                                            type="button"
                                                                                            onClick={() => setEditingCsAccountMap(prev => ({ ...prev, [cs.id]: cs.refundAccount || '' }))}
                                                                                            className="text-[11.5px] font-extrabold text-blue-600 hover:underline"
                                                                                        >
                                                                                            {cs.refundAccount ? '계좌 수정' : '+ 계좌 입력하기'}
                                                                                        </button>
                                                                                    )}
                                                                                </div>
                                                                                {isEditingAcc ? (
                                                                                    <div className="flex gap-1.5 mt-1">
                                                                                        <input
                                                                                            type="text"
                                                                                            value={editingCsAccountMap[cs.id] || ''}
                                                                                            onChange={(e) => setEditingCsAccountMap(prev => ({ ...prev, [cs.id]: e.target.value }))}
                                                                                            placeholder="은행명 / 계좌번호 / 예금주 성함"
                                                                                            className="flex-1 px-2.5 py-1.5 bg-gray-50 border border-gray-300 rounded text-[13px] font-bold outline-none focus:border-blue-600 focus:bg-white"
                                                                                        />
                                                                                        <button
                                                                                            type="button"
                                                                                            onClick={() => handleSaveCustomerRefundAccount(cs.id)}
                                                                                            className="px-3 py-1.5 bg-gray-900 text-white rounded text-[12px] font-extrabold shrink-0"
                                                                                        >
                                                                                            저장
                                                                                        </button>
                                                                                    </div>
                                                                                ) : (
                                                                                    <div className="text-[13px] font-extrabold text-gray-900 bg-gray-50 px-2.5 py-1.5 rounded border border-gray-200">
                                                                                        {cs.refundAccount ? cs.refundAccount : <span className="text-gray-400 font-semibold">우측 상단 [+ 계좌 입력하기]를 눌러 환불계좌를 남겨주세요.</span>}
                                                                                    </div>
                                                                                )}
                                                                            </div>
                                                                        )}
                                                                    </div>
                                                                )}
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </section>
                                )}

                                {/* 4. 하단 최종 확인 버튼 & 카톡 채널 문의 */}
                                <section className="pt-0.5 space-y-2 safe-bottom">
                                    {currentUser.isConfirmed ? (
                                        <div className="w-full py-3 bg-green-600 text-white font-extrabold rounded-lg text-center text-[14px] flex items-center justify-center gap-1.5 shadow-sm">
                                            <Icon name="check-circle" weight="fill" size={17} />
                                            <span>주문 및 배송지 확정 완료</span>
                                        </div>
                                    ) : (
                                        <button 
                                            onClick={handleConfirmOrder}
                                            className="w-full py-3.5 bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-extrabold rounded-lg text-[14px] shadow-sm flex items-center justify-center gap-1.5 transition-all"
                                        >
                                            <Icon name="check-circle" weight="bold" size={17} />
                                            <span>주문내역·배송지 확정 (터치해야 발송됩니다)</span>
                                        </button>
                                    )}

                                    <a 
                                        href={KAKAO_CHANNEL_URL}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="w-full py-3 bg-[#FEE500] hover:bg-[#FADA0A] text-gray-900 font-extrabold rounded-lg text-[14px] flex items-center justify-center gap-1.5 shadow-sm"
                                    >
                                        <Icon name="chat-circle-dots" weight="fill" size={17} />
                                        <span>품목수정 / 오류 등 카카오채널 연락하기</span>
                                    </a>

                                    <footer className="pt-6 pb-1 text-center select-none">
                                        <div 
                                            onClick={() => setShowBizFooter(prev => !prev)}
                                            className="cursor-pointer inline-flex flex-col items-center py-1 px-4 rounded-xl transition-opacity hover:opacity-85"
                                        >
                                            <div className="text-[11.5px] font-black tracking-[0.24em] text-gray-800 pl-[0.24em]">
                                                EMBER SISTER OFFICIAL
                                            </div>
                                            <div className="mt-1 flex items-center gap-2">
                                                <span className="w-3 h-[1px] bg-gray-300/80"></span>
                                                <span className="text-[10px] font-extrabold tracking-[0.14em] kalo-signature">
                                                    SYSTEM BY. 깔로AI
                                                </span>
                                                <span className="w-3 h-[1px] bg-gray-300/80"></span>
                                            </div>
                                        </div>

                                        {showBizFooter && (
                                            <div className="mt-3 pt-2 border-t border-gray-200/50 text-[9.5px] text-gray-300 leading-tight space-y-0.5 font-normal tracking-tight">
                                                <div>
                                                    상호: {BUSINESS_INFO.companyName} <span className="mx-1 text-gray-200">|</span> 대표자: {BUSINESS_INFO.ceoName} <span className="mx-1 text-gray-200">|</span> 사업자번호: {BUSINESS_INFO.bizNumber}
                                                </div>
                                                <div>
                                                    통신판매업신고: {BUSINESS_INFO.mailOrderNumber} <span className="mx-1 text-gray-200">|</span> 개인정보보호책임자: {BUSINESS_INFO.privacyOfficer}
                                                </div>
                                                <div>
                                                    소재지: {BUSINESS_INFO.address} <span className="mx-1 text-gray-200">|</span> 고객센터: {BUSINESS_INFO.csCenter}
                                                </div>
                                            </div>
                                        )}
                                    </footer>
                                </section>
                            </main>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PortalApp />);
    </script>
</body>
</html>
