                                                                                    <div className={`text-[13px] font-extrabold leading-snug ${sIdx === 0 ? 'text-gray-900' : 'text-gray-600'}`}>
                                                                                        {st.status}
                                                                                    </div>
                                                                                    <div className="text-[11.5px] font-semibold text-gray-500 flex items-center gap-1.5 mt-0.5">
                                                                                        <span className="text-gray-700 font-bold">📍 {st.location}</span>
                                                                                        <span>·</span>
                                                                                        <span className="tabular-nums">{st.time}</span>
                                                                                    </div>
                                                                                </div>
                                                                            ))}
                                                                        </div>
                                                                    ) : (
                                                                        <div className="py-2.5 px-2 bg-gray-50 rounded-lg text-[12px] text-gray-600 font-semibold text-center leading-relaxed">
                                                                            송장이 등록되어 택배사 집하(상품인수) 대기 중입니다.<br/>
                                                                            집하 스캔 후 이 자리에서 바로 이동흐름이 표시됩니다.
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            )}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )}
                                    </div>
                                </section>

                                {/* 4. 하단 최종 확인 버튼 & 카톡 채널 문의 */}
                                <section className="pt-0.5 space-y-2 safe-bottom">
                                    {currentUser.isConfirmed ? (
                                        <div className="w-full py-3.5 bg-green-600 text-white font-extrabold rounded-lg text-center text-[15px] flex items-center justify-center gap-1.5 shadow-sm">
                                            <Icon name="check-circle" weight="fill" size={18} />
                                            <span>주문 및 배송지 확인 완료</span>
                                        </div>
                                    ) : (
                                        <button 
                                            onClick={handleConfirmOrder}
                                            className="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-extrabold rounded-lg text-[15px] shadow-sm flex items-center justify-center gap-1.5 transition-all"
                                        >
                                            <Icon name="hand-Pointing" weight="fill" size={18} />
                                            <span>네, 주문내역과 배송지가 모두 맞습니다</span>
                                        </button>
                                    )}

                                    <a 
                                        href={KAKAO_CHANNEL_URL}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="w-full py-3 bg-[#FEE500] hover:bg-[#FADA0A] text-gray-900 font-extrabold rounded-lg text-[14px] flex items-center justify-center gap-1.5 shadow-sm"
                                    >
                                        <Icon name="chat-circle-dots" weight="fill" size={17} />
                                        <span>품목수정 / 오류 등 카카오채널 연락하기</span>
                                    </a>
                                </section>
                            </main>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PortalApp />);
    </script>
</body>
</html>
