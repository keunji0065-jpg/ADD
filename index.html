<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>엠버언니 배송지 입력</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 다음 우편번호 API -->
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <style>
        /* 모바일 환경에서 입력창 포커스 시 자동 확대 방지 */
        input, textarea { font-size: 16px !important; }
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid #ffffff;
            width: 24px;
            height: 24px;
            -webkit-animation: spin 1s linear infinite;
            animation: spin 1s linear infinite;
        }
        @-webkit-keyframes spin { 0% { -webkit-transform: rotate(0deg); } 100% { -webkit-transform: rotate(360deg); } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased min-h-screen">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-sm sm:min-h-0 sm:mt-10 sm:rounded-2xl sm:overflow-hidden sm:shadow-lg">
        <!-- 헤더 (예쁜 핑크 배경 + 쇼핑백 장식) -->
        <div class="relative h-40 flex flex-col items-center justify-center overflow-hidden bg-gradient-to-br from-pink-300 via-pink-400 to-pink-500">
            <!-- 쇼핑백 & 반짝이 장식 -->
            <div class="absolute w-full h-full pointer-events-none select-none">
                <div class="absolute top-4 left-6 text-5xl transform -rotate-12 drop-shadow-md">🛍️</div>
                <div class="absolute top-10 right-8 text-6xl transform rotate-12 drop-shadow-md opacity-90">🛍️</div>
                <div class="absolute bottom-6 left-12 text-4xl transform rotate-6 drop-shadow-md opacity-80">🛍️</div>
                <div class="absolute -bottom-2 right-10 text-5xl transform -rotate-12 drop-shadow-md opacity-90">🛍️</div>
                <div class="absolute top-1/2 left-4 text-2xl opacity-70">✨</div>
                <div class="absolute bottom-1/3 right-6 text-3xl opacity-70">💖</div>
                <div class="absolute top-4 right-1/3 text-2xl opacity-60">✨</div>
            </div>

            <!-- 강조된 타이틀 -->
            <div class="relative z-10 text-center px-4 w-full mt-2">
                <h1 class="text-3xl sm:text-4xl font-black text-white drop-shadow-lg tracking-tight leading-tight mb-2">
                    엠버언니
                </h1>
                <div class="inline-block bg-pink-800/40 backdrop-blur-sm px-5 py-1.5 rounded-2xl border border-pink-200/30 shadow-inner">
                    <span class="text-pink-50 text-xl sm:text-2xl font-extrabold tracking-tight">배송지 입력</span>
                </div>
            </div>
        </div>

        <!-- 입력 폼 -->
        <div class="p-6">
            <form id="addressForm" class="space-y-5">
                
                <!-- 🌟 개인정보 관련 안내 문구 -->
                <div class="bg-gray-50 border border-gray-200 rounded-xl p-4 text-sm text-gray-600">
                    <div class="flex items-start gap-2.5">
                        <svg class="w-5 h-5 text-gray-400 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <div>
                            <p class="font-bold text-gray-700 mb-1">개인정보 수집 및 이용 안내</p>
                            <p class="leading-relaxed">안전하고 정확한 상품 배송을 위해 최소한의 정보를 수집합니다.</p>
                            <p class="text-red-500 font-semibold mt-1.5 break-keep">※ 수집된 정보는 마지막 주문일로부터 30일 이후 안전하게 자동 파기(삭제)됩니다.</p>
                        </div>
                    </div>
                </div>

                <!-- 닉네임 -->
                <div>
                    <label for="nickname" class="block text-sm font-semibold text-gray-700 mb-1">닉네임 <span class="text-red-500">*</span></label>
                    <input type="text" id="nickname" required placeholder="예: 엠버언니-s4d" 
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-pink-500 focus:border-pink-500 outline-none transition-all">
                </div>

                <!-- 수령인 -->
                <div>
                    <label for="name" class="block text-sm font-semibold text-gray-700 mb-1">수령인 <span class="text-red-500">*</span></label>
                    <input type="text" id="name" required placeholder="이름을 입력해주세요" 
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-pink-500 focus:border-pink-500 outline-none transition-all">
                </div>

                <!-- 연락처 -->
                <div>
                    <label for="phone" class="block text-sm font-semibold text-gray-700 mb-1">연락처 <span class="text-red-500">*</span></label>
                    <input type="tel" id="phone" required placeholder="숫자만 입력해주세요 (예: 01012345678)" inputmode="numeric" pattern="[0-9]*" maxlength="11" oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-pink-500 focus:border-pink-500 outline-none transition-all">
                </div>

                <!-- 주소 (다음 API) -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">배송지 주소 <span class="text-red-500">*</span></label>
                    <div class="flex gap-2 mb-2">
                        <input type="text" id="zipcode" readonly required placeholder="우편번호" 
                            class="w-1/2 px-4 py-3 rounded-lg border border-gray-300 bg-gray-50 focus:outline-none">
                        <button type="button" onclick="execDaumPostcode()" 
                            class="w-1/2 bg-gray-800 text-white rounded-lg font-medium hover:bg-gray-700 transition-colors">
                            주소 검색
                        </button>
                    </div>
                    <input type="text" id="address_base" readonly required placeholder="기본 주소" 
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-gray-50 mb-2 focus:outline-none">
                    <input type="text" id="address_detail" required placeholder="상세 주소를 입력해주세요 (동, 호수 등)" 
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-pink-500 focus:border-pink-500 outline-none transition-all">
                </div>

                <!-- 배송 메모 -->
                <div>
                    <label for="memo" class="block text-sm font-semibold text-gray-700 mb-1">배송 메모 <span class="text-gray-400 font-normal">(선택)</span></label>
                    <textarea id="memo" rows="2" placeholder="문 앞, 경비실 등 요청사항을 적어주세요" 
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-pink-500 focus:border-pink-500 outline-none transition-all resize-none"></textarea>
                </div>

                <!-- 제출 버튼 -->
                <div class="pt-4">
                    <p class="text-center text-red-500 font-bold text-sm mb-3">⚠️ 주문내역은 채팅창에 꼭 알려주세요!</p>
                    <button type="submit" id="submitBtn" 
                        class="w-full bg-pink-600 text-white rounded-xl py-4 font-bold text-lg hover:bg-pink-700 transition-colors flex justify-center items-center gap-2 shadow-lg shadow-pink-200">
                        <span>배송지 제출하기</span>
                        <div id="loadingSpinner" class="spinner hidden"></div>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 🌟 이전 입력 기록 확인 모달 -->
    <div id="historyModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden px-4">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl">
            <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <h3 class="text-xl font-bold text-gray-900 mb-2">이전 입력 기록이 있습니다</h3>
            <p class="text-sm text-gray-600 mb-1">최근 제출일: <span id="lastSubmitDate" class="font-semibold text-blue-600"></span></p>
            <p class="text-sm text-gray-500 mb-6">기존 정보를 불러와서 수정하거나<br>오늘 날짜로 재전송하시겠습니까?</p>
            
            <div class="flex gap-3">
                <button onclick="ignoreHistory()" class="w-1/2 bg-gray-100 text-gray-700 py-3 rounded-xl font-medium hover:bg-gray-200 transition-colors">
                    새로 입력
                </button>
                <button onclick="loadHistory()" class="w-1/2 bg-blue-600 text-white py-3 rounded-xl font-medium hover:bg-blue-700 transition-colors">
                    불러오기
                </button>
            </div>
        </div>
    </div>

    <!-- 제출 완료 후 보여질 모달 -->
    <div id="successModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden px-4">
        <div class="bg-white rounded-2xl p-8 max-w-sm w-full text-center shadow-2xl">
            <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <h3 class="text-xl font-bold text-gray-900 mb-2">제출 완료!</h3>
            <p class="text-gray-600 mb-6">배송지 정보가 성공적으로<br>등록되었습니다.</p>
            <button onclick="window.close()" class="w-full bg-gray-800 text-white py-3 rounded-xl font-medium hover:bg-gray-700 transition-colors">
                창 닫기
            </button>
        </div>
    </div>

    <script>
        // ★ 사장님의 새 구글 앱 스크립트 웹앱 URL이 성공적으로 입력되었습니다! ★
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwtfbjTqzuIT8wikZG1EnKWGy3zNnP7gF24sGO1iHl93kGDbWS0PaEnNO0g-gwhpBnoow/exec';

        // 🌟 페이지 로드 시 이전 기록 확인
        document.addEventListener('DOMContentLoaded', () => {
            const savedDataStr = localStorage.getItem('deliveryInfo');
            if (savedDataStr) {
                try {
                    const savedData = JSON.parse(savedDataStr);
                    document.getElementById('lastSubmitDate').textContent = savedData.timestamp || '최근';
                    document.getElementById('historyModal').classList.remove('hidden');
                } catch (e) {
                    console.error("기록 파싱 오류", e);
                }
            }
        });

        // 🌟 이전 기록 불러오기 버튼 동작
        function loadHistory() {
            const savedDataStr = localStorage.getItem('deliveryInfo');
            if (savedDataStr) {
                const savedData = JSON.parse(savedDataStr);
                document.getElementById('nickname').value = savedData.nickname || '';
                document.getElementById('name').value = savedData.name || '';
                document.getElementById('phone').value = savedData.phone || '';
                document.getElementById('zipcode').value = savedData.zipcode || '';
                document.getElementById('address_base').value = savedData.address_base || '';
                document.getElementById('address_detail').value = savedData.address_detail || '';
                document.getElementById('memo').value = savedData.memo || '';
            }
            document.getElementById('historyModal').classList.add('hidden');
        }

        // 🌟 새로 입력 (기록 무시) 버튼 동작
        function ignoreHistory() {
            document.getElementById('historyModal').classList.add('hidden');
        }

        // 다음 우편번호 API 호출 함수
        function execDaumPostcode() {
            new daum.Postcode({
                oncomplete: function(data) {
                    document.getElementById('zipcode').value = data.zonecode;
                    document.getElementById('address_base').value = data.address;
                    document.getElementById('address_detail').focus();
                }
            }).open();
        }

        // 폼 제출 로직 (구글 시트로 데이터 전송)
        document.getElementById('addressForm').addEventListener('submit', async function(e) {
            e.preventDefault(); // 기본 새로고침 방지

            if(GOOGLE_SCRIPT_URL.includes('여기에_본인_URL_입력')) {
                alert('코드에 구글 스크립트 URL을 먼저 입력해주세요!');
                return;
            }

            const btn = document.getElementById('submitBtn');
            const spinner = document.getElementById('loadingSpinner');
            const btnText = btn.querySelector('span');

            // 전송 데이터 만들기
            const payload = {
                action: 'add_address', 
                nickname: document.getElementById('nickname').value,
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                zipcode: document.getElementById('zipcode').value,
                address_base: document.getElementById('address_base').value,
                address_detail: document.getElementById('address_detail').value,
                full_address: `(${document.getElementById('zipcode').value}) ${document.getElementById('address_base').value} ${document.getElementById('address_detail').value}`,
                memo: document.getElementById('memo').value
            };

            // 성공 시 로컬 스토리지에 저장할 데이터 준비
            const dataToSave = {
                ...payload,
                timestamp: new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' })
            };

            // 로딩 상태 표시
            btn.disabled = true;
            btnText.textContent = '처리 중...';
            spinner.classList.remove('hidden');

            try {
                // 구글 스크립트로 POST 요청
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8', 
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if(result.success) {
                    // 성공적으로 보내졌으면 스마트폰에 기록 저장
                    localStorage.setItem('deliveryInfo', JSON.stringify(dataToSave));
                    
                    // 성공 모달 표시
                    document.getElementById('successModal').classList.remove('hidden');
                } else {
                    alert('오류가 발생했습니다: ' + (result.error || '알 수 없는 오류'));
                }

            } catch (error) {
                console.error('Error:', error);
                alert('네트워크 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
            } finally {
                // 로딩 상태 해제
                btn.disabled = false;
                btnText.textContent = '배송지 제출하기';
                spinner.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
