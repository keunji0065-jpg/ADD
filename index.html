<!DOCTYPE html>
<html lang="ko" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#111827">
    <title>엠버언니 - 주문 & 입금 확인</title>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web" crossorigin="anonymous"></script>
    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

    <style>
        @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css");
        @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap");
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #d4d4d8;
            color: #111827;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .font-serif {
            font-family: 'Cormorant Garamond', Georgia, serif;
        }
        .safe-bottom {
            padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start sm:justify-center sm:py-4 sm:px-4">
    <div id="root" class="w-full flex justify-center"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbwZ_FgUxdg-1nzV9kTabOMGgZKNSYUBxIjfNge4-N4psMgF-6Rv2XqjvpWUex4T5tKF/exec';
        const DEFAULT_MASTER_SHEET_ID = '1B8SBMX18_Px1CpRHuDTxqodqudiTrf6NfVoptjHtnGQ';
        const BANK_ACCOUNT_NUMBER = '7942-32-84990';
        const BANK_NAME_HOLDER = '카카오뱅크 김선정';
        const KAKAO_CHANNEL_URL = 'http://pf.kakao.com/_zSCxhX';

        // 대문 고정 화보 이미지 (가을/겨울 시즌 코트 화보)
        const FIXED_AUTUMN_WINTER_HERO = 'https://images.unsplash.com/photo-1539109136881-3be0616acf4b?auto=format&fit=crop&w=1000&q=85';
        const FALLBACK_COAT_HERO = 'https://images.unsplash.com/photo-1548624313-0396c75e4b1a?auto=format&fit=crop&w=1000&q=85';

        const Icon = ({ name, className = "", weight = "regular", size = 16 }) => (
            <i className={`ph ph-${name} ${className}`} data-phosphor-icon-weight={weight} style={{ fontSize: size }}></i>
        );

        const cleanHandle = (str) => {
            if (!str) return "";
            let s = String(str).trim().replace(/^@+/, "");
            s = s.replace(/-[a-zA-Z0-9]{2,6}$/, "");
            return s.replace(/\s+/g, "").toLowerCase();
        };

        const extractKorean = (str) => {
            if (!str) return "";
            return String(str).replace(/[^가-힣]/g, "");
        };

        const isFlexibleNickMatch = (rowNick, inputNick) => {
            if (!rowNick || !inputNick) return false;
            const r = cleanHandle(rowNick);
            const i = cleanHandle(inputNick);
            if (r === i) return true;
            const rKo = extractKorean(r);
            const iKo = extractKorean(i);
            if (rKo.length >= 2 && iKo.length >= 2 && rKo === iKo) return true;
            if (r.length >= 2 && i.length >= 2 && (r.startsWith(i) || i.startsWith(r))) return true;
            return false;
        };

        const maskName = (name) => {
            if (!name) return "";
            const s = String(name).trim();
            if (s.length <= 1) return s;
            if (s.length === 2) return s[0] + "*";
            return s[0] + "*".repeat(s.length - 2) + s[s.length - 1];
        };

        const maskPhone = (phone) => {
            if (!phone) return "";
            const clean = String(phone).replace(/[^0-9]/g, "");
            if (clean.length < 7) return phone;
            return `${clean.slice(0, 3)}-****-${clean.slice(-4)}`;
        };

        const maskAddress = (baseAddr, detailAddr, zipcode) => {
            const cleanZip = String(zipcode || "").replace(/[^0-9]/g, "");
            const cleanBase = String(baseAddr || "").replace(/^\(\d{5}\)\s*/, "").trim();
            const zipPart = cleanZip ? `(${cleanZip}) ` : "";
            const d = String(detailAddr || "").trim();
            if (!d) return `${zipPart}${cleanBase}`;
            const maskedDetail = d.replace(/\d+/g, (m) => (m.length > 1 ? m[0] + "*".repeat(m.length - 1) : "*"));
            return `${zipPart}${cleanBase} ${maskedDetail}`;
        };

        const formatKstDateString = (val) => {
            if (!val) return "";
            const s = String(val).trim();
            if (/^\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}/.test(s)) return s.slice(0, 16);
            const dt = new Date(s);
            if (!isNaN(dt.getTime()) && (s.includes("T") || s.includes("GMT") || s.endsWith("Z"))) {
                const kst = new Date(dt.getTime() + 9 * 60 * 60 * 1000);
                const yyyy = kst.getUTCFullYear();
                const mm = String(kst.getUTCMonth() + 1).padStart(2, '0');
                const dd = String(kst.getUTCDate()).padStart(2, '0');
                const hh = String(kst.getUTCHours()).padStart(2, '0');
                const min = String(kst.getUTCMinutes()).padStart(2, '0');
                return `${yyyy}-${mm}-${dd} ${hh}:${min}`;
            }
            return s;
        };

        const getKstNowString = () => {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd} ${hh}:${min}`;
        };

        // 테스트용 샘플 데이터
        const SAMPLE_DB = [
            {
                nickname: "테스트1",
                phoneLast4: "1234",
                broadcastName: "10/18 여성복 주문목록",
                isVip: false,
                freeShippingThreshold: 200000,
                isCard: false,
                shipping: 4000,
                depositTotal: 59000,
                deposits: [
                    { id: "dep_1", time: "26-10-18 16:26", name: "김은지", amount: 59000 }
                ],
                items: [
                    { id: 1, product: "01 알파카 핸드메이드 코트 베이지 F", qty: 1, price: 55000, isWaitlist: false }
                ],
                address: {
                    realname: "김은지",
                    phone: "01012341234",
                    zipcode: "06035",
                    baseAddress: "서울 강남구 가로수길 5 (신사동)",
                    detailAddress: "101동 502호",
                    memo: "문 앞에 놓아주세요",
                    updatedAt: "2026-10-18 14:20"
                },
                isConfirmed: false
            },
            {
                nickname: "테스트2",
                phoneLast4: "1234",
                broadcastName: "10/18 여성복 주문목록",
                isVip: true,
                freeShippingThreshold: 200000,
                cardFeeRate: 10,
                isCard: true,
                shipping: 0,
                depositTotal: 30000,
                deposits: [
                    { id: "dep_2", time: "26-10-18 15:10", name: "박선영", amount: 30000 }
                ],
                items: [
                    { id: 2, product: "05 캐시미어 라운드 니트 차콜", qty: 1, price: 42000, isWaitlist: false },
                    { id: 3, product: "08 울 슬랙스 블랙 M", qty: 1, price: 38000, isWaitlist: false },
                    { id: 4, product: "12 앙고라 가디건 핑크", qty: 1, price: 35000, isWaitlist: true, waitlistOrder: 1 }
                ],
                address: {
                    realname: "박선영",
                    phone: "01098761234",
                    zipcode: "13529",
                    baseAddress: "경기 성남시 분당구 판교역로 166",
                    detailAddress: "304호",
                    memo: "경비실에 맡겨주세요",
                    updatedAt: "2026-10-18 15:05"
                },
                isConfirmed: false
            },
            {
                nickname: "테스트3",
                phoneLast4: "1234",
                broadcastName: "10/18 여성복 주문목록",
                isVip: false,
                freeShippingThreshold: 200000,
                isCard: false,
                shipping: 4000,
                depositTotal: 0,
                deposits: [],
                items: [
                    { id: 5, product: "15 기모 맨투맨 아이보리", qty: 2, price: 50000, isWaitlist: false }
                ],
                address: null,
                isConfirmed: false
            }
        ];

        const PortalApp = () => {
            const [nickInput, setNickInput] = useState("");
            const [pinInput, setPinInput] = useState("");
            const [loginError, setLoginError] = useState("");
            const [isLoading, setIsLoading] = useState(false);

            const [currentUser, setCurrentUser] = useState(null);
            const [isEditingAddress, setIsEditingAddress] = useState(false);
            const [addrForm, setAddrForm] = useState({
                realname: "",
                phone: "",
                zipcode: "",
                baseAddress: "",
                detailAddress: "",
                memo: ""
            });
            const [agreePrivacy, setAgreePrivacy] = useState(false);
            const [agreeThirdParty, setAgreeThirdParty] = useState(false);
            const [isSavingAddress, setIsSavingAddress] = useState(false);
            const [toastMsg, setToastMsg] = useState("");

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(""), 2200);
            };

            const copyText = (text, label) => {
                const ta = document.createElement("textarea");
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand("copy");
                    showToast(`${label} 복사되었습니다.`);
                } catch (e) {}
                document.body.removeChild(ta);
            };

            const initAddressState = (userObj) => {
                if (userObj.address && userObj.address.baseAddress) {
                    setAddrForm(userObj.address);
                    setIsEditingAddress(false);
                    setAgreePrivacy(true);
                    setAgreeThirdParty(true);
                } else {
                    setAddrForm({ realname: "", phone: "", zipcode: "", baseAddress: "", detailAddress: "", memo: "" });
                    setIsEditingAddress(true);
                    setAgreePrivacy(false);
                    setAgreeThirdParty(false);
                }
            };

            const handleLogin = async (e, customNick, customPin) => {
                if (e) e.preventDefault();
                setLoginError("");

                const rawNick = customNick !== undefined ? customNick : nickInput;
                const rawPin = customPin !== undefined ? customPin : pinInput;

                const cleanNick = cleanHandle(rawNick);
                const cleanPin = String(rawPin).trim();

                if (!cleanNick) {
                    setLoginError("유튜브 닉네임을 입력해 주세요.");
                    return;
                }
                if (cleanPin.length !== 4) {
                    setLoginError("비밀번호(휴대폰 뒷 4자리)를 입력해 주세요.");
                    return;
                }

                setIsLoading(true);

                // 1) 샘플 테스트 계정 우선 확인
                const sampleFound = SAMPLE_DB.find(u => isFlexibleNickMatch(u.nickname, rawNick));
                if (sampleFound) {
                    setTimeout(() => {
                        setIsLoading(false);
                        if (sampleFound.phoneLast4 !== cleanPin) {
                            setLoginError("비밀번호 4자리가 일치하지 않습니다. 첫 구매이거나 열리지 않으면 아래 노란색 카톡 버튼으로 문의해 주세요.");
                            return;
                        }
                        const cloned = JSON.parse(JSON.stringify(sampleFound));
                        setCurrentUser(cloned);
                        initAddressState(cloned);
                    }, 200);
                    return;
                }

                // 2) 실시간 구글 시트 연동 조회
                try {
                    const url = `${DEFAULT_GAS_URL}?action=get_customer_order&masterId=${DEFAULT_MASTER_SHEET_ID}&nickname=${encodeURIComponent(rawNick.trim())}&pin=${encodeURIComponent(cleanPin)}&t=${Date.now()}`;
                    const res = await fetch(url);
                    const data = await res.json();
                    setIsLoading(false);

                    if (data.status === "success" && data.customerData) {
                        setCurrentUser(data.customerData);
                        initAddressState(data.customerData);
                    } else if (data.errorType === "WRONG_PIN") {
                        setLoginError("비밀번호(뒷 4자리)가 일치하지 않습니다. 첫 구매이거나 열리지 않으면 아래 노란색 카톡 버튼으로 문의해 주세요.");
                    } else if (data.status === "not_found") {
                        setLoginError("주문 내역을 찾을 수 없습니다. (@와 -뒤 영문을 뺀 한글 닉네임만 입력해 보세요!)");
                    } else {
                        setLoginError(data.message || "조회에 실패했습니다. 잠시 후 다시 시도해 주세요.");
                    }
                } catch (err) {
                    setIsLoading(false);
                    setLoginError("서버와 통신할 수 없습니다. 인터넷 연결을 확인해 주세요.");
                }
            };

            const handleOpenPostcode = () => {
                new window.daum.Postcode({
                    oncomplete: function(data) {
                        let fullAddr = data.address;
                        let extraAddr = '';
                        if (data.addressType === 'R') {
                            if (data.bname !== '') extraAddr += data.bname;
                            if (data.buildingName !== '') extraAddr += (extraAddr !== '' ? ', ' + data.buildingName : data.buildingName);
                            fullAddr += (extraAddr !== '' ? ` (${extraAddr})` : '');
                        }
                        setAddrForm(prev => ({
                            ...prev,
                            zipcode: data.zonecode,
                            baseAddress: fullAddr
                        }));
                    }
                }).open();
            };

            const handleSaveAddress = async (e) => {
                if (e && e.preventDefault) e.preventDefault();
                if (!addrForm.realname.trim()) { showToast("수령인 성함을 입력해 주세요."); return false; }
                const cleanPhone = addrForm.phone.replace(/[^0-9]/g, "");
                if (cleanPhone.length < 10) { showToast("정확한 휴대폰 번호를 입력해 주세요."); return false; }
                if (!addrForm.baseAddress.trim()) { showToast("주소 검색을 통해 기본 주소를 입력해 주세요."); return false; }
                if (!agreePrivacy || !agreeThirdParty) { showToast("필수 개인정보 수집 및 제공에 동의해 주세요."); return false; }

                const nowStr = getKstNowString();
                const updatedAddr = { ...addrForm, phone: cleanPhone, updatedAt: nowStr };
                const newLast4 = cleanPhone.slice(-4);

                const isSample = SAMPLE_DB.some(u => cleanHandle(u.nickname) === cleanHandle(currentUser.nickname));
                if (isSample) {
                    setCurrentUser(prev => ({ ...prev, phoneLast4: newLast4, address: updatedAddr }));
                    setIsEditingAddress(false);
                    showToast("배송지가 저장되었습니다!");
                    return true;
                }

                setIsSavingAddress(true);
                try {
                    const cleanZip = String(updatedAddr.zipcode || "").replace(/[^0-9]/g, "");
                    const cleanBase = String(updatedAddr.baseAddress || "").replace(/^\(\d{5}\)\s*/, "").trim();
                    const zipPrefix = cleanZip ? `(${cleanZip}) ` : "";
                    const fullCombinedAddress = `${zipPrefix}${cleanBase} ${updatedAddr.detailAddress}`.trim();
                    const payload = {
                        action: 'save_master_address',
                        masterId: DEFAULT_MASTER_SHEET_ID,
                        data: {
                            nickname: currentUser.nickname,
                            realname: updatedAddr.realname.trim(),
                            phone: "'" + cleanPhone,
                            zipcode: "",
                            address: fullCombinedAddress,
                            memo: updatedAddr.memo.trim()
                        }
                    };
                    const res = await fetch(DEFAULT_GAS_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                    const result = await res.json();
                    if (result.success || result.status === 'success') {
                        setCurrentUser(prev => ({ ...prev, phoneLast4: newLast4, address: updatedAddr }));
                        setPinInput(newLast4);
                        setIsEditingAddress(false);
                        showToast("배송지가 안전하게 저장되었습니다!");
                        return true;
                    } else {
                        showToast("저장에 실패했습니다. 다시 시도해 주세요.");
                        return false;
                    }
                } catch (err) {
                    showToast("통신 오류가 발생했습니다.");
                    return false;
                } finally {
                    setIsSavingAddress(false);
                }
            };

            const handleConfirmOrder = async () => {
                // 고객이 배송지를 입력/수정해 놓고 '배송지 저장'을 누르지 않은 채 바로 확인 버튼을 누른 경우 자동으로 배송지 저장부터 실행!
                if (!currentUser.address || !currentUser.address.baseAddress || isEditingAddress) {
                    if (addrForm.realname.trim() || addrForm.phone.trim() || addrForm.baseAddress.trim()) {
                        const savedOk = await handleSaveAddress();
                        if (!savedOk) return;
                    } else {
                        showToast("먼저 배송지를 입력해 주세요!");
                        setIsEditingAddress(true);
                        return;
                    }
                }
                const nowStr = getKstNowString();
                const isSample = SAMPLE_DB.some(u => cleanHandle(u.nickname) === cleanHandle(currentUser.nickname));
                if (isSample) {
                    setCurrentUser(prev => ({
                        ...prev,
                        isConfirmed: true,
                        address: prev.address ? { ...prev.address, updatedAt: nowStr } : prev.address
                    }));
                    showToast("주문 및 배송지 확인이 완료되었습니다!");
                    return;
                }

                try {
                    await fetch(DEFAULT_GAS_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({
                            action: 'confirm_customer_order',
                            masterId: DEFAULT_MASTER_SHEET_ID,
                            data: { nickname: currentUser.nickname }
                        })
                    });
                    setCurrentUser(prev => ({
                        ...prev,
                        isConfirmed: true,
                        address: prev.address ? { ...prev.address, updatedAt: nowStr } : prev.address
                    }));
                    showToast("주문 및 배송지 확인이 완료되었습니다!");
                } catch (e) {
                    showToast("확인 처리 중 오류가 발생했습니다.");
                }
            };

            // 주문 금액 계산
            const activeItems = currentUser ? (currentUser.items || []).filter(i => !i.isWaitlist) : [];
            const waitlistItems = currentUser ? (currentUser.items || []).filter(i => i.isWaitlist) : [];
            const totalQty = activeItems.reduce((s, i) => s + Number(i.qty || 1), 0);
            const productTotal = activeItems.reduce((s, i) => s + Number(i.price || 0), 0);
            const isVipFree = Boolean(currentUser && (currentUser.isVip || currentUser.isManager));
            const shippingFee = currentUser ? (isVipFree ? 0 : (activeItems.length > 0 ? Number(currentUser.shipping || 0) : 0)) : 0;
            const baseGrandTotal = productTotal + shippingFee;
            const depositTotal = currentUser ? Number(currentUser.depositTotal || 0) : 0;
            const rawBalance = baseGrandTotal - depositTotal;
            const isCard = currentUser ? Boolean(currentUser.isCard) : false;
            const cardFeeRate = currentUser && currentUser.cardFeeRate !== undefined ? Number(currentUser.cardFeeRate) : 10;
            const cardFee = (isCard && rawBalance > 0) ? Math.round(rawBalance * (cardFeeRate / 100)) : 0;
            const finalGrandTotal = baseGrandTotal + cardFee;
            const finalBalance = rawBalance + cardFee;

            const isPaid = activeItems.length > 0 && finalBalance === 0 && !isCard;
            const isOverpaid = finalBalance < 0 && !isCard;
            const isUnpaid = finalBalance > 0 && !isCard;

            const depositsHistory = currentUser && Array.isArray(currentUser.deposits) && currentUser.deposits.length > 0
                ? currentUser.deposits
                : (depositTotal > 0 ? [{ id: 'dep_sum', time: '', name: (currentUser?.address?.realname || currentUser?.nickname || '입금확인'), amount: depositTotal }] : []);

            return (
                <div className="w-full flex flex-col items-center">
                    {toastMsg && (
                        <div className="fixed top-3 left-1/2 -translate-x-1/2 z-50 bg-gray-900/95 text-white px-4 py-2 rounded-full shadow-lg text-xs font-bold flex items-center gap-1.5">
                            <Icon name="check-circle" weight="fill" className="text-green-400" size={15} />
                            <span>{toastMsg}</span>
                        </div>
                    )}

                    {/* 미로그인 상태: 화보 대문 & 로그인 카드 */}
                    {!currentUser ? (
                        <div className="w-full max-w-[420px] h-[100dvh] sm:h-[760px] bg-[#e5e4e2] sm:rounded-2xl shadow-lg border-0 sm:border border-gray-300 overflow-hidden relative flex flex-col justify-end">
                            {/* 화보 배경 이미지 (가을/겨울 시즌 코트 화보 1장 고정) */}
                            <img 
                                src={FIXED_AUTUMN_WINTER_HERO} 
                                onError={(e) => { e.target.onerror = null; e.target.src = FALLBACK_COAT_HERO; }}
                                alt="엠버언니 가을겨울 화보" 
                                className="absolute inset-0 w-full h-full object-cover object-top select-none pointer-events-none"
                            />

                            {/* 정중앙 화보 타이포그래피 (하이엔드 매거진 표지 느낌) */}
                            <div className="absolute inset-0 z-10 flex flex-col items-center justify-center pointer-events-none pb-48">
                                <h1 className="text-[#f8f5f0] text-[52px] font-serif tracking-[0.3em] pl-[0.3em] font-medium drop-shadow-2xl" style={{ textShadow: '0 4px 25px rgba(0,0,0,0.7)' }}>EMBER</h1>
                            </div>

                            {/* 하단 반투명 글래스모피즘 로그인 카드 (글씨체 및 높이 확대) */}
                            <div className="relative z-20 px-3 pb-4 pt-2 safe-bottom">
                                <div className="bg-white/55 backdrop-blur-md rounded-2xl p-4 shadow-xl border border-white/70">
                                    <div className="flex items-center justify-between mb-3">
                                        <h2 className="text-[16px] font-black text-gray-900 tracking-tight drop-shadow-sm">
                                            엠버언니 주문&입금확인
                                        </h2>
                                        <span className="text-[11px] font-extrabold text-blue-700 flex items-center gap-0.5 drop-shadow-sm">
                                            <Icon name="shield-check" weight="bold" size={14} /> 본인 인증 후 열람가능
                                        </span>
                                    </div>

                                    <form onSubmit={handleLogin} className="space-y-2.5">
                                        <div className="flex items-stretch gap-2">
                                            <div className="flex-1 space-y-2 min-w-0">
                                                {/* 닉네임 줄 */}
                                                <div className="flex items-center gap-2">
                                                    <label className="text-[13px] font-extrabold text-gray-900 w-[64px] shrink-0 flex justify-between items-center drop-shadow-sm">
                                                        <span>닉</span><span>네</span><span>임</span><span className="ml-0.5">:</span>
                                                    </label>
                                                    <input 
                                                        type="text"
                                                        value={nickInput}
                                                        onChange={(e) => setNickInput(e.target.value)}
                                                        placeholder="예) @깔로-k3j ➔ 깔로"
                                                        className="flex-1 min-w-0 px-3 py-2.5 bg-white/85 border border-white/90 rounded-lg text-[14px] font-bold text-gray-900 placeholder:text-gray-500 placeholder:font-normal focus:bg-white focus:border-blue-600 outline-none shadow-sm"
                                                    />
                                                </div>

                                                {/* 비밀번호 줄 */}
                                                <div className="flex items-center gap-2">
                                                    <label className="text-[13px] font-extrabold text-gray-900 w-[64px] shrink-0 flex justify-between items-center drop-shadow-sm">
                                                        <span>비</span><span>밀</span><span>번</span><span>호</span><span className="ml-0.5">:</span>
                                                    </label>
                                                    <input 
                                                        type="password"
                                                        inputMode="numeric"
                                                        maxLength={4}
                                                        value={pinInput}
                                                        onChange={(e) => setPinInput(e.target.value.replace(/[^0-9]/g, ""))}
                                                        placeholder="핸드폰번호 뒤 4자리"
                                                        className="flex-1 min-w-0 px-3 py-2.5 bg-white/85 border border-white/90 rounded-lg text-[14px] font-bold text-gray-900 placeholder:text-gray-500 placeholder:font-normal focus:bg-white focus:border-blue-600 outline-none shadow-sm"
                                                    />
                                                </div>
                                            </div>

                                            {/* 우측 2줄 통합 검정색 조회 버튼 */}
                                            <button 
                                                type="submit"
                                                disabled={isLoading}
                                                className="w-[84px] shrink-0 bg-gray-950 hover:bg-black active:scale-[0.99] text-white font-extrabold rounded-lg text-[13px] leading-snug shadow-md transition-all flex flex-col items-center justify-center gap-0.5"
                                            >
                                                {isLoading ? (
                                                    <Icon name="spinner" className="animate-spin" size={18} />
                                                ) : (
                                                    <>
                                                        <span>주문서</span>
                                                        <span>조회하기</span>
                                                    </>
                                                )}
                                            </button>
                                        </div>

                                        {loginError && (
                                            <div className="p-2.5 bg-red-600/95 text-white rounded-lg text-[12px] font-bold leading-snug">
                                                {loginError}
                                            </div>
                                        )}
                                    </form>

                                    {/* 첫구매 / 미열람 고객 카카오톡 문의 버튼 */}
                                    <div className="mt-3 pt-2.5 border-t border-gray-900/15 space-y-2">
                                        <p className="text-[12px] font-extrabold text-gray-900 text-center tracking-tight drop-shadow-sm">
                                            💡 문의 시 <span className="text-red-600 underline underline-offset-2">닉네임과 전화번호 뒷 4자리</span>를 카톡으로 남겨주세요!
                                        </p>
                                        <a 
                                            href={KAKAO_CHANNEL_URL}
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            className="w-full py-3 bg-[#FEE500] hover:bg-[#FADA0A] text-gray-900 font-extrabold rounded-lg text-[13px] flex items-center justify-center gap-1.5 shadow-sm transition-all"
                                        >
                                            <Icon name="chat-circle-dots" weight="fill" size={17} />
                                            <span>첫구매 / 주문서가 열리지 않는분 문의하기</span>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className="w-full max-w-[430px] bg-gray-100 rounded-xl shadow border border-gray-300 overflow-hidden">
                            {/* 상단 헤더 */}
                            <header className="bg-gray-900 text-white px-4 py-3 flex items-center justify-between">
                                <div className="flex items-center gap-2 min-w-0">
                                    <span className="font-extrabold text-[17px] text-white truncate">{currentUser.nickname} 님</span>
                                    {isPaid && <span className="bg-green-500 text-white text-[12px] font-extrabold px-2 py-0.5 rounded">완납</span>}
                                    {isUnpaid && <span className="bg-red-500 text-white text-[12px] font-extrabold px-2 py-0.5 rounded">미입금</span>}
                                    {isOverpaid && <span className="bg-blue-500 text-white text-[12px] font-extrabold px-2 py-0.5 rounded">과납</span>}
                                    {isCard && <span className="bg-purple-500 text-white text-[12px] font-extrabold px-2 py-0.5 rounded">카드결제</span>}
                                </div>
                                <div className="flex items-center gap-1.5 shrink-0">
                                    <button 
                                        onClick={() => handleLogin(null, currentUser.nickname, currentUser.phoneLast4)}
                                        className="text-[12px] font-bold bg-gray-800 hover:bg-gray-700 text-gray-200 px-2.5 py-1.5 rounded border border-gray-700 flex items-center gap-1"
                                    >
                                        <Icon name="arrows-clockwise" weight="bold" size={13} /> 새로고침
                                    </button>
                                    <button 
                                        onClick={() => { setCurrentUser(null); setNickInput(""); setPinInput(""); }}
                                        className="text-[12px] font-bold bg-gray-800 hover:bg-gray-700 text-gray-300 px-2.5 py-1.5 rounded border border-gray-700"
                                    >
                                        닫기
                                    </button>
                                </div>
                            </header>

                            <main className="p-3 space-y-2.5">
                                {/* 1. 주문 품목 및 금액 영수증 */}
                                <section className="bg-white rounded-lg p-3.5 border border-gray-200 shadow-sm">
                                    <div className="flex items-center justify-between pb-2.5 mb-2 border-b border-gray-200">
                                        <span className="text-[14px] font-extrabold text-gray-900">
                                            {currentUser.broadcastName || '주문 목록'}
                                        </span>
                                        <span className="text-[13px] font-bold text-gray-600">
                                            {activeItems.length}품목 / 총수량 {totalQty}개
                                        </span>
                                    </div>

                                    {activeItems.length === 0 ? (
                                        <div className="text-center py-5 text-[14px] text-gray-400">확정된 주문 상품이 없습니다.</div>
                                    ) : (
                                        <div className="divide-y divide-gray-100">
                                            {activeItems.map((item, idx) => (
                                                <div key={item.id || idx} className="py-2 flex items-center justify-between gap-2 text-[14px]">
                                                    <div className="font-bold text-gray-900 flex-1 min-w-0 break-words leading-snug">
                                                        {item.product}
                                                    </div>
                                                    <div className="flex items-center gap-2.5 shrink-0">
                                                        <span className={`font-extrabold ${item.qty > 1 ? 'text-red-600 text-[15px]' : 'text-gray-600'}`}>
                                                            {item.qty}개
                                                        </span>
                                                        <span className="font-extrabold text-gray-900 w-[78px] text-right tabular-nums text-[15px]">
                                                            {Number(item.price).toLocaleString()}원
                                                        </span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    {waitlistItems.length > 0 && (
                                        <div className="mt-2.5 pt-2.5 border-t border-dashed border-orange-200 bg-orange-50/60 -mx-3.5 px-3.5 py-2">
                                            <div className="text-[12px] font-extrabold text-orange-700 mb-1">
                                                ⏱️ 품절/거파 대기 상품 (총 주문금액 제외)
                                            </div>
                                            {waitlistItems.map((item, idx) => (
                                                <div key={item.id || idx} className="flex justify-between items-center text-[13px] text-orange-800 font-semibold py-0.5">
                                                    <span className="truncate pr-2">{item.product}</span>
                                                    <span className="shrink-0 bg-orange-500 text-white text-[11px] font-extrabold px-2 py-0.5 rounded">
                                                        {item.qty > 1 ? `${item.qty}개 · ` : ''}{item.waitlistOrder ? `대기 ${item.waitlistOrder}번` : '대기중'}
                                                    </span>
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    {/* 금액 요약 */}
                                    <div className="mt-3 pt-3 border-t border-dashed border-gray-300 space-y-1.5 text-[14px]">
                                        <div className="flex justify-between text-gray-600">
                                            <span className="font-semibold">상품 합계</span>
                                            <span className="font-bold text-gray-900 tabular-nums">{productTotal.toLocaleString()}원</span>
                                        </div>
                                        <div className="flex justify-between text-gray-600">
                                            <span className="font-semibold">
                                                배송비
                                                {isVipFree ? " (무료배송)" : (shippingFee === 0 && activeItems.length > 0 ? " (무료배송)" : "")}
                                            </span>
                                            <span className="font-bold text-gray-900 tabular-nums">
                                                {shippingFee === 0 ? "0원" : `${shippingFee.toLocaleString()}원`}
                                            </span>
                                        </div>
                                        <div className="flex justify-between items-center pt-2 border-t border-gray-200">
                                            <span className="font-extrabold text-gray-900 text-[15px]">총 주문금액</span>
                                            <span className="font-black text-[18px] text-blue-600 tabular-nums">
                                                {baseGrandTotal.toLocaleString()}원
                                            </span>
                                        </div>
                                    </div>
                                </section>

                                {/* 2. 입금 내역 및 계좌 안내 */}
                                <section className="bg-white rounded-lg p-3.5 border border-gray-200 shadow-sm space-y-2.5">
                                    <div className="flex items-center justify-between pb-2 border-b border-gray-200">
                                        <span className="text-[14px] font-extrabold text-gray-900">입금 내역</span>
                                        <span className="text-[13px] font-bold text-gray-600">
                                            누적 {depositTotal.toLocaleString()}원
                                        </span>
                                    </div>

                                    {depositsHistory.length === 0 ? (
                                        <div className="py-2 text-[13px] text-gray-400 text-center">
                                            확인된 입금 내역이 없습니다.
                                        </div>
                                    ) : (
                                        <div className="divide-y divide-gray-100">
                                            {depositsHistory.map((d, index) => (
                                                <div key={d.id || index} className="py-2 flex items-center justify-between text-[14px]">
                                                    <div className="flex items-center gap-2 min-w-0">
                                                        <span className="font-extrabold text-gray-900 truncate">{d.name || currentUser.nickname}</span>
                                                        {d.time && (
                                                            <span className="text-[12.5px] text-gray-500 font-semibold tabular-nums shrink-0">{d.time}</span>
                                                        )}
                                                    </div>
                                                    <span className="font-extrabold text-gray-900 tabular-nums shrink-0 text-[15px]">
                                                        {Number(d.amount).toLocaleString()}원
                                                    </span>
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    {/* 미납/완납/과납/카드 상태 박스 */}
                                    {isUnpaid && (
                                        <div className="bg-red-50 border border-red-200 rounded-lg p-3 space-y-2.5">
                                            <div className="flex justify-between items-center">
                                                <span className="text-[14px] font-extrabold text-red-700">남은 입금하실 금액</span>
                                                <span className="text-[17px] font-black text-red-600 tabular-nums">
                                                    {finalBalance.toLocaleString()}원
                                                </span>
                                            </div>
                                            <div className="bg-white rounded p-2.5 border border-red-200 flex items-center justify-between gap-2">
                                                <div className="leading-snug">
                                                    <div className="text-gray-600 font-bold text-[12.5px]">{BANK_NAME_HOLDER}</div>
                                                    <div className="font-black text-gray-900 text-[15px] tracking-tight mt-0.5">{BANK_ACCOUNT_NUMBER}</div>
                                                </div>
                                                <button 
                                                    type="button"
                                                    onClick={() => copyText(BANK_ACCOUNT_NUMBER, "계좌번호가")}
                                                    className="bg-gray-900 hover:bg-black text-white px-3 py-2 rounded text-[13px] font-bold shrink-0 flex items-center gap-1"
                                                >
                                                    <Icon name="copy" weight="bold" size={14} /> 계좌복사
                                                </button>
                                            </div>
                                        </div>
                                    )}

                                    {isPaid && (
                                        <div className="bg-emerald-600 border border-emerald-700 rounded-lg py-3 px-3 text-center text-[14px] font-extrabold text-white shadow-sm flex items-center justify-center gap-1.5">
                                            <Icon name="check-circle" weight="fill" size={18} />
                                            <span>입금완료(완납)</span>
                                        </div>
                                    )}

                                    {isOverpaid && (
                                        <div className="bg-blue-50 border border-blue-300 rounded-lg p-3 flex justify-between items-center text-[14px] font-extrabold text-blue-800">
                                            <span>과납 금액 (환불/적립 카톡문의)</span>
                                            <span className="text-[16px] font-black text-blue-600">+{Math.abs(finalBalance).toLocaleString()}원</span>
                                        </div>
                                    )}

                                    {isCard && (
                                        <div className="bg-purple-50 border border-purple-200 rounded-lg p-3.5 space-y-2 text-[14px]">
                                            <div className="flex justify-between items-center text-gray-700 font-semibold">
                                                <span>총 주문금액</span>
                                                <span className="font-bold text-gray-900 tabular-nums">{baseGrandTotal.toLocaleString()}원</span>
                                            </div>
                                            {depositTotal > 0 && (
                                                <div className="flex justify-between items-center text-gray-700 font-semibold">
                                                    <span>입금완료 금액</span>
                                                    <span className="font-bold text-emerald-700 tabular-nums">-{depositTotal.toLocaleString()}원</span>
                                                </div>
                                            )}
                                            <div className="flex justify-between items-center text-gray-800 font-bold pt-1 border-t border-purple-200/60">
                                                <span>남은 미납금액 (카드결제 대상)</span>
                                                <span className="font-extrabold text-gray-900 tabular-nums">{Math.max(0, rawBalance).toLocaleString()}원</span>
                                            </div>
                                            <div className="flex justify-between items-center text-purple-700 font-bold">
                                                <span>카드 수수료 (+{cardFeeRate}%)</span>
                                                <span className="tabular-nums">+{cardFee.toLocaleString()}원</span>
                                            </div>
                                            <div className="flex justify-between items-center pt-2 border-t border-purple-300 text-purple-900 font-extrabold">
                                                <span className="text-[15px]">카드결제 예정금액</span>
                                                <span className="text-[18px] font-black text-purple-700 tabular-nums">{Math.max(0, finalBalance).toLocaleString()}원</span>
                                            </div>
                                        </div>
                                    )}
                                </section>

                                {/* 3. 배송지 확인 및 입력 */}
                                <section className="bg-white rounded-lg p-3.5 border border-gray-200 shadow-sm">
                                    <div className="flex items-center justify-between pb-2.5 mb-2.5 border-b border-gray-200">
                                        <div className="flex items-center gap-1.5 min-w-0">
                                            <span className="text-[14px] font-extrabold text-gray-900 shrink-0">배송지</span>
                                            {currentUser.address && currentUser.address.baseAddress && currentUser.address.updatedAt && !isEditingAddress && (
                                                <span className="text-[11.5px] font-semibold text-gray-500 truncate">
                                                    (최근 입력·확인: {formatKstDateString(currentUser.address.updatedAt)})
                                                </span>
                                            )}
                                        </div>
                                        {currentUser.address && !isEditingAddress && (
                                            <button 
                                                onClick={() => {
                                                    setAddrForm({
                                                        realname: "",
                                                        phone: "",
                                                        zipcode: "",
                                                        baseAddress: "",
                                                        detailAddress: "",
                                                        memo: ""
                                                    });
                                                    setAgreePrivacy(false);
                                                    setAgreeThirdParty(false);
                                                    setIsEditingAddress(true);
                                                }}
                                                className="text-[12.5px] font-bold text-gray-800 bg-gray-100 hover:bg-gray-200 px-2.5 py-1 rounded border border-gray-300 shrink-0"
                                            >
                                                변경
                                            </button>
                                        )}
                                    </div>

                                    {!isEditingAddress && currentUser.address ? (
                                        <div className="text-[14px] space-y-1.5 bg-gray-50 p-3 rounded border border-gray-200">
                                            <div className="flex items-center gap-2 font-extrabold text-gray-900 text-[15px]">
                                                <span>{maskName(currentUser.address.realname)}</span>
                                                <span className="text-gray-300">·</span>
                                                <span>{maskPhone(currentUser.address.phone)}</span>
                                            </div>
                                            <div className="text-gray-800 leading-snug font-medium">
                                                {maskAddress(currentUser.address.baseAddress, currentUser.address.detailAddress, currentUser.address.zipcode)}
                                            </div>
                                            {currentUser.address.memo && (
                                                <div className="text-[13px] text-gray-600 pt-0.5">
                                                    메모: {currentUser.address.memo}
                                                </div>
                                            )}
                                        </div>
                                    ) : (
                                        <form onSubmit={handleSaveAddress} className="space-y-2.5">
                                            {(!currentUser.address || !currentUser.address.baseAddress) && (
                                                <div className="bg-red-50 border border-red-200 text-red-600 rounded-lg px-3 py-2 text-[13px] font-extrabold flex items-center gap-1.5">
                                                    <Icon name="warning-circle" weight="fill" size={16} className="shrink-0" />
                                                    <span>등록된 배송지가 없습니다. 배송지를 입력해주세요.</span>
                                                </div>
                                            )}
                                            <div className="grid grid-cols-2 gap-2">
                                                <div>
                                                    <label className="block text-[12px] font-bold text-gray-700 mb-1">수령인 성함 *</label>
                                                    <input 
                                                        type="text"
                                                        value={addrForm.realname}
                                                        onChange={(e) => setAddrForm({...addrForm, realname: e.target.value})}
                                                        placeholder="홍길동"
                                                        className="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded text-[14px] font-bold outline-none focus:border-blue-600 focus:bg-white"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-[12px] font-bold text-gray-700 mb-1">연락처 (숫자만) *</label>
                                                    <input 
                                                        type="tel"
                                                        inputMode="numeric"
                                                        value={addrForm.phone}
                                                        onChange={(e) => setAddrForm({...addrForm, phone: e.target.value.replace(/[^0-9]/g, "")})}
                                                        placeholder="01012345678"
                                                        className="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded text-[14px] font-bold outline-none focus:border-blue-600 focus:bg-white"
                                                    />
                                                </div>
                                            </div>

                                            <div>
                                                <label className="block text-[12px] font-bold text-gray-700 mb-1">주소 *</label>
                                                <div className="flex gap-1.5 mb-2">
                                                    <input 
                                                        type="text"
                                                        readOnly
                                                        value={addrForm.zipcode}
                                                        placeholder="우편번호"
                                                        className="w-24 px-3 py-2 bg-gray-100 border border-gray-300 rounded text-[14px] text-gray-600"
                                                    />
                                                    <button 
                                                        type="button"
                                                        onClick={handleOpenPostcode}
                                                        className="bg-gray-800 hover:bg-black text-white px-3.5 py-2 rounded text-[13px] font-bold"
                                                    >
                                                        주소 검색
                                                    </button>
                                                </div>
                                                <input 
                                                    type="text"
                                                    readOnly
                                                    value={addrForm.baseAddress}
                                                    onClick={handleOpenPostcode}
                                                    placeholder="주소 검색을 눌러주세요"
                                                    className="w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded text-[14px] text-gray-800 mb-2 cursor-pointer"
                                                />
                                                <input 
                                                    type="text"
                                                    value={addrForm.detailAddress}
                                                    onChange={(e) => setAddrForm({...addrForm, detailAddress: e.target.value})}
                                                    placeholder="상세주소 (동, 호수 등)"
                                                    className="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded text-[14px] font-bold outline-none focus:border-blue-600 focus:bg-white"
                                                />
                                            </div>

                                            <div>
                                                <label className="block text-[12px] font-bold text-gray-700 mb-1">배송 메모</label>
                                                <input 
                                                    type="text"
                                                    value={addrForm.memo}
                                                    onChange={(e) => setAddrForm({...addrForm, memo: e.target.value})}
                                                    placeholder="예: 문 앞에 놓아주세요"
                                                    className="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded text-[14px] outline-none focus:border-blue-600 focus:bg-white"
                                                />
                                            </div>

                                            <div className="bg-gray-50 p-3 rounded border border-gray-200 space-y-2">
                                                <div className="text-[12.5px] font-extrabold text-gray-900">
                                                    개인정보 수집 및 제3자 제공 동의
                                                </div>
                                                <div className="text-[12px] text-gray-600 bg-white p-2.5 rounded border border-gray-200 leading-relaxed space-y-1">
                                                    <div><span className="font-bold text-gray-800">수집·이용 목적 :</span> 상품 주문 확인, 배송, 고객 상담 및 민원 처리</div>
                                                    <div><span className="font-bold text-gray-800">수집 항목 :</span> 성명, 연락처, 배송지 주소, 유튜브 닉네임</div>
                                                    <div><span className="font-bold text-gray-800">제3자 제공 :</span> 위탁 배송을 위해 해당 상품 공급사에 배송 정보(성명, 연락처, 주소) 제공</div>
                                                    <div><span className="font-bold text-gray-800">보유 및 이용 :</span> <strong>주소 입력일로부터 30일</strong></div>
                                                    <div className="text-[11px] text-gray-500 pt-0.5">동의를 거부할 권리가 있으나, 거부 시 상품 주문 및 배송 불가합니다.</div>
                                                </div>
                                                <label className="flex items-center gap-2 cursor-pointer pt-1">
                                                    <input type="checkbox" checked={agreePrivacy && agreeThirdParty} onChange={(e) => { setAgreePrivacy(e.target.checked); setAgreeThirdParty(e.target.checked); }} className="w-4 h-4 accent-gray-900 rounded" />
                                                    <span className="text-[13px] font-extrabold text-gray-900">[필수] 개인정보 수집 및 제3자 제공에 동의합니다.</span>
                                                </label>
                                            </div>

                                            <div className="flex gap-2 pt-1">
                                                {currentUser.address && (
                                                    <button type="button" onClick={() => setIsEditingAddress(false)} className="flex-1 py-3 bg-gray-200 text-gray-700 font-bold rounded text-[14px]">
                                                        취소
                                                    </button>
                                                )}
                                                <button type="submit" disabled={isSavingAddress} className="flex-1 py-3 bg-gray-900 hover:bg-black text-white font-extrabold rounded text-[14px] shadow-sm transition-all">
                                                    {isSavingAddress ? "저장 중..." : "배송지 저장"}
                                                </button>
                                            </div>
                                        </form>
                                    )}
                                </section>

                                {/* 4. 하단 최종 확인 버튼 & 카톡 채널 문의 */}
                                <section className="pt-0.5 space-y-2 safe-bottom">
                                    {currentUser.isConfirmed ? (
                                        <div className="w-full py-3.5 bg-green-600 text-white font-extrabold rounded-lg text-center text-[15px] flex items-center justify-center gap-1.5 shadow-sm">
                                            <Icon name="check-circle" weight="fill" size={18} />
                                            <span>주문 및 배송지 확인 완료</span>
                                        </div>
                                    ) : (
                                        <button 
                                            onClick={handleConfirmOrder}
                                            className="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-extrabold rounded-lg text-[15px] shadow-sm flex items-center justify-center gap-1.5 transition-all"
                                        >
                                            <Icon name="hand-Pointing" weight="fill" size={18} />
                                            <span>네, 주문내역과 배송지가 모두 맞습니다</span>
                                        </button>
                                    )}

                                    <a 
                                        href={KAKAO_CHANNEL_URL}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="w-full py-3 bg-[#FEE500] hover:bg-[#FADA0A] text-gray-900 font-extrabold rounded-lg text-[14px] flex items-center justify-center gap-1.5 shadow-sm"
                                    >
                                        <Icon name="chat-circle-dots" weight="fill" size={17} />
                                        <span>품목수정 / 오류 등 카카오채널 연락하기</span>
                                    </a>
                                </section>
                            </main>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PortalApp />);
    </script>
</body>
</html>
