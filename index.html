    <script type="text/babel">
        const { useState, useEffect } = React;

        const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbz5wMdAoYwgihXThXfWyVwnEVfI57HhE9MeK4K6FdtEU53s_Sr5LaM6IdlgfgwzvhBU/exec';
        const DEFAULT_MASTER_SHEET_ID = '1B8SBMX18_Px1CpRHuDTxqodqudiTrf6NfVoptjHtnGQ';
        const KAKAO_CHANNEL_URL = 'http://pf.kakao.com/_xxxx';
        const BANK_NAME_HOLDER = '카카오뱅크 · 김선정';
        const BANK_ACCOUNT_NUMBER = '7942-32-84990';

        let portalFbDb = null;
        try {
            const fbConfig = {
                apiKey: "AIzaSyDgdH34cDnp2S9akHfFLYBSpHzzamHFuoc",
                authDomain: "my-live-shop.firebaseapp.com",
                databaseURL: "https://my-live-shop-default-rtdb.firebaseio.com",
                projectId: "my-live-shop",
                storageBucket: "my-live-shop.firebasestorage.app",
                messagingSenderId: "598748133843",
                appId: "1:598748133843:web:17c7d83321fc191f85d726"
            };
            if (window.firebase) {
                if (!window.firebase.apps.length) window.firebase.initializeApp(fbConfig);
                portalFbDb = window.firebase.database();
            }
        } catch (e) {}

        const fetchGasWithRetry = async (url, options = null, maxRetries = 2, timeoutMs = 15000) => {
            let lastErr = null;
            for (let attempt = 0; attempt < maxRetries; attempt++) {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), timeoutMs);
                try {
                    const fetchOpts = options
                        ? { ...options, redirect: 'follow', signal: controller.signal }
                        : { method: 'GET', redirect: 'follow', signal: controller.signal };
                    const res = await fetch(url, fetchOpts);
                    clearTimeout(timer);
                    const text = await res.text();
                    const parsed = JSON.parse(text);
                    if (parsed) return parsed;
                } catch (err) {
                    clearTimeout(timer);
                    lastErr = err;
                    if (attempt < maxRetries - 1) {
                        await new Promise(r => setTimeout(r, 400 * (attempt + 1)));
                    }
                }
            }
            if (options && options.method === 'POST') {
                return null;
            }
            throw lastErr || new Error('NETWORK_FAILED');
        };

        // Firebase 실시간 클라우드 백업 및 찐고객사전 캐시에서 고객 주문서를 0.1초 만에 찾아내는 초고속 엔진
        const lookupOrderFromFirebase = async (rawNick, cleanPin) => {
            if (!portalFbDb) return null;
            try {
                const [ordersSnap, addrsSnap, portalAddrsSnap, portalConfSnap, creditsSnap] = await Promise.all([
                    portalFbDb.ref('ember_live_data/_portal_orders').once('value'),
                    portalFbDb.ref('ember_live_data/_portal_master_addrs').once('value'),
                    portalFbDb.ref('ember_live_data/_portal_addresses').once('value'),
                    portalFbDb.ref('ember_live_data/_portal_confirmed').once('value'),
                    portalFbDb.ref('ember_live_data/_portal_credits').once('value')
                ]);
                const store = ordersSnap.val();
                const masterAddrMap = Object.assign({}, addrsSnap.val() || {}, portalAddrsSnap.val() || {});
                const portalConfMap = portalConfSnap.val() || {};
                const creditsMap = creditsSnap.val() || {};
                const normInPin = normalizePin4(cleanPin);

                const findCreditForNick = (targetNick) => {
                    if (!targetNick) return 0;
                    const tNorm = normalizeNick(targetNick);
                    const tClean = cleanHandle(targetNick);
                    // 1순위: 직접 키 조회
                    const safeKey = String(targetNick).replace(/[.#$\[\]\/]/g, '_');
                    if (creditsMap[safeKey] && Number(creditsMap[safeKey].credit) > 0) {
                        return Number(creditsMap[safeKey].credit);
                    }
                    // 2순위: 정규화 닉네임 및 핸들 꼬리표 제거 후 일치 조회
                    for (const k in creditsMap) {
                        const item = creditsMap[k];
                        if (!item) continue;
                        const itemNick = item.nickname || k;
                        if (normalizeNick(itemNick) === tNorm || (tClean && cleanHandle(itemNick) === tClean)) {
                            return Number(item.credit) || 0;
                        }
                    }
                    return 0;
                };

                // 1) 찐고객사전 클라우드 캐시에서 본인 주소 탐색
                const matchedMasterMap = {};
                const handleCountMap = {};
                Object.values(masterAddrMap).forEach(a => {
                    if (!a || !a.nickname) return;
                    const hk = cleanHandle(a.nickname);
                    if (hk) handleCountMap[hk] = (handleCountMap[hk] || 0) + 1;
                });

                let bestMasterAddr = null;
                let bestAddrScore = 0;

                Object.values(masterAddrMap).forEach(a => {
                    if (!a || !a.nickname) return;
                    const aPin = a.phone && String(a.phone).length >= 4 ? normalizePin4(String(a.phone).slice(-4)) : '';
                    const normNickKey = normalizeNick(a.nickname);
                    const cleanHandleKey = cleanHandle(a.nickname);
                    if (aPin) {
                        const entryObj = { addr: a, pin: aPin };
                        if (normNickKey) matchedMasterMap[normNickKey] = entryObj;
                        // 핸들을 뗀 이름이 찐고객사전 내에서 유일한 1명일 때만 보조 키로 등록 (동명이인 번호 혼선 방지)
                        if (cleanHandleKey && handleCountMap[cleanHandleKey] === 1) {
                            matchedMasterMap[cleanHandleKey] = entryObj;
                        }
                    }

                    const sc = getNickMatchScore(a.nickname, a.realname || '', rawNick);
                    if (sc <= 0) return;

                    // 비밀번호(전화번호 뒷 4자리)가 완벽히 같으면 부분 닉네임(sc >= 1)이어도 100% 본인 인정!
                    if (aPin && normInPin && aPin === normInPin) {
                        if (sc > bestAddrScore) {
                            bestAddrScore = sc;
                            bestMasterAddr = a;
                        }
                    }
                });

                const pinVerifiedMatches = [];
                const unpinnedExactMatches = [];
                let pinMismatchFound = false;

                if (store && typeof store === 'object') {
                    const broadcasts = Object.values(store);
                    broadcasts.forEach(bData => {
                        if (!bData || !Array.isArray(bData.customers)) return;
                        let bestPinCand = null;
                        let bestPinScore = 0;
                        let bestUnpinnedCand = null;

                        bData.customers.forEach(cust => {
                            const sc = getNickMatchScore(cust.nickname, cust.address?.realname || '', rawNick);
                            if (sc <= 0) return;

                            const cNormKey = normalizeNick(cust.nickname);
                            const cHandleKey = cleanHandle(cust.nickname);
                            const masterEntry = matchedMasterMap[cNormKey] || (handleCountMap[cHandleKey] === 1 ? matchedMasterMap[cHandleKey] : null);
                            const cPin = normalizePin4(
                                cust.phoneLast4 ||
                                (cust.address?.phone ? cust.address.phone.slice(-4) : '') ||
                                (masterEntry ? masterEntry.pin : '')
                            );

                            const fbCredit = findCreditForNick(cust.nickname) || Number(cust.credit) || 0;
                            const safeCustKey = String(cust.nickname || '').replace(/[.#$\[\]\/]/g, '_');
                            const isPortalConfirmed = Boolean(cust.isConfirmed || portalConfMap[safeCustKey]);

                            if (cPin && normInPin && cPin === normInPin) {
                                // 1) 비밀번호(뒷 4자리)가 등록되어 있고 완벽히 일치하는 경우: 부분 닉네임(깔로, 깔로다, 주세요 등 sc >= 1) 모두 허용!
                                const effectiveScore = sc + 10;
                                if (effectiveScore > bestPinScore) {
                                    bestPinScore = effectiveScore;
                                    const fallbackAddrObj = cust.address || (masterEntry ? {
                                        realname: masterEntry.addr.realname || '',
                                        phone: fixPhoneStr(masterEntry.addr.phone || ''),
                                        zipcode: masterEntry.addr.zipcode || '',
                                        baseAddress: masterEntry.addr.address || '',
                                        detailAddress: '',
                                        memo: masterEntry.addr.memo || '',
                                        updatedAt: ''
                                    } : (bestMasterAddr && cleanHandle(bestMasterAddr.nickname) === cHandleKey ? {
                                        realname: bestMasterAddr.realname || '',
                                        phone: fixPhoneStr(bestMasterAddr.phone || ''),
                                        zipcode: bestMasterAddr.zipcode || '',
                                        baseAddress: bestMasterAddr.address || '',
                                        detailAddress: '',
                                        memo: bestMasterAddr.memo || '',
                                        updatedAt: ''
                                    } : null));

                                    bestPinCand = {
                                        ...cust,
                                        _matchScore: effectiveScore,
                                        credit: fbCredit,
                                        phoneLast4: cPin,
                                        address: fallbackAddrObj,
                                        isConfirmed: isPortalConfirmed
                                    };
                                }
                            } else if (!cPin && sc === 3) {
                                // 2) 아직 전화번호(비밀번호)가 전혀 없는 신규 고객 주문서:
                                // 남의 미입력 주문서가 끌려오지 않도록 부분 포함(sc=2)은 제외하고, 핸들/영어를 뺀 한글 이름이 100% 일치(sc=3)할 때만 후보 등록
                                bestUnpinnedCand = {
                                    ...cust,
                                    _matchScore: 3,
                                    credit: fbCredit,
                                    phoneLast4: normInPin,
                                    address: cust.address || null,
                                    isConfirmed: isPortalConfirmed
                                };
                            } else if (cPin && normInPin && cPin !== normInPin) {
                                pinMismatchFound = true;
                            }
                        });

                        if (bestPinCand) {
                            pinVerifiedMatches.push(bestPinCand);
                        } else if (bestUnpinnedCand) {
                            unpinnedExactMatches.push(bestUnpinnedCand);
                        }
                    });
                }

                // 비밀번호로 검증된 주문서가 하나라도 있으면, 해당 고객의 고유 닉네임(lockedNick)과 일치하는 방송만 표시 (다른 사람의 미입력 주문서 혼입 완벽 차단!)
                let matchedHistory = [];
                if (pinVerifiedMatches.length > 0) {
                    pinVerifiedMatches.sort((a, b) => (b._matchScore || 0) - (a._matchScore || 0));
                    const primaryNick = pinVerifiedMatches[0].nickname;
                    const primaryNorm = normalizeNick(primaryNick);
                    const primaryHandle = cleanHandle(primaryNick);

                    matchedHistory = pinVerifiedMatches.filter(item =>
                        normalizeNick(item.nickname) === primaryNorm ||
                        (primaryHandle && cleanHandle(item.nickname) === primaryHandle)
                    );
                } else if (!bestMasterAddr && unpinnedExactMatches.length > 0 && !pinMismatchFound) {
                    const primaryNick = unpinnedExactMatches[0].nickname;
                    const primaryNorm = normalizeNick(primaryNick);
                    matchedHistory = unpinnedExactMatches.filter(item => normalizeNick(item.nickname) === primaryNorm);
                }

                if (matchedHistory.length > 0) {
                    const sorted = sortHistoryByNewestDate(matchedHistory);
                    return {
                        status: 'success',
                        customerData: sorted[0],
                        historyList: sorted
                    };
                }

                // 주문 내역은 없지만 찐고객사전에 등록된 고객이고 비밀번호(뒷 4자리)가 정확히 일치하면 어떤 부분 닉네임을 쳤든 빈 주문서로 접속 허용
                if (bestMasterAddr && bestAddrScore >= 1) {
                    const aPin = bestMasterAddr.phone && String(bestMasterAddr.phone).length >= 4 ? normalizePin4(String(bestMasterAddr.phone).slice(-4)) : '';
                    if (aPin && aPin === normInPin) {
                        const emptyCard = {
                            sheetTabName: '메인주문',
                            nickname: bestMasterAddr.nickname,
                            phoneLast4: normInPin,
                            broadcastName: '최근 주문 내역 없음',
                            isVip: false,
                            credit: findCreditForNick(bestMasterAddr.nickname),
                            freeShippingThreshold: 70000,
                            cardFeeRate: 10,
                            isCard: '',
                            shipping: 0,
                            depositTotal: 0,
                            deposits: [],
                            items: [],
                            address: {
                                realname: bestMasterAddr.realname || '',
                                phone: fixPhoneStr(bestMasterAddr.phone || ''),
                                zipcode: bestMasterAddr.zipcode || '',
                                baseAddress: bestMasterAddr.address || '',
                                detailAddress: '',
                                memo: bestMasterAddr.memo || '',
                                updatedAt: ''
                            },
                            trackingNumbers: [],
                            isConfirmed: false
                        };
                        return {
                            status: 'success',
                            customerData: emptyCard,
                            historyList: [emptyCard]
                        };
                    }
                }

                if (pinMismatchFound) {
                    return { status: 'error', errorType: 'WRONG_PIN' };
                }
            } catch (e) {}
            return null;
        };

        // 사업자 정보 설정 (주소나 이메일/연락처를 필요 시 수정하세요)
        const BUSINESS_INFO = {
            companyName: "엠버언니",
            ceoName: "김선정",
            privacyOfficer: "김선정",
            bizNumber: "259-20-02160",
            mailOrderNumber: "2026-서울동대문-1240",
            csCenter: "카카오톡 채널 '엠버언니'",
            address: "서울특별시 동대문구"
        };

        // 대문 고정 화보 이미지 (모바일 데이터 절약 및 초고속 로딩을 위해 w=720, q=75 최적화)
        const FIXED_AUTUMN_WINTER_HERO = 'https://images.unsplash.com/photo-1539109136881-3be0616acf4b?auto=format&fit=crop&w=720&q=75';
        const FALLBACK_COAT_HERO = 'https://images.unsplash.com/photo-1548624313-0396c75e4b1a?auto=format&fit=crop&w=720&q=75';

        const Icon = ({ name, className = "", weight = "regular", size = 16 }) => (
            <i className={`ph ph-${name} ${className}`} data-phosphor-icon-weight={weight} style={{ fontSize: size }}></i>
        );

        const normalizeNick = (str) => {
            return String(str || "").replace(/[\s\(\)\[\]\{\}\-\_\.\,\/]/g, "").toLowerCase();
        };

        const cleanHandle = (str) => {
            if (!str) return "";
            let s = String(str).trim();
            // 뒤에 붙은 유튜브 핸들 꼬리표(-SD2 등 -영문숫자 2~8자) 제거
            s = s.replace(/-[a-zA-Z0-9]{2,8}$/, "");
            return s.replace(/[\s\(\)\[\]\{\}\-\_\.\,\/]/g, "").toLowerCase();
        };

        const extractKorean = (str) => {
            if (!str) return "";
            return String(str).replace(/[^가-힣]/g, "");
        };

        // 한글 모음(ㅐ/ㅔ, ㅒ/ㅖ) 혼동 오타 보정용 정규화 함수 (예: 태로맘 === 테로맘)
        const normalizeKoreanVowel = (str) => {
            const s = normalizeNick(str);
            let out = "";
            for (let i = 0; i < s.length; i++) {
                const code = s.charCodeAt(i);
                if (code >= 0xAC00 && code <= 0xD7A3) {
                    const offset = code - 0xAC00;
                    const cho = Math.floor(offset / 588);
                    let jung = Math.floor((offset % 588) / 28);
                    const jong = offset % 28;
                    if (jung === 1) jung = 5; // ㅐ -> ㅔ 통일
                    if (jung === 3) jung = 7; // ㅒ -> ㅖ 통일
                    out += String.fromCharCode(0xAC00 + cho * 588 + jung * 28 + jong);
                } else {
                    out += s[i];
                }
            }
            return out;
        };

        // 고객이 입력한 닉네임(또는 한글 일부/실명)과 DB의 닉네임/실명 간의 일치 점수를 계산하는 스마트 매칭 함수
        // 사장님 주문서에는 핸들/영어가 다 포함되어 있고(예: 깔로다주세요-SD2),
        // 고객은 영어/핸들을 빼고 '깔로', '깔로다', '깔로다주', '주세요' 등 일부만 입력하므로 DB닉네임이 고객입력값을 포함하는 경우만 인정합니다!
        const getNickMatchScore = (dbNick, dbRealname, userInput) => {
            if (!userInput || !dbNick) return 0;
            const nDb = normalizeNick(dbNick);
            const nIn = normalizeNick(userInput);
            if (!nIn || !nDb) return 0;

            // 1순위(3점): 대소문자/공백 무시 완전 일치 또는 핸들 꼬리표(-SD2 등) 제거 후 완전 일치
            if (nDb === nIn) return 3;
            const cDb = cleanHandle(dbNick);
            const cIn = cleanHandle(userInput);
            if (cDb && cIn && cDb === cIn) return 3;

            // 2순위: 주문서 아이디에서 영어/숫자/기호를 뺀 순수 한글 비교
            // 예: DB '깔로다주세요-SD2' -> 순수 한글 '깔로다주세요'
            // 고객 입력: '깔로다주세요'(3점), '깔로', '깔로다', '깔로다주', '주세요'(2점)
            // 주의: 반드시 DB의 한글 닉네임(kDb)이 고객 입력 한글(kIn)을 포함(kDb.includes(kIn))해야 하며, 반대로 1글자짜리 kDb('영')가 '하이영'에 포함되는 역방향 매칭은 절대 금지!
            const kDb = extractKorean(cDb || nDb);
            const kIn = extractKorean(cIn || nIn);
            if (kDb && kIn) {
                if (kDb.length >= 2 && kDb === kIn) return 3;
                if (kIn.length >= 2 && kDb.length >= 2 && kDb.includes(kIn)) return 2;
                const vDb = normalizeKoreanVowel(kDb);
                const vIn = normalizeKoreanVowel(kIn);
                if (vDb.length >= 2 && vDb === vIn) return 2;
                if (vIn.length >= 2 && vDb.length >= 2 && vDb.includes(vIn)) return 2;
            }

            // 영문/숫자 포함 부분 일치 (반드시 DB 닉네임이 고객 입력값(2자 이상)을 포함할 때만 인정)
            if (nIn.length >= 2 && nDb.length >= 2 && nDb.includes(nIn)) return 2;
            if (cIn.length >= 2 && cDb.length >= 2 && cDb.includes(cIn)) return 2;

            // 3순위(1점): 닉네임 대신 수령인 실명(본명) 전체를 정확히 입력한 경우만 인정
            const nReal = normalizeNick(dbRealname);
            if (nReal && nIn.length >= 2 && nReal === nIn) return 1;

            return 0;
        };

        const isFlexibleNickMatch = (rowNick, inputNick, rowRealname = "") => {
            return getNickMatchScore(rowNick, rowRealname, inputNick) > 0;
        };

        const fixPhoneStr = (p) => {
            if (!p) return "";
            let c = String(p).replace(/[^0-9]/g, "");
            if (c.length === 10 && !c.startsWith("0")) c = "0" + c;
            return c;
        };

        const normalizePin4 = (val) => {
            if (val === undefined || val === null) return "";
            const digits = String(val).replace(/[^0-9]/g, "");
            if (!digits) return "";
            return digits.length < 4 ? digits.padStart(4, "0") : digits.slice(-4);
        };

        const maskName = (name) => {
            if (!name) return "";
            const s = String(name).trim();
            if (s.length <= 1) return s;
            if (s.length === 2) return s[0] + "*";
            return s[0] + "*".repeat(s.length - 2) + s[s.length - 1];
        };

        const maskPhone = (phone) => {
            if (!phone) return "";
            const clean = String(phone).replace(/[^0-9]/g, "");
            if (clean.length < 7) return phone;
            return `${clean.slice(0, 3)}-****-${clean.slice(-4)}`;
        };

        const maskAddress = (baseAddr, detailAddr, zipcode) => {
            const cleanZip = String(zipcode || "").replace(/[^0-9]/g, "");
            const cleanBase = String(baseAddr || "").replace(/^\(\d{5}\)\s*/, "").trim();
            const d = String(detailAddr || "").trim();
            const full = `${cleanBase} ${d}`.trim();
            if (!full) return "";

            const zipPart = cleanZip ? `(${cleanZip.slice(0, 3)}**) ` : "";

            // 1) 괄호 안 아파트/건물명 마스킹: (연산동, 연산엘지아파트) -> (연산동, *****)
            let masked = full.replace(/\(([^)]+)\)/g, (match, inner) => {
                if (inner.includes(",")) {
                    const parts = inner.split(",");
                    return `(${parts[0].trim()}, *****)`;
                }
                return inner.length > 2 ? `(${inner.slice(0, 2)}***)` : `(${inner})`;
            });

            // 2) 동·호·층·번지 숫자 확실히 마스킹: 115동1704호 -> ***동****호
            masked = masked.replace(/(\d+)\s*(동|호|층|번지|길|로\s*\d*)/g, (m, num, unit) => {
                if (unit.startsWith("길") || unit.startsWith("로")) return m;
                return `${"*".repeat(Math.max(2, num.length))}${unit}`;
            });

            // 3) 도로명/지번 본번·부번 및 남은 상세 숫자 마스킹 (예: 고분로 200 -> 고분로 ***, 101-1204 -> ***-****)
            masked = masked.replace(/\d+-\d+/g, "***-****");
            masked = masked.replace(/([가-힣]+(?:로|길|동|읍|면|리))\s+(\d+)(-\d+)?/g, "$1 ***");

            // 4) 그 외 뒤에 남은 2자리 이상 숫자도 모두 마스킹
            masked = masked.replace(/\d{2,}/g, (n) => "*".repeat(n.length));

            return `${zipPart}${masked}`;
        };

        const formatKstDateString = (val) => {
            if (!val) return "";
            const s = String(val).trim();
            if (/^\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}/.test(s)) return s.slice(0, 16);
            const dt = new Date(s);
            if (!isNaN(dt.getTime()) && (s.includes("T") || s.includes("GMT") || s.endsWith("Z"))) {
                const kst = new Date(dt.getTime() + 9 * 60 * 60 * 1000);
                const yyyy = kst.getUTCFullYear();
                const mm = String(kst.getUTCMonth() + 1).padStart(2, '0');
                const dd = String(kst.getUTCDate()).padStart(2, '0');
                const hh = String(kst.getUTCHours()).padStart(2, '0');
                const min = String(kst.getUTCMinutes()).padStart(2, '0');
                return `${yyyy}-${mm}-${dd} ${hh}:${min}`;
            }
            return s;
        };

        const getKstNowString = () => {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd} ${hh}:${min}`;
        };

        // 방송명/탭이름(예: "주문_10/20 악세사리", "10 18 여성복", "10월 16일")에서 날짜 숫자를 추출해 최신 날짜순(내림차순) 정렬용 점수를 계산하는 함수
        const extractBroadcastDateScore = (titleOrTab) => {
            const s = String(titleOrTab || '').replace(/^주문_/, '').trim();
            if (!s) return 0;
            // 1) YYYY-MM-DD 또는 YY-MM-DD 형식
            const fullMatch = s.match(/(?:20)?(\d{2})[./\-\s년]+(\d{1,2})[./\-\s월]+(\d{1,2})/);
            if (fullMatch) {
                const yy = parseInt(fullMatch[1], 10);
                const mm = parseInt(fullMatch[2], 10);
                const dd = parseInt(fullMatch[3], 10);
                if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) {
                    return (2000 + yy) * 10000 + mm * 100 + dd;
                }
            }
            // 2) MM/DD, MM.DD, MM-DD, MM DD, MM월 DD일 형식 (예: "10/20 악세사리", "10 18 여성복", "10 16 여성복")
            const mdMatch = s.match(/(?:^|[^\d])(1[0-2]|0?[1-9])[./\-\s월]+([0-2]?\d|3[01])(?:일|\b|\s|[^0-9])/);
            if (mdMatch) {
                const mm = parseInt(mdMatch[1], 10);
                const dd = parseInt(mdMatch[2], 10);
                return 2026 * 10000 + mm * 100 + dd;
            }
            return 0;
        };

        const sortHistoryByNewestDate = (list) => {
            if (!Array.isArray(list)) return [];
            return [...list].sort((a, b) => {
                const scoreA = extractBroadcastDateScore(a?.broadcastName || a?.sheetTabName || '');
                const scoreB = extractBroadcastDateScore(b?.broadcastName || b?.sheetTabName || '');
                if (scoreA !== scoreB) return scoreB - scoreA; // 늦은(최신) 날짜가 무조건 맨 앞으로!
                return 0;
            });
        };

        // 🛡️ 서버(GAS 또는 Firebase)에서 넘어온 주문 목록 중 비밀번호가 다르거나 다른 사람의 주문서가 섞여 있으면 화면 표시 전에 100% 제거하는 보안 필터
        const filterVerifiedHistoryList = (rawList, rawNickInput, cleanPinInput, lockedFullNick = "") => {
            if (!Array.isArray(rawList) || rawList.length === 0) return [];
            const normInPin = normalizePin4(cleanPinInput);

            // 1차 필터: 입력한 닉네임과 매칭 점수가 0점이거나, 주문서에 적힌 비밀번호가 입력한 비밀번호와 다른 항목은 무조건 즉시 제거!
            const step1 = rawList.filter(item => {
                if (!item || !item.nickname) return false;
                const itemPin = normalizePin4(
                    item.phoneLast4 ||
                    (item.address && item.address.phone ? String(item.address.phone).slice(-4) : "")
                );
                // 다른 비밀번호가 등록된 주문서는 어떤 경우에도 절대 표시 불가!
                if (itemPin && normInPin && itemPin !== normInPin) {
                    return false;
                }
                const sc = getNickMatchScore(item.nickname, item.address?.realname || "", rawNickInput);
                const lockedSc = lockedFullNick ? getNickMatchScore(item.nickname, "", lockedFullNick) : 0;
                if (sc <= 0 && lockedSc <= 0) {
                    return false;
                }
                // 비밀번호가 일치하는 주문서는 부분 닉네임(sc >= 1)도 허용하되, 비밀번호가 아예 없는 미입력 주문서는 정확히 이름이 일치(sc === 3)할 때만 허용
                if (!itemPin && sc < 3 && lockedSc < 3) {
                    return false;
                }
                return true;
            });

            if (step1.length === 0) return [];

            // 2차 필터: 확인된 본인 대표 닉네임(primaryNick)과 동일한 계정의 주문서만 남김 (다른 사람의 다른 방송 주문서 혼입 완벽 차단)
            const sortedByConfidence = [...step1].sort((a, b) => {
                const aPin = normalizePin4(a.phoneLast4 || (a.address?.phone ? String(a.address.phone).slice(-4) : ""));
                const bPin = normalizePin4(b.phoneLast4 || (b.address?.phone ? String(b.address.phone).slice(-4) : ""));
                const aHasPin = (aPin && aPin === normInPin) ? 1 : 0;
                const bHasPin = (bPin && bPin === normInPin) ? 1 : 0;
                if (aHasPin !== bHasPin) return bHasPin - aHasPin;
                const scA = getNickMatchScore(a.nickname, a.address?.realname || "", rawNickInput);
                const scB = getNickMatchScore(b.nickname, b.address?.realname || "", rawNickInput);
                return scB - scA;
            });

            const targetNick = lockedFullNick || sortedByConfidence[0].nickname;
            const targetNorm = normalizeNick(targetNick);
            const targetHandle = cleanHandle(targetNick);

            return sortHistoryByNewestDate(step1.filter(item =>
                normalizeNick(item.nickname) === targetNorm ||
                (targetHandle && cleanHandle(item.nickname) === targetHandle)
            ));
        };

            // 바닥에 완전히 도달해 멈춘(0.45초 이상 정지) 뒤, 한 번 더 강하게 아래로 당길 때만 사업자정보 창이 열리도록 정밀 감지
            useEffect(() => {
                if (!currentUser) {
                    setShowBizFooter(false);
                    bottomReachedAtRef.current = 0;
                    wheelOverscrollCountRef.current = 0;
                    return;
                }
                const isAtPageBottom = () => {
                    const scrollBottom = window.innerHeight + window.scrollY;
                    const docHeight = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
                    return scrollBottom >= docHeight - 6;
                };
                const handleScroll = () => {
                    if (isAtPageBottom()) {
                        if (bottomReachedAtRef.current === 0) {
                            bottomReachedAtRef.current = Date.now();
                        }
                    } else {
                        bottomReachedAtRef.current = 0;
                        wheelOverscrollCountRef.current = 0;
                    }
                };
                const handleTouchStart = (e) => {
                    // 이미 바닥에 도달한 지 0.45초 이상 지난 상태에서 다시 터치해 당길 때만 시작점 기록 (일반 스크롤 관성 완전 무시)
                    if (e.touches && e.touches.length === 1 && isAtPageBottom() && bottomReachedAtRef.current > 0 && (Date.now() - bottomReachedAtRef.current > 450)) {
                        touchStartYRef.current = e.touches[0].clientY;
                    } else {
                        touchStartYRef.current = null;
                    }
                };
                const handleTouchMove = (e) => {
                    if (touchStartYRef.current !== null && e.touches && e.touches.length === 1) {
                        const deltaY = touchStartYRef.current - e.touches[0].clientY;
                        // 바닥 정지 상태에서 위로 95px 이상 강하게 한 번 더 끌어올렸을 때만 사업자정보 오픈
                        if (deltaY > 95 && isAtPageBottom()) {
                            setShowBizFooter(true);
                            touchStartYRef.current = null;
                        }
                    }
                };
                const handleWheel = (e) => {
                    if (!isAtPageBottom()) {
                        wheelOverscrollCountRef.current = 0;
                        return;
                    }
                    if (bottomReachedAtRef.current === 0) {
                        bottomReachedAtRef.current = Date.now();
                        return;
                    }
                    // 바닥에 닿아 0.45초 이상 멈춘 뒤 마우스 휠을 아래로 4번 이상 연속 내렸을 때만 오픈
                    if (e.deltaY > 30 && (Date.now() - bottomReachedAtRef.current > 450)) {
                        wheelOverscrollCountRef.current += 1;
                        if (wheelOverscrollCountRef.current >= 4) {
                            setShowBizFooter(true);
                            wheelOverscrollCountRef.current = 0;
                        }
                    }
                };
                window.addEventListener('scroll', handleScroll, { passive: true });
                window.addEventListener('touchstart', handleTouchStart, { passive: true });
                window.addEventListener('touchmove', handleTouchMove, { passive: true });
                window.addEventListener('wheel', handleWheel, { passive: true });
                return () => {
                    window.removeEventListener('scroll', handleScroll);
                    window.removeEventListener('touchstart', handleTouchStart);
                    window.removeEventListener('touchmove', handleTouchMove);

                    [cleanDigits]: { loading: true, loaded: false, stateText: "실시간 위치 조회중...", steps: [] }
                }));

                // 1) 테스트 샘플 송장번호인 경우 즉시 인라인 배송흐름 표시
                if (cleanDigits === "254819203841" || cleanDigits === "254800987712") {
                    setTimeout(() => {
                        setTrackingMap(prev => ({
                            ...prev,
                            [cleanDigits]: {
                                loading: false,
                                loaded: true,
                                stateText: cleanDigits === "254800987712" ? "배달완료" : "배송중 (간선하차)",
                                steps: cleanDigits === "254800987712" ? [
                                    { time: "2026-10-13 14:22", location: "서울성동(대)", status: "배달완료 · 고객님께 물품을 전달하였습니다 (문앞 배송)" },
                                    { time: "2026-10-13 08:40", location: "서울성동(대)", status: "배달출발 · 배달을 준비중입니다" },
                                    { time: "2026-10-12 22:15", location: "동서울터미널", status: "간선하차 · 물류터미널에 도착하였습니다" },
                                    { time: "2026-10-12 17:30", location: "광주광산(대)", status: "집하완료 · 보내시는 고객님으로부터 상품을 인수받았습니다" }
                                ] : [
                                    { time: "2026-10-19 01:15", location: "수도권메가허브", status: "간선하차 · 물류터미널에서 행선지별 분류중입니다" },
                                    { time: "2026-10-18 21:40", location: "광주터미널", status: "간선상차 · 수도권행 간선차량으로 출발하였습니다" },
                                    { time: "2026-10-18 18:10", location: "광주서구(대)", status: "집하완료 · 보내시는 고객님으로부터 상품을 인수받았습니다" }
                                ]
                            }
                        }));
                    }, 180);
                    return;
                }

                // 2) 공개 배송조회 API 1차 시도 (tracker.delivery - 롯데택배 kr.lotte)
                try {
                    const res = await fetch(`https://apis.tracker.delivery/carriers/kr.lotte/tracks/${cleanDigits}`);
                    if (res.ok) {
                        const data = await res.json();
                        const progresses = Array.isArray(data.progresses) ? [...data.progresses].reverse() : [];
                        if (progresses.length > 0) {
                            setTrackingMap(prev => ({
                                ...prev,
                                [cleanDigits]: {
                                    loading: false,
                                    loaded: true,
                                    stateText: data.state?.text || "배송중",
                                    steps: progresses.map(p => ({
                                        time: formatKstDateString(p.time),
                                        location: p.location?.name || "롯데택배",
                                        status: p.status?.text ? `${p.status.text}${p.description ? ` · ${p.description}` : ''}` : (p.description || '')
                                    }))
                                }
                            }));
                            return;
                        }
                    }
                } catch (e) {}

                // 3) 구글 앱스 스크립트 서버를 통한 롯데택배 직접 파싱 2차 시도
                try {
                    const gasRes = await fetch(`${DEFAULT_GAS_URL}?action=get_lotte_tracking&invNo=${cleanDigits}&t=${Date.now()}`);
                    const gasData = await gasRes.json();
                    if (gasData && gasData.status === 'success' && Array.isArray(gasData.steps) && gasData.steps.length > 0) {
                        setTrackingMap(prev => ({
                            ...prev,
                            [cleanDigits]: {
                                loading: false,
                                loaded: true,
                                stateText: gasData.stateText || "배송중",
                                steps: gasData.steps
                            }
                        }));
                        return;
                    }
                } catch (e) {}

                setTrackingMap(prev => ({
                    ...prev,
                    [cleanDigits]: {
                        loading: false,
                        loaded: true,
                        stateText: "운송장 등록 완료 (택배사 집하 대기중)",
                        steps: []
                    }
                }));
            };

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(""), 2200);
            };

            const copyText = (text, label) => {
                const ta = document.createElement("textarea");
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand("copy");
                    showToast(`${label} 복사되었습니다.`);
                } catch (e) {}
                document.body.removeChild(ta);
            };

            const initAddressState = (userObj) => {
                const hasTrk = Boolean(
                    (Array.isArray(userObj?.trackingNumbers) && userObj.trackingNumbers.length > 0) ||
                    (userObj?.trackingNumber && String(userObj.trackingNumber).trim() !== "")
                );
                if (userObj && userObj.address && userObj.address.baseAddress) {
                    setAddrForm(userObj.address);
                    setIsEditingAddress(false);
                    setAgreePrivacy(true);
                    setAgreeThirdParty(true);
                } else if (hasTrk) {
                    setAddrForm(userObj?.address || { realname: "", phone: "", zipcode: "", baseAddress: "", detailAddress: "", memo: "" });
                    setIsEditingAddress(false);
                } else {
                    setAddrForm({ realname: "", phone: "", zipcode: "", baseAddress: "", detailAddress: "", memo: "" });
                    setIsEditingAddress(true);
                    setAgreePrivacy(false);
                    setAgreeThirdParty(false);
                }
            };

            const handleSelectBroadcast = (idx) => {
                if (!orderHistoryList[idx]) return;
                setSelectedBroadcastIdx(idx);
                setIsDepositHistoryOpen(false);
                const targetOrder = orderHistoryList[idx];
                setCurrentUser(targetOrder);
                initAddressState(targetOrder);
            };

            const handleLogin = async (e, customNick, customPin, isRefreshCall = false) => {
                if (e) e.preventDefault();
                setLoginError("");

                const rawNick = customNick !== undefined ? customNick : nickInput;
                const rawPin = customPin !== undefined ? customPin : pinInput;

                const cleanNick = cleanHandle(rawNick);
                const cleanPin = String(rawPin).trim();

                if (!cleanNick) {
                    setLoginError("유튜브 닉네임을 입력해 주세요.");
                    return;
                }
                if (cleanPin.length !== 4) {
                    setLoginError("비밀번호(휴대폰 뒷 4자리)를 입력해 주세요.");
                    return;
                }

                setIsLoading(true);
                if (isRefreshCall) {
                    setIsRefreshing(true);
                }
                setTrackingMap({});

                const sampleMatch = SAMPLE_DB.find(u => isFlexibleNickMatch(u.nickname, rawNick, u.address?.realname));
                if (sampleMatch) {
                    setTimeout(() => {
                        setIsLoading(false);
                        setIsRefreshing(false);
                        if (normalizePin4(sampleMatch.phoneLast4) === normalizePin4(cleanPin)) {
                            const rawHList = Array.isArray(sampleMatch.historyList) && sampleMatch.historyList.length > 0
                                ? sampleMatch.historyList
                                : [sampleMatch];
                            const hList = sortHistoryByNewestDate(rawHList);
                            setOrderHistoryList(hList);
                            const nextIdx = isRefreshCall && selectedBroadcastIdx < hList.length ? selectedBroadcastIdx : 0;
                            setSelectedBroadcastIdx(nextIdx);
                            setCurrentUser(hList[nextIdx]);
                            initAddressState(hList[nextIdx]);
                            if (isRefreshCall) showToast("✨ 최신 주문·입금 내역으로 새로고침되었습니다!");
                        } else {
                            setLoginError("비밀번호(뒷 4자리)가 일치하지 않습니다.");
                        }
                    }, 200);
                    return;
                }

                try {
                    const fetchOrderWithPin = async (targetPin, targetNickOverride) => {
                        const queryNick = targetNickOverride !== undefined ? targetNickOverride : rawNick;
                        const url = `${DEFAULT_GAS_URL}?action=get_customer_order&masterId=${DEFAULT_MASTER_SHEET_ID}&nickname=${encodeURIComponent(queryNick)}&pin=${encodeURIComponent(targetPin)}&t=${Date.now()}`;
                        return await fetchGasWithRetry(url, null, 2);
                    };

                    // 🚀 1단계: Firebase 실시간 클라우드(0.1초)와 구글 시트를 스마트하게 병합하여 입금내역이 가장 최신인 데이터를 즉시 표시!
                    let fbInstantData = await lookupOrderFromFirebase(rawNick, cleanPin);
                    if (fbInstantData && fbInstantData.status === "success" && fbInstantData.customerData && !isRefreshCall) {
                        const verifiedFbList = filterVerifiedHistoryList(fbInstantData.historyList || [fbInstantData.customerData], rawNick, cleanPin);
                        if (verifiedFbList.length > 0) {
                            const hList = sortHistoryByNewestDate(verifiedFbList);
                            setOrderHistoryList(hList);
                            setSelectedBroadcastIdx(0);
                            setCurrentUser(hList[0]);
                            initAddressState(hList[0]);
                            setIsLoading(false);
                            setIsRefreshing(false);

                            // 백그라운드에서 구글 시트 데이터도 가져오되, 반드시 본인 닉네임 및 비밀번호 검증 필터(filterVerifiedHistoryList)를 통과한 주문서만 병합!
                            const resolvedFullNick = hList[0]?.nickname || rawNick;
                            fetchOrderWithPin(cleanPin, resolvedFullNick).then(gasRes => {
                                if (gasRes && gasRes.status === "success" && Array.isArray(gasRes.historyList) && gasRes.historyList.length > 0) {
                                    const gasList = filterVerifiedHistoryList(gasRes.historyList, rawNick, cleanPin, resolvedFullNick);
                                    if (gasList.length === 0) return;
                                    const mergedMap = new Map();
                                    hList.forEach(item => mergedMap.set(item.sheetTabName || item.broadcastName, item));
                                    gasList.forEach(gItem => {
                                        const key = gItem.sheetTabName || gItem.broadcastName;
                                        const existing = mergedMap.get(key);
                                        if (!existing) {
                                            mergedMap.set(key, gItem);
                                        } else {
                                            const bestCredit = Math.max(Number(existing.credit) || 0, Number(gItem.credit) || 0);
                                            const bestDep = (Number(existing.credit) > Number(gItem.credit) && Number(existing.depositTotal) > 0)
                                                ? Number(existing.depositTotal)
                                                : Math.max(Number(existing.depositTotal) || 0, Number(gItem.depositTotal) || 0);
                                            const bestDepsArr = (Array.isArray(gItem.deposits) && gItem.deposits.length > (existing.deposits?.length || 0)) ? gItem.deposits : (existing.deposits || []);
                                            mergedMap.set(key, {
                                                ...gItem,
                                                ...existing,
                                                depositTotal: bestDep,
                                                credit: bestCredit,
                                                deposits: bestDepsArr,
                                                address: existing.address || gItem.address,
                                                isConfirmed: existing.isConfirmed || gItem.isConfirmed
                                            });
                                        }
                                    });
                                    const finalMerged = sortHistoryByNewestDate(Array.from(mergedMap.values()));
                                    setOrderHistoryList(finalMerged);
                                    setCurrentUser(finalMerged[0]);
                                }
                            }).catch(() => {});
                            return;
                        }
                    }

                    let data = await fetchOrderWithPin(cleanPin);
                    if (data && data.status === "success") {
                        const rawGasList = Array.isArray(data.historyList) && data.historyList.length > 0 ? data.historyList : (data.customerData ? [data.customerData] : []);
                        const verifiedGasList = filterVerifiedHistoryList(rawGasList, rawNick, cleanPin);
                        if (verifiedGasList.length > 0) {
                            data = {
                                ...data,
                                customerData: verifiedGasList[0],
                                historyList: verifiedGasList
                            };
                        } else {
                            data = { status: "not_found" };
                        }
                    }
                    if (fbInstantData && fbInstantData.errorType === "WRONG_PIN" && (!data || data.status === "not_found")) {
                        data = fbInstantData;
                    }

                    // ✨ 만약 최근 방송 주문서('주문_' 시트)에서 부분 닉네임을 바로 못 찾았더라도, '찐고객사전', '고객상태관리', 또는 '메인주문'에서
                    // 한글 부분 일치('깔로', '깔로다', '깔로다주', '주세요' 등) + 전화번호 뒷 4자리(PIN)가 일치하는 고객을 찾아 즉시 열어줍니다!
                    if (data && data.status === "not_found") {
                        try {
                            const [dictJson, mainOrderJson] = await Promise.all([
                                fetchGasWithRetry(`${DEFAULT_GAS_URL}?action=get_all&masterId=${DEFAULT_MASTER_SHEET_ID}&t=${Date.now()}`, null, 2).catch(() => null),
                                fetchGasWithRetry(`${DEFAULT_GAS_URL}?action=get_orders&masterId=${DEFAULT_MASTER_SHEET_ID}&tabName=${encodeURIComponent('메인주문')}&t=${Date.now()}`, null, 2).catch(() => null)
                            ]);
                            if (dictJson && dictJson.status === "success") {
                                const mAddrs = Array.isArray(dictJson.masterAddresses) ? dictJson.masterAddresses : [];
                                const cDb = Array.isArray(dictJson.customerDb) ? dictJson.customerDb : [];
                                const mainRows = (mainOrderJson && Array.isArray(mainOrderJson.data)) ? mainOrderJson.data : [];
                                const normInPin = normalizePin4(cleanPin);

                                // 닉네임별로 찐고객사전 + 고객상태관리 + 메인주문 정보를 하나로 통합
                                const candidateMap = new Map();

                                mAddrs.forEach(a => {
                                    const n = String(a.nickname || a['닉네임'] || a['주문자'] || a.col_0 || '').trim();
                                    if (!n || n.toLowerCase() === 'nickname') return;
                                    const rName = String(a.realname || a['수령인명'] || a.col_1 || '').trim();
                                    const score = getNickMatchScore(n, rName, rawNick);
                                    if (score > 0) {
                                        const ph = fixPhoneStr(a.phone || a['연락처'] || a.col_2);
                                        const pinFromPh = ph.length >= 4 ? normalizePin4(ph.slice(-4)) : '';
                                        const key = cleanHandle(n) || normalizeNick(n);
                                        const prev = candidateMap.get(key) || { nick: n, sheetNick: '', realname: rName, score: 0, pins: new Set(), addrRow: null, custRow: null };
                                        prev.nick = n;
                                        if (rName) prev.realname = rName;
                                        if (score > prev.score) prev.score = score;
                                        if (pinFromPh) prev.pins.add(pinFromPh);
                                        prev.addrRow = a;
                                        candidateMap.set(key, prev);
                                    }
                                });

                                cDb.forEach(c => {
                                    const n = String(c['닉네임'] || '').trim();
                                    if (!n) return;
                                    const score = getNickMatchScore(n, '', rawNick);
                                    if (score > 0) {
                                        const key = cleanHandle(n) || normalizeNick(n);
                                        const prev = candidateMap.get(key) || { nick: n, sheetNick: '', realname: '', score: 0, pins: new Set(), addrRow: null, custRow: null };
                                        if (n.includes('-')) prev.sheetNick = n;
                                        if (score > prev.score) prev.score = score;
                                        if (c['비밀번호']) prev.pins.add(normalizePin4(c['비밀번호']));
                                        prev.custRow = c;
                                        candidateMap.set(key, prev);
                                    }
                                });

                                mainRows.forEach(r => {
                                    const n = String(r['닉네임'] || r['주문자'] || '').trim();
                                    if (!n || n === '___WORKSPACE_META___') return;
                                    const rName = String(r['수령인명'] || '').trim();
                                    const score = getNickMatchScore(n, rName, rawNick);
                                    if (score > 0) {
                                        const key = cleanHandle(n) || normalizeNick(n);
                                        const prev = candidateMap.get(key) || { nick: n, sheetNick: n, realname: rName, score: 0, pins: new Set(), addrRow: null, custRow: null };
                                        prev.sheetNick = n;
                                        if (score > prev.score) prev.score = score;
                                        const rPin = normalizePin4(r['비밀번호']);
                                        const rPh = fixPhoneStr(r['연락처']);
                                        if (rPin) prev.pins.add(rPin);
                                        if (rPh.length >= 4) prev.pins.add(normalizePin4(rPh.slice(-4)));
                                        candidateMap.set(key, prev);
                                    }
                                });

                                const allCandidates = Array.from(candidateMap.values());
                                // 1차 필터: 입력한 비밀번호 4자리(normInPin)와 일치하는 후보만 추출
                                const pinMatchedCandidates = allCandidates.filter(cand => cand.pins.has(normInPin));

                                // 가장 높은 매칭 점수 그룹만 추려냄 (완전일치 3점이 있으면 3점만, 없으면 2점 부분일치 등)
                                const maxScore = pinMatchedCandidates.reduce((m, c) => Math.max(m, c.score), 0);
                                const bestPinMatched = pinMatchedCandidates.filter(c => c.score === maxScore);

                                if (bestPinMatched.length > 1) {
                                    // 🚨 동일한 부분 닉네임 + 동일한 전화번호 뒷 4자리를 쓰는 동명이인이 2명 이상인 경우!
                                    const dupNames = bestPinMatched.map(c => c.sheetNick || c.nick).join(', ');
                                    data = {
                                        status: "error",
                                        message: `입력하신 이름과 뒷번호가 일치하는 고객님이 ${bestPinMatched.length}명(${dupNames}) 있습니다. 조금 더 정확한 닉네임을 입력해 주세요!`
                                    };
                                } else if (bestPinMatched.length === 1) {
                                    // ✅ 부분 닉네임(예: '깔로', '깔로다', '주세요')만 쳤어도 뒷번호 4자리가 일치하는 유일한 고객('깔로다주세요-SD2') 발견!
                                    const targetCand = bestPinMatched[0];
                                    const trueNick = targetCand.sheetNick || targetCand.nick;

                                    // 실제 풀네임(예: '깔로다주세요-SD2' 또는 '깔로다주세요')으로 서버에 주문 내역 재조회!
                                    const tryNicks = Array.from(new Set([targetCand.sheetNick, targetCand.nick].filter(Boolean)));
                                    for (const tNick of tryNicks) {
                                        if (normalizeNick(tNick) !== normalizeNick(rawNick)) {
                                            try {
                                                const dTrue = await fetchOrderWithPin(cleanPin, tNick);
                                                if (dTrue && dTrue.status === "success" && dTrue.customerData) {
                                                    const vList = filterVerifiedHistoryList(dTrue.historyList || [dTrue.customerData], rawNick, cleanPin, trueNick);
                                                    if (vList.length > 0) {
                                                        data = {
                                                            ...dTrue,
                                                            customerData: vList[0],
                                                            historyList: vList
                                                        };
                                                        break;
                                                    }
                                                }
                                            } catch (e) {}
                                        }
                                    }

                                    // 주문 시트에 품목이 없더라도 본인 배송지와 함께 정상 접속 허용!
                                    if (!data || data.status !== "success") {
                                        const latestAddr = targetCand.addrRow;
                                        const matchedCust = targetCand.custRow;
                                        const ph = latestAddr ? fixPhoneStr(latestAddr.phone || latestAddr['연락처'] || latestAddr.col_2) : '';
                                        const rawAddrStr = latestAddr ? String(latestAddr.address || latestAddr['주소'] || latestAddr.col_3 || '').trim() : '';
                                        const zipM = rawAddrStr.match(/^\((\d{5})\)\s*(.*)$/);
                                        const addrObj = latestAddr ? {
                                            realname: String(latestAddr.realname || latestAddr['수령인명'] || latestAddr.col_1 || '').trim(),
                                            phone: ph,
                                            zipcode: zipM ? zipM[1] : String(latestAddr.zipcode || latestAddr.col_4 || '').trim(),
                                            baseAddress: zipM ? zipM[2] : rawAddrStr,
                                            detailAddress: '',
                                            memo: String(latestAddr.memo || latestAddr['배송메모'] || latestAddr.col_5 || '').trim(),
                                            updatedAt: String(latestAddr.timestamp || latestAddr['저장시간'] || latestAddr.col_6 || '').trim()
                                        } : null;

                                        const emptyOrderCard = {
                                            sheetTabName: '메인주문',
                                            nickname: trueNick,
                                            phoneLast4: normInPin,
                                            broadcastName: '최근 주문 내역 없음',
                                            isVip: matchedCust && String(matchedCust['고객상태'] || '').toLowerCase() === 'vip',
                                            freeShippingThreshold: 70000,
                                            cardFeeRate: 10,
                                            isCard: '',
                                            shipping: 0,
                                            depositTotal: 0,
                                            deposits: [],
                                            items: [],
                                            address: addrObj && addrObj.baseAddress ? addrObj : null,
                                            trackingNumbers: [],
                                            isConfirmed: false
                                        };
                                        data = {
                                            status: "success",
                                            customerData: emptyOrderCard,
                                            historyList: [emptyOrderCard]
                                        };
                                    }
                                } else if (allCandidates.length > 0) {
                                    // 닉네임은 비슷한 사람이 있는데 비밀번호가 틀린 경우
                                    data = { status: "error", errorType: "WRONG_PIN" };
                                }
                            }
                        } catch (fallbackErr) {}
                    }

                    setIsLoading(false);
                    setIsRefreshing(false);

                    if (data && data.status === "success" && data.customerData) {
                        const rawHList = Array.isArray(data.historyList) && data.historyList.length > 0 ? data.historyList : [data.customerData];
                        const verifiedFinalList = filterVerifiedHistoryList(rawHList, rawNick, cleanPin, data.customerData.nickname);
                        const hList = sortHistoryByNewestDate(verifiedFinalList.length > 0 ? verifiedFinalList : [data.customerData]);
                        setOrderHistoryList(hList);
                        const nextIdx = isRefreshCall && selectedBroadcastIdx < hList.length ? selectedBroadcastIdx : 0;
                        setSelectedBroadcastIdx(nextIdx);
                        setCurrentUser(hList[nextIdx]);
                        initAddressState(hList[nextIdx]);
                        if (isRefreshCall) {
                            showToast("✨ 최신 주문·입금 내역으로 새로고침되었습니다!");
                        }
                    } else if (data && data.errorType === "WRONG_PIN") {
                        setLoginError("비밀번호(뒷 4자리)가 일치하지 않습니다. 첫 구매이거나 열리지 않으면 아래 노란색 카톡 버튼으로 문의해 주세요.");
                    } else if (data && data.status === "not_found") {
                        setLoginError("주문 내역을 찾을 수 없습니다. (뒤쪽 -영문숫자 핸들을 뺀 한글 닉네임만 입력해 보세요!)");
                    } else {
                        setLoginError((data && data.message) || "조회에 실패했습니다. 잠시 후 다시 시도해 주세요.");
                    }
                } catch (err) {
                    setIsLoading(false);
                    setIsRefreshing(false);
                    if (isRefreshCall) {
                        showToast("접속자가 많아 지연되고 있습니다. 2초 후 다시 눌러주세요.");
                    } else {
                        setLoginError("현재 동시 접속자가 많아 연결이 지연되었습니다. [주문서 조회하기]를 한 번 더 눌러주세요!");
                    }
                }
            };

            const handleOpenPostcode = () => {
                if (!window.daum || !window.daum.Postcode) {
                    showToast("주소 검색 도구를 불러오는 중입니다. 1초 후 다시 눌러주세요.");
                    return;
                }
                new window.daum.Postcode({
                    oncomplete: function(data) {
                        let fullAddr = data.address;
                        let extraAddr = '';
                        if (data.addressType === 'R') {
                            if (data.bname !== '') extraAddr += data.bname;
                            if (data.buildingName !== '') extraAddr += (extraAddr !== '' ? ', ' + data.buildingName : data.buildingName);
                            fullAddr += (extraAddr !== '' ? ` (${extraAddr})` : '');
                        }
                        setAddrForm(prev => ({
                            ...prev,
                            zipcode: data.zonecode,
                            baseAddress: fullAddr
                        }));
                    }
                }).open();
            };

            const handleSaveAddress = async (e) => {
                if (e && e.preventDefault) e.preventDefault();
                const hasTrackingNow = Boolean(
                    (Array.isArray(currentUser?.trackingNumbers) && currentUser.trackingNumbers.length > 0) ||
                    (currentUser?.trackingNumber && String(currentUser.trackingNumber).trim() !== "")
                );
                if (hasTrackingNow) {
                    setIsEditingAddress(false);
                    showToast("이미 송장번호가 등록(출고)된 방송의 배송지는 변경할 수 없습니다.");
                    return false;
                }
                if (!addrForm.realname.trim()) { showToast("수령인 성함을 입력해 주세요."); return false; }
                const cleanPhone = addrForm.phone.replace(/[^0-9]/g, "");
                if (cleanPhone.length < 10) { showToast("정확한 휴대폰 번호를 입력해 주세요."); return false; }
                if (!addrForm.baseAddress.trim()) { showToast("주소 검색을 통해 기본 주소를 입력해 주세요."); return false; }
                if (!agreePrivacy || !agreeThirdParty) { showToast("필수 개인정보 수집 및 제공에 동의해 주세요."); return false; }

                const nowStr = getKstNowString();
                const updatedAddr = { ...addrForm, phone: cleanPhone, updatedAt: nowStr };
                const newLast4 = cleanPhone.slice(-4);

                const isSample = SAMPLE_DB.some(u => cleanHandle(u.nickname) === cleanHandle(currentUser.nickname));
                if (isSample) {
                    setCurrentUser(prev => ({ ...prev, phoneLast4: newLast4, address: updatedAddr }));
                    setOrderHistoryList(prev => prev.map((item, i) => i === selectedBroadcastIdx ? { ...item, phoneLast4: newLast4, address: updatedAddr } : item));
                    setIsEditingAddress(false);
                    showToast(`[${currentUser.broadcastName || '현재 방송'}] 배송지가 저장되었습니다!`);
                    return true;
                }

                setIsSavingAddress(true);
                try {
                    const cleanZip = String(updatedAddr.zipcode || "").replace(/[^0-9]/g, "");
                    const cleanBase = String(updatedAddr.baseAddress || "").replace(/^\(\d{5}\)\s*/, "").trim();
                    const zipPrefix = cleanZip ? `(${cleanZip}) ` : "";
                    const fullCombinedAddress = `${zipPrefix}${cleanBase} ${updatedAddr.detailAddress}`.trim();
                    const payload = {
                        action: 'save_master_address',
                        masterId: DEFAULT_MASTER_SHEET_ID,
                        data: {
                            nickname: currentUser.nickname,
                            realname: updatedAddr.realname.trim(),
                            phone: "'" + cleanPhone,
                            address: fullCombinedAddress,
                            memo: updatedAddr.memo.trim(),
                            sheetTabName: currentUser.sheetTabName || '메인주문',
                            broadcastName: currentUser.broadcastName || '',
                            isCustomerPortal: true
                        }
                    };
                    // Firebase에도 고객이 입력한 최신 주소를 즉시 백업 기록
                    if (portalFbDb) {
                        const safeNickKey = String(currentUser.nickname || '').replace(/[.#$\[\]\/]/g, '_');
                        portalFbDb.ref(`ember_live_data/_portal_addresses/${safeNickKey}`).set({
                            nickname: currentUser.nickname,
                            realname: updatedAddr.realname.trim(),
                            phone: cleanPhone,
                            zipcode: cleanZip,
                            baseAddress: cleanBase,
                            detailAddress: updatedAddr.detailAddress,
                            address: fullCombinedAddress,
                            memo: updatedAddr.memo.trim(),
                            updatedAt: nowStr
                        }).catch(() => {});
                    }

                    const result = await fetchGasWithRetry(DEFAULT_GAS_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    }, 3);
                    if (result && (result.success || result.status === 'success')) {
                        setCurrentUser(prev => ({ ...prev, phoneLast4: newLast4, address: updatedAddr }));
                        setOrderHistoryList(prev => prev.map((item, i) => i === selectedBroadcastIdx ? { ...item, phoneLast4: newLast4, address: updatedAddr } : item));
                        setPinInput(newLast4);
                        setIsEditingAddress(false);
                        showToast(`[${currentUser.broadcastName || '현재 방송'}] 배송지가 안전하게 저장되었습니다!`);
                        return true;
                    } else if (result && result.errorType === 'TRACKING_LOCKED') {
                        setIsEditingAddress(false);
                        showToast(result.message || "이미 출고(송장등록)된 주문서는 배송지를 변경할 수 없습니다.");
                        return false;
                    } else {
                        showToast("저장에 실패했습니다. 다시 시도해 주세요.");
                        return false;
                    }
                } catch (err) {
                    // 만약 구글 시트 쓰기 락(Lock)이 걸렸더라도 Firebase에 백업되었음을 반영해 고객 불편 방지
                    if (portalFbDb) {
                        setCurrentUser(prev => ({ ...prev, phoneLast4: newLast4, address: updatedAddr }));
                        setOrderHistoryList(prev => prev.map((item, i) => i === selectedBroadcastIdx ? { ...item, phoneLast4: newLast4, address: updatedAddr } : item));
                        setPinInput(newLast4);
                        setIsEditingAddress(false);
                        showToast(`[${currentUser.broadcastName || '현재 방송'}] 배송지가 저장되었습니다!`);
                        return true;
                    }
                    showToast("접속자가 많아 지연되었습니다. 다시 한번 저장을 눌러주세요.");
                    return false;
                } finally {
                    setIsSavingAddress(false);
                }
            };

            const handleConfirmOrder = async () => {
                if (!currentUser.address || !currentUser.address.baseAddress || isEditingAddress) {
                    if (addrForm.realname.trim() || addrForm.phone.trim() || addrForm.baseAddress.trim()) {
                        const savedOk = await handleSaveAddress();
                        if (!savedOk) return;
                    } else {
                        showToast("먼저 배송지를 입력해 주세요!");
                        setIsEditingAddress(true);
                        return;
                    }
                }
                const nowStr = getKstNowString();
                const isSample = SAMPLE_DB.some(u => cleanHandle(u.nickname) === cleanHandle(currentUser.nickname));
                if (isSample) {
                    setCurrentUser(prev => ({
                        ...prev,
                        isConfirmed: true,
                        address: prev.address ? { ...prev.address, updatedAt: nowStr } : prev.address
                    }));
                    setOrderHistoryList(prev => prev.map((item, i) => i === selectedBroadcastIdx ? { ...item, isConfirmed: true, address: item.address ? { ...item.address, updatedAt: nowStr } : item.address } : item));
                    showToast("주문 및 배송지 확인이 완료되었습니다!");
                    return;
                }

                try {
                    if (portalFbDb) {
                        const safeNickKey = String(currentUser.nickname || '').replace(/[.#$\[\]\/]/g, '_');
                        portalFbDb.ref(`ember_live_data/_portal_confirmed/${safeNickKey}`).set({
                            nickname: currentUser.nickname,
                            broadcastName: currentUser.broadcastName || '',
                            confirmedAt: nowStr
                        }).catch(() => {});
                    }
                    await fetchGasWithRetry(DEFAULT_GAS_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({
                            action: 'confirm_customer_order',
                            masterId: DEFAULT_MASTER_SHEET_ID,
                            data: {
                                nickname: currentUser.nickname,
                                sheetTabName: currentUser.sheetTabName || '메인주문',
                                broadcastName: currentUser.broadcastName || ''
                            }
                        })
                    }, 3);
                    setCurrentUser(prev => ({
                        ...prev,
                        isConfirmed: true,
                        address: prev.address ? { ...prev.address, updatedAt: nowStr } : prev.address
                    }));
                    setOrderHistoryList(prev => prev.map((item, i) => i === selectedBroadcastIdx ? { ...item, isConfirmed: true, address: item.address ? { ...item.address, updatedAt: nowStr } : item.address } : item));
                    showToast("주문 및 배송지 확인이 완료되었습니다!");
                } catch (e) {
                    setCurrentUser(prev => ({
                        ...prev,
                        isConfirmed: true,
                        address: prev.address ? { ...prev.address, updatedAt: nowStr } : prev.address
                    }));
                    showToast("주문 및 배송지 확인이 완료되었습니다!");
                }
            };

            // 주문 금액 계산
            const activeItems = currentUser ? (currentUser.items || []).filter(i => !i.isWaitlist) : [];
            const waitlistItems = currentUser ? (currentUser.items || []).filter(i => i.isWaitlist) : [];
            const totalQty = activeItems.reduce((s, i) => s + Number(i.qty || 1), 0);
            const productTotal = activeItems.reduce((s, i) => s + Number(i.price || 0), 0);
            const isVipFree = Boolean(currentUser && (currentUser.isVip || currentUser.isManager));
            const shippingFee = currentUser ? (isVipFree ? 0 : (activeItems.length > 0 ? Number(currentUser.shipping || 0) : 0)) : 0;
            const baseGrandTotal = productTotal + shippingFee;
            const depositTotal = currentUser ? Number(currentUser.depositTotal || 0) : 0;
            const rawBalance = baseGrandTotal - depositTotal;
            const isCard = Boolean(currentUser && (currentUser.isCard === true || String(currentUser.isCard || '').toUpperCase().startsWith('O') || String(currentUser.isCard || '').includes('카드') || String(currentUser.isCard || '').includes('완료')));
            const isCardPaid = Boolean(isCard && String(currentUser?.isCard || '').includes('완료'));
            const parsedFeeFromCardStr = (() => {
                const m = String(currentUser?.isCard || '').match(/(\d+(?:\.\d+)?)%/);
                return m ? Number(m[1]) : 0;
            })();
            const cardFeeRate = parsedFeeFromCardStr > 0 ? parsedFeeFromCardStr : ((currentUser && Number(currentUser.cardFeeRate) > 0) ? Number(currentUser.cardFeeRate) : 10);
            const cardFee = (isCard && rawBalance > 0) ? Math.round(rawBalance * (cardFeeRate / 100)) : 0;
            const finalGrandTotal = baseGrandTotal + cardFee;
            const finalBalance = rawBalance + cardFee;

            const isPaid = activeItems.length > 0 && finalBalance === 0 && !isCard;
            const isOverpaid = finalBalance < 0 && !isCard;
            const isUnpaid = finalBalance > 0 && !isCard;
            const customerCredit = currentUser ? (Number(currentUser.credit) || 0) : 0;

            const depositsHistory = currentUser && Array.isArray(currentUser.deposits) && currentUser.deposits.length > 0
                ? currentUser.deposits
                : (depositTotal > 0 ? [{ id: 'dep_sum', time: '', name: (currentUser?.address?.realname || currentUser?.nickname || '입금확인'), amount: depositTotal }] : []);

            const userTrackingList = (() => {
                if (!currentUser) return [];
                if (Array.isArray(currentUser.trackingNumbers) && currentUser.trackingNumbers.length > 0) {
                    return currentUser.trackingNumbers;
                }
                if (currentUser.trackingNumber) {
                    return String(currentUser.trackingNumber).split(/[,\/\n]+/).map(s => s.trim()).filter(Boolean);
                }
                return [];
            })();
            const isAddressLockedByTracking = userTrackingList.length > 0;
            // ✨ 주문서가 열리거나 방송 날짜 탭을 바꿀 때 송장번호가 있으면 클릭할 필요도 없이 그 자리에서 자동으로 배송흐름을 불러옵니다!
            useEffect(() => {
                if (userTrackingList.length > 0) {
                    userTrackingList.forEach(trk => {
                        const cleanDigits = String(trk).replace(/[^0-9]/g, '');
                        if (cleanDigits) fetchInlineTracking(cleanDigits);
                    });
                }
            }, [currentUser, selectedBroadcastIdx]);

            return (
                <div className="w-full flex flex-col items-center">
                    {toastMsg && (
                        <div className="fixed top-3 left-1/2 -translate-x-1/2 z-50 bg-gray-900/95 text-white px-4 py-2 rounded-full shadow-lg text-xs font-bold flex items-center gap-1.5">
                            <Icon name="check-circle" weight="fill" className="text-green-400" size={15} />
                            <span>{toastMsg}</span>
                        </div>
                    )}

                    {!currentUser ? (
                        <div className="w-full max-w-[420px] min-h-[100dvh] sm:min-h-[760px] bg-[#2c2a29] sm:rounded-2xl shadow-lg border-0 sm:border border-gray-300 relative flex flex-col justify-end overflow-y-auto">
                            <img 
                                src={FIXED_AUTUMN_WINTER_HERO} 
                                fetchpriority="high"
                                decoding="async"
                                onError={(e) => { e.target.onerror = null; e.target.src = FALLBACK_COAT_HERO; }}
                                alt="엠버언니 가을겨울 화보" 
                                className="absolute inset-0 w-full h-full object-cover object-top select-none pointer-events-none"
                            />

                            {/* 전체 화보 화면(inset-0) 기준 정중앙에 EMBER 로고 배치 */}
                            <div className="absolute inset-0 z-10 flex items-center justify-center pointer-events-none px-4">
                                <h1 className="text-[#f8f5f0] text-[48px] sm:text-[54px] font-serif tracking-[0.3em] pl-[0.3em] font-medium drop-shadow-2xl translate-y-2" style={{ textShadow: '0 4px 25px rgba(0,0,0,0.75)' }}>EMBER</h1>
                            </div>

                            {/* 하단 반투명 글래스모피즘 로그인 카드 */}
                            <div className="relative z-20 px-3 pb-6 pt-2 safe-bottom mt-auto">
                                <div className="bg-white/55 backdrop-blur-md rounded-2xl p-4 shadow-xl border border-white/70">
                                    <div className="flex items-center justify-between mb-3">
                                        <h2 className="text-[16px] font-black text-gray-900 tracking-tight drop-shadow-sm">
                                            통합주문확인
                                        </h2>
                                        <span className="text-[11px] font-extrabold text-blue-700 flex items-center gap-0.5 drop-shadow-sm">
                                            <Icon name="shield-check" weight="bold" size={14} /> 본인 인증 후 열람가능
                                        </span>
                                    </div>

                                    <form onSubmit={handleLogin} className="space-y-2.5">
                                        <div className="flex items-stretch gap-2">
                                            <div className="flex-1 space-y-2 min-w-0">
                                                <div className="flex items-center gap-2">
                                                    <label className="text-[13px] font-extrabold text-gray-900 w-[64px] shrink-0 flex justify-between items-center drop-shadow-sm">
                                                        <span>닉</span><span>네</span><span>임</span><span className="ml-0.5">:</span>
                                                    </label>
                                                    <input 
                                                        type="text"
                                                        value={nickInput}
                                                        onChange={(e) => setNickInput(e.target.value)}
                                                        placeholder="예) 깔로-SD2 ➔ 깔로"
                                                        className="flex-1 min-w-0 px-3 py-2.5 bg-white/85 border border-white/90 rounded-lg text-[14px] font-bold text-gray-900 placeholder:text-gray-500 placeholder:font-normal focus:bg-white focus:border-blue-600 outline-none shadow-sm"
                                                    />
                                                </div>

                                                <div className="flex items-center gap-2">
