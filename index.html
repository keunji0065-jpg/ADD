                                                    <label className="text-[13px] font-extrabold text-gray-900 w-[64px] shrink-0 flex justify-between items-center drop-shadow-sm">
                                                        <span>비</span><span>밀</span><span>번</span><span>호</span><span className="ml-0.5">:</span>
                                                    </label>
                                                    <input 
                                                        type="password"
                                                        inputMode="numeric"
                                                        maxLength={4}
                                                        value={pinInput}
                                                        onChange={(e) => setPinInput(e.target.value.replace(/[^0-9]/g, ""))}
                                                        placeholder="핸드폰번호 뒤 4자리"
                                                        className="flex-1 min-w-0 px-3 py-2.5 bg-white/85 border border-white/90 rounded-lg text-[14px] font-bold text-gray-900 placeholder:text-gray-500 placeholder:font-normal focus:bg-white focus:border-blue-600 outline-none shadow-sm"
                                                    />
                                                </div>
                                            </div>

                                            <button 
                                                type="submit"
                                                disabled={isLoading}
                                                className="w-[84px] shrink-0 bg-gray-950 hover:bg-black active:scale-[0.99] text-white font-extrabold rounded-lg text-[13px] leading-snug shadow-md transition-all flex flex-col items-center justify-center gap-0.5"
                                            >
                                                {isLoading ? (
                                                    <Icon name="spinner" className="animate-spin" size={18} />
                                                ) : (
                                                    <>
                                                        <span>주문서</span>
                                                        <span>조회하기</span>
                                                    </>
                                                )}
                                            </button>
                                        </div>

                                        {loginError && (
                                            <div className="p-2.5 bg-red-600/95 text-white rounded-lg text-[12px] font-bold leading-snug">
                                                {loginError}
                                            </div>
                                        )}
                                    </form>

                                    <div className="mt-3 pt-2.5 border-t border-gray-900/15 space-y-2">
                                        <p className="text-[12px] font-extrabold text-gray-900 text-center tracking-tight drop-shadow-sm">
                                            💡 문의 시 <span className="text-red-600 underline underline-offset-2">닉네임과 전화번호 뒷 4자리</span>를 카톡으로 남겨주세요!
                                        </p>
                                        <a 
                                            href={KAKAO_CHANNEL_URL}
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            className="w-full py-3 bg-[#FEE500] hover:bg-[#FADA0A] text-gray-900 font-extrabold rounded-lg text-[13px] flex items-center justify-center gap-1.5 shadow-sm transition-all"
                                        >
                                            <Icon name="chat-circle-dots" weight="fill" size={17} />
                                            <span>첫구매/주문서 오류시 문의하기</span>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className="w-full max-w-[430px] min-h-[100dvh] sm:min-h-0 bg-gray-100 sm:rounded-xl shadow border-0 sm:border border-gray-300 pb-8 overflow-hidden">
                            {/* 상단 헤더 (아래 카드들과 똑같이 둥근 독립 박스 형태로 통일) */}
                            <div className="sticky top-0 z-30 bg-gray-100/95 backdrop-blur-sm px-3 pt-3 pb-0.5">
                                <header className="bg-white text-gray-900 px-3.5 py-3 rounded-lg border border-gray-200 shadow-sm flex items-center justify-between">
                                    <div className="flex items-center gap-1.5 min-w-0 flex-wrap">
                                        <span className="font-extrabold text-[16px] text-gray-900 truncate">{currentUser.nickname} 님</span>
                                        {isPaid && <span className="bg-emerald-50 text-emerald-700 border border-emerald-200 text-[11.5px] font-extrabold px-2 py-0.5 rounded-md">완납</span>}
                                        {isUnpaid && <span className="bg-red-50 text-red-600 border border-red-200 text-[11.5px] font-extrabold px-2 py-0.5 rounded-md">미입금</span>}
                                        {isOverpaid && <span className="bg-blue-50 text-blue-700 border border-blue-200 text-[11.5px] font-extrabold px-2 py-0.5 rounded-md">과납</span>}
                                        {isCard && !isCardPaid && <span className="bg-amber-50 text-amber-700 border border-amber-200 text-[11.5px] font-extrabold px-2 py-0.5 rounded-md">카드요청</span>}
                                        {isCard && isCardPaid && <span className="bg-purple-50 text-purple-700 border border-purple-200 text-[11.5px] font-extrabold px-2 py-0.5 rounded-md">카드완료</span>}
                                        {customerCredit > 0 && (
                                            <span className="bg-teal-600 text-white text-[11.5px] font-extrabold px-2 py-0.5 rounded-md shadow-sm flex items-center gap-1">
                                                <span>💰 적립금 {customerCredit.toLocaleString()}원</span>
                                            </span>
                                        )}
                                    </div>
                                    <div className="flex items-center gap-1.5 shrink-0">
                                        <button 
                                            onClick={() => handleLogin(null, currentUser.nickname, currentUser.phoneLast4 || pinInput, true)}
                                            disabled={isRefreshing || isLoading}
                                            className={`text-[12px] font-bold px-2.5 py-1.5 rounded-lg border flex items-center gap-1 transition-all active:scale-95 ${
                                                isRefreshing 
                                                    ? 'bg-blue-50 text-blue-600 border-blue-200' 
                                                    : 'bg-gray-50 hover:bg-gray-100 text-gray-700 border-gray-200'
                                            }`}
                                        >
                                            <Icon name="arrows-clockwise" weight="bold" size={13} className={isRefreshing ? "animate-spin text-blue-600" : "text-gray-500"} />
                                            <span>{isRefreshing ? "갱신중..." : "새로고침"}</span>
                                        </button>
                                        <button 
                                            onClick={() => { setCurrentUser(null); setOrderHistoryList([]); setSelectedBroadcastIdx(0); setNickInput(""); setPinInput(""); }}
                                            className="text-[12px] font-bold bg-gray-50 hover:bg-gray-100 text-gray-600 px-2.5 py-1.5 rounded-lg border border-gray-200 transition-colors"
                                        >
                                            닫기
                                        </button>
                                    </div>
                                </header>
                            </div>

                            {isRefreshing && (
                                <div className="mx-3 mt-2 bg-blue-600 text-white text-[12px] font-extrabold py-2 px-3 rounded-lg flex items-center justify-center gap-2 shadow-sm animate-pulse">
                                    <Icon name="spinner" className="animate-spin" size={15} />
                                    <span>최신 주문 및 입금·배송 상태를 불러오고 있습니다...</span>
                                </div>
                            )}

                            <main className={`p-3 pt-2.5 space-y-2.5 transition-opacity duration-200 ${isRefreshing ? 'opacity-60 pointer-events-none' : 'opacity-100'}`}>
                                {/* ✨ 날짜별 방송 주문서 선택 탭 (최근 2~3주 방송 이력 열람 가능) */}
                                {orderHistoryList.length > 1 && (
                                    <section className="bg-white rounded-lg p-2.5 border border-blue-200 shadow-sm">
                                        <div className="flex items-center justify-between mb-1.5 px-0.5">
                                            <span className="text-[12px] font-extrabold text-gray-700 flex items-center gap-1">
                                                <Icon name="calendar-check" weight="fill" className="text-blue-600" size={14} />
                                                <span>방송 날짜별 주문서 선택 ({orderHistoryList.length}건)</span>
                                            </span>
                                            <span className="text-[11px] font-semibold text-gray-400">터치하여 이전 주문 보기</span>
                                        </div>
                                        <div className="flex gap-1.5 overflow-x-auto pb-1">
                                            {orderHistoryList.map((hist, idx) => {
                                                const isSelected = idx === selectedBroadcastIdx;
                                                const cleanTitle = String(hist.broadcastName || `주문서 ${idx + 1}`).replace(/\s*주문\s*목록\s*/g, '').trim();
                                                return (
                                                    <button
                                                        key={hist.sheetTabName || idx}
                                                        type="button"
                                                        onClick={() => handleSelectBroadcast(idx)}
                                                        className={`px-3 py-2 rounded-lg text-[13px] font-extrabold whitespace-nowrap transition-all flex items-center gap-1.5 shrink-0 border ${
                                                            isSelected
                                                                ? 'bg-blue-600 text-white border-blue-700 shadow-sm'
                                                                : 'bg-gray-50 text-gray-700 border-gray-200 hover:bg-gray-100'
                                                        }`}
                                                    >
                                                        <span>{cleanTitle}</span>
                                                        {idx === 0 && (
                                                            <span className={`text-[10px] px-1.5 py-0.2 rounded font-black ${isSelected ? 'bg-white text-blue-700' : 'bg-blue-100 text-blue-700'}`}>
                                                                최신
                                                            </span>
                                                        )}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </section>
                                )}

                                {/* 1. 주문 품목 및 금액 영수증 */}
                                <section className="bg-white rounded-lg p-3.5 border border-gray-200 shadow-sm">
                                    <div className="flex items-center justify-between pb-2.5 mb-2 border-b border-gray-200">
                                        <span className="text-[14px] font-extrabold text-gray-900">
                                            {currentUser.broadcastName || '주문 목록'}
                                        </span>
                                        <span className="text-[13px] font-bold text-gray-600">
                                            {activeItems.length}품목 / 총수량 {totalQty}개
                                        </span>
                                    </div>

                                    {activeItems.length === 0 ? (
                                        <div className="text-center py-5 text-[14px] text-gray-400">확정된 주문 상품이 없습니다.</div>
                                    ) : (
                                        <div className="divide-y divide-gray-100">
                                            {activeItems.map((item, idx) => (
                                                <div key={item.id || idx} className="py-2 flex items-center justify-between gap-2 text-[14px]">
                                                    <div className="font-bold text-gray-900 flex-1 min-w-0 break-words leading-snug">
                                                        {item.product}
                                                    </div>
                                                    <div className="flex items-center gap-2.5 shrink-0">
                                                        <span className={`font-extrabold ${item.qty > 1 ? 'text-red-600 text-[15px]' : 'text-gray-600'}`}>
                                                            {item.qty}개
                                                        </span>
                                                        <span className="font-extrabold text-gray-900 w-[78px] text-right tabular-nums text-[15px]">
                                                            {Number(item.price).toLocaleString()}원
                                                        </span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    {waitlistItems.length > 0 && (
                                        <div className="mt-2.5 pt-2.5 border-t border-dashed border-orange-200 bg-orange-50/60 -mx-3.5 px-3.5 py-2">
                                            <div className="text-[12px] font-extrabold text-orange-700 mb-1">
                                                ⏱️ 품절/거파 대기 상품 (총 주문금액 제외)
                                            </div>
                                            {waitlistItems.map((item, idx) => (
                                                <div key={item.id || idx} className="flex justify-between items-center text-[13px] text-orange-800 font-semibold py-0.5">
                                                    <span className="truncate pr-2">{item.product}</span>
                                                    <span className="shrink-0 bg-orange-500 text-white text-[11px] font-extrabold px-2 py-0.5 rounded">
                                                        {item.qty > 1 ? `${item.qty}개 · ` : ''}{item.waitlistOrder ? `대기 ${item.waitlistOrder}번` : '대기중'}
                                                    </span>
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    {/* 금액 요약 (위에는 총 주문금액만 깔끔하게 표시) */}
                                    <div className="mt-3 pt-3 border-t border-dashed border-gray-300 space-y-1.5 text-[14px]">
                                        <div className="flex justify-between text-gray-600">
                                            <span className="font-semibold">상품 합계</span>
                                            <span className="font-bold text-gray-900 tabular-nums">{productTotal.toLocaleString()}원</span>
                                        </div>
                                        <div className="flex justify-between text-gray-600">
                                            <span className="font-semibold">
                                                배송비
                                                {isVipFree ? " (무료배송)" : (shippingFee === 0 && activeItems.length > 0 ? " (무료배송)" : "")}
                                            </span>
                                            <span className="font-bold text-gray-900 tabular-nums">
                                                {shippingFee === 0 ? "0원" : `${shippingFee.toLocaleString()}원`}
                                            </span>
                                        </div>
                                        <div className="flex justify-between items-center pt-2 border-t border-gray-200">
                                            <span className="font-extrabold text-gray-900 text-[15px]">총 주문금액</span>
                                            <span className="font-black text-[18px] text-blue-600 tabular-nums">
                                                {baseGrandTotal.toLocaleString()}원
                                            </span>
                                        </div>
                                    </div>
                                </section>

                                {/* 2. 입금 내역 및 계좌 안내 */}
                                <section className="bg-white rounded-lg p-3.5 border border-gray-200 shadow-sm space-y-2.5">
                                    <button
                                        type="button"
                                        onClick={() => setIsDepositHistoryOpen(prev => !prev)}
                                        className={`w-full flex items-center justify-between text-left transition-colors ${isDepositHistoryOpen ? 'pb-2 border-b border-gray-200' : ''}`}
                                    >
                                        <span className="text-[14px] font-extrabold text-gray-900">입금 내역</span>
                                        <span className="text-[13px] font-bold text-gray-600 flex items-center gap-1 hover:text-gray-900">
                                            <span>누적 {depositTotal.toLocaleString()}원</span>
                                            <Icon name={isDepositHistoryOpen ? "caret-up" : "caret-down"} weight="bold" size={14} className="text-gray-500" />
                                        </span>
                                    </button>

                                    {isDepositHistoryOpen && (
                                        depositsHistory.length === 0 ? (
                                            <div className="py-2 text-[13px] text-gray-400 text-center">
                                                확인된 입금 내역이 없습니다.
                                            </div>
                                        ) : (
                                            <div className="divide-y divide-gray-100">
                                                {depositsHistory.map((d, index) => (
                                                    <div key={d.id || index} className="py-2.5 flex items-center justify-between gap-2 text-[14px]">
                                                        <div className="flex items-center gap-2 min-w-0 flex-wrap">
                                                            <span className="font-extrabold text-gray-900 truncate">{d.name || currentUser.nickname}</span>
                                                            {d.time ? (
                                                                <span className="text-[12px] text-blue-700 bg-blue-50 border border-blue-200 px-2 py-0.5 rounded font-extrabold tabular-nums shrink-0 flex items-center gap-1">
                                                                    <Icon name="clock" weight="bold" size={12} />
                                                                    <span>{formatKstDateString(d.time)}</span>
                                                                </span>
                                                            ) : (
                                                                <span className="text-[11.5px] text-gray-500 bg-gray-100 px-1.5 py-0.5 rounded font-bold shrink-0">
                                                                    입금확인 완료
                                                                </span>
                                                            )}
                                                        </div>
                                                        <span className="font-extrabold text-gray-900 tabular-nums shrink-0 text-[15px]">
                                                            {Number(d.amount).toLocaleString()}원
                                                        </span>
                                                    </div>
                                                ))}
                                            </div>
                                        )
                                    )}

                                    {isUnpaid && (
                                        <div className="bg-red-50 border border-red-200 rounded-lg p-3 space-y-2.5">
                                            <div className="flex justify-between items-center">
                                                <span className="text-[14px] font-extrabold text-red-700">남은 입금하실 금액</span>
                                                <span className="text-[17px] font-black text-red-600 tabular-nums">
                                                    {finalBalance.toLocaleString()}원
                                                </span>
                                            </div>
                                            <div className="bg-white rounded p-2.5 border border-red-200 flex items-center justify-between gap-2">
                                                <div className="leading-snug">
                                                    <div className="text-gray-600 font-bold text-[12.5px]">{BANK_NAME_HOLDER}</div>
                                                    <div className="font-black text-gray-900 text-[15px] tracking-tight mt-0.5">{BANK_ACCOUNT_NUMBER}</div>
                                                </div>
                                                <button 
                                                    type="button"
                                                    onClick={() => copyText(BANK_ACCOUNT_NUMBER, "계좌번호가")}
                                                    className="bg-gray-900 hover:bg-black text-white px-3 py-2 rounded text-[13px] font-bold shrink-0 flex items-center gap-1"
                                                >
                                                    <Icon name="copy" weight="bold" size={14} /> 계좌복사
                                                </button>
                                            </div>
                                        </div>
                                    )}

                                    {isPaid && (
                                        <div className="bg-emerald-600 border border-emerald-700 rounded-lg py-3 px-3 text-center text-[14px] font-extrabold text-white shadow-sm flex items-center justify-center gap-1.5">
                                            <Icon name="check-circle" weight="fill" size={18} />
                                            <span>입금완료(완납)</span>
                                        </div>
                                    )}

                                    {isOverpaid && (
                                        <div className="bg-blue-50 border border-blue-300 rounded-lg p-3 flex justify-between items-center text-[14px] font-extrabold text-blue-800">
                                            <span>과납 금액 (환불/적립 카톡문의)</span>
                                            <span className="text-[16px] font-black text-blue-600">+{Math.abs(finalBalance).toLocaleString()}원</span>
                                        </div>
                                    )}

                                    {customerCredit > 0 && (
                                        <div className="bg-teal-50 border border-teal-200 rounded-lg p-3 flex justify-between items-center text-[14px] font-extrabold text-teal-800">
                                            <span>현재 적립금</span>
                                            <span className="text-[16px] font-black text-teal-700 tabular-nums">{customerCredit.toLocaleString()}원</span>
                                        </div>
                                    )}

                                    {}
                                    {isCard && (
                                        <div className={`${isCardPaid ? 'bg-purple-50 border-purple-300' : 'bg-amber-50 border-amber-300'} border rounded-lg p-3.5 space-y-2 text-[14px]`}>
                                            <div className="flex items-center justify-between pb-2 border-b border-black/10">
                                                <span className={`font-extrabold text-[14px] flex items-center gap-1.5 ${isCardPaid ? 'text-purple-900' : 'text-amber-900'}`}>
                                                    <Icon name="credit-card" weight="fill" size={17} className={isCardPaid ? 'text-purple-600' : 'text-amber-600'} />
                                                    <span>{isCardPaid ? '카드결제 완료' : '카드결제 요청 (결제 대기중)'}</span>
                                                </span>
                                                <span className={`text-[11.5px] font-extrabold px-2 py-0.5 rounded ${isCardPaid ? 'bg-purple-600 text-white' : 'bg-amber-500 text-white'}`}>
                                                    {isCardPaid ? '결제확인됨' : '요청접수됨'}
                                                </span>
                                            </div>
                                            <div className="flex justify-between items-center text-gray-700 font-semibold pt-0.5">
                                                <span>총 주문금액</span>
                                                <span className="font-bold text-gray-900 tabular-nums">{baseGrandTotal.toLocaleString()}원</span>
                                            </div>
                                            {depositTotal > 0 && (
                                                <div className="flex justify-between items-center text-gray-700 font-semibold">
                                                    <span>선입금 완료 금액</span>
                                                    <span className="font-bold text-emerald-700 tabular-nums">-{depositTotal.toLocaleString()}원</span>
                                                </div>
                                            )}
                                            <div className="flex justify-between items-center text-gray-800 font-bold pt-1 border-t border-black/10">
                                                <span>카드결제 대상 금액</span>
                                                <span className="font-extrabold text-gray-900 tabular-nums">{Math.max(0, rawBalance).toLocaleString()}원</span>
                                            </div>
                                            <div className={`flex justify-between items-center font-bold ${isCardPaid ? 'text-purple-700' : 'text-amber-800'}`}>
                                                <span>카드 수수료 (+{cardFeeRate}%)</span>
                                                <span className="tabular-nums">+{cardFee.toLocaleString()}원</span>
                                            </div>
                                            <div className={`flex justify-between items-center pt-2 border-t font-extrabold ${isCardPaid ? 'border-purple-300 text-purple-900' : 'border-amber-300 text-amber-900'}`}>
                                                <span className="text-[15px]">{isCardPaid ? '최종 카드결제 완료금액' : '최종 카드결제 요청금액'}</span>
                                                <span className={`text-[18px] font-black tabular-nums ${isCardPaid ? 'text-purple-700' : 'text-amber-700'}`}>{Math.max(0, finalBalance).toLocaleString()}원</span>
                                            </div>
                                            {isCardPaid ? (
                                                <div className="bg-purple-600 text-white rounded-lg py-2.5 px-3 text-center text-[14px] font-extrabold flex items-center justify-center gap-1.5 mt-1 shadow-sm">
                                                    <Icon name="check-circle" weight="fill" size={18} />
                                                    <span>카드결제가 정상적으로 완료되었습니다</span>
                                                </div>
                                            ) : (
                                                <div className="bg-amber-500 text-white rounded-lg py-2.5 px-3 text-center text-[13px] font-extrabold flex flex-col items-center justify-center gap-0.5 mt-1 shadow-sm">
                                                    <div className="flex items-center gap-1.5 text-[14px]">
                                                        <Icon name="clock-countdown" weight="fill" size={17} />
                                                        <span>카드결제 요청 접수 (결제 확인 대기중)</span>
                                                    </div>
                                                    <span className="text-[11.5px] font-semibold text-amber-50">
                                                        결제 완료 후 직원이 확인하면 [카드결제 완료]로 변경됩니다
                                                    </span>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </section>

                                {/* 3. 배송지 확인 및 입력 */}
                                <section className="bg-white rounded-lg p-3.5 border border-gray-200 shadow-sm">
                                    <div className="flex items-center justify-between pb-2.5 mb-2.5 border-b border-gray-200">
                                        <div className="flex flex-col min-w-0">
                                            <div className="flex items-center gap-1.5">
                                                <span className="text-[14px] font-extrabold text-gray-900 shrink-0">
                                                    [{String(currentUser.broadcastName || '주문서').replace(/\s*주문\s*목록\s*/g, '').trim()}] 배송지
                                                </span>
                                            </div>
                                            {currentUser.address && currentUser.address.baseAddress && currentUser.address.updatedAt && !isEditingAddress && (
                                                <span className="text-[11.5px] font-semibold text-gray-500 truncate mt-0.5">
                                                    최근 입력·확인: {formatKstDateString(currentUser.address.updatedAt)}
                                                </span>
                                            )}
                                        </div>
                                        {isAddressLockedByTracking ? (
                                            <span className="text-[11.5px] font-extrabold text-gray-600 bg-gray-100 px-2.5 py-1 rounded border border-gray-300 shrink-0 flex items-center gap-1">
                                                <Icon name="lock-key" weight="fill" size={13} className="text-gray-500" />
                                                <span>출고완료(변경불가)</span>
                                            </span>
                                        ) : (
                                            currentUser.address && !isEditingAddress && (
                                                <button 
                                                    onClick={() => {
                                                        setAddrForm({
                                                            realname: "",
                                                            phone: "",
                                                            zipcode: "",
                                                            baseAddress: "",
                                                            detailAddress: "",
                                                            memo: ""
                                                        });
                                                        setAgreePrivacy(false);
                                                        setAgreeThirdParty(false);
                                                        setIsEditingAddress(true);
                                                    }}
                                                    className="text-[12.5px] font-bold text-gray-800 bg-gray-100 hover:bg-gray-200 px-2.5 py-1 rounded border border-gray-300 shrink-0"
                                                >
                                                    변경
                                                </button>
                                            )
                                        )}
                                    </div>

                                    {(!isEditingAddress || isAddressLockedByTracking) && currentUser.address ? (
                                        <div className="text-[14px] space-y-1.5 bg-gray-50 p-3 rounded border border-gray-200">
                                            <div className="flex items-center gap-2 font-extrabold text-gray-900 text-[15px]">
                                                <span>{maskName(currentUser.address.realname)}</span>
                                                <span className="text-gray-300">·</span>
                                                <span>{maskPhone(currentUser.address.phone)}</span>
                                            </div>
                                            <div className="text-gray-800 leading-snug font-medium">
                                                {maskAddress(currentUser.address.baseAddress, currentUser.address.detailAddress, currentUser.address.zipcode)}
                                            </div>
                                            {currentUser.address.memo && (
                                                <div className="text-[13px] text-gray-600 pt-0.5">
                                                    메모: {currentUser.address.memo}
                                                </div>
                                            )}
                                            {isAddressLockedByTracking && (
                                                <div className="text-[11.5px] font-bold text-gray-500 pt-1.5 border-t border-gray-200/80 flex items-center gap-1">
                                                    <Icon name="info" weight="fill" size={13} className="text-gray-400 shrink-0" />
                                                    <span>운송장이 등록(출고)된 방송의 배송지는 수정할 수 없습니다.</span>
                                                </div>
                                            )}
                                        </div>
                                    ) : isAddressLockedByTracking ? (
                                        <div className="text-[13px] text-gray-500 bg-gray-50 p-3 rounded border border-gray-200 font-semibold">
                                            운송장이 등록(출고)되어 배송지 정보를 변경할 수 없습니다.
                                        </div>
                                    ) : (
                                        <form onSubmit={handleSaveAddress} className="space-y-2.5">
                                            {(!currentUser.address || !currentUser.address.baseAddress) && (
                                                <div className="bg-red-50 border border-red-200 text-red-600 rounded-lg px-3 py-2 text-[13px] font-extrabold flex items-center gap-1.5">
                                                    <Icon name="warning-circle" weight="fill" size={16} className="shrink-0" />
                                                    <span>등록된 배송지가 없습니다. 배송지를 입력해주세요.</span>
                                                </div>
                                            )}
                                            <div className="grid grid-cols-2 gap-2">
                                                <div>
                                                    <label className="block text-[12px] font-bold text-gray-700 mb-1">수령인 성함 *</label>
                                                    <input 
                                                        type="text"
                                                        value={addrForm.realname}
                                                        onChange={(e) => setAddrForm({...addrForm, realname: e.target.value})}
                                                        placeholder="홍길동"
                                                        className="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded text-[14px] font-bold outline-none focus:border-blue-600 focus:bg-white"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-[12px] font-bold text-gray-700 mb-1">연락처 (숫자만) *</label>
                                                    <input 
                                                        type="tel"
                                                        inputMode="numeric"
                                                        value={addrForm.phone}
                                                        onChange={(e) => setAddrForm({...addrForm, phone: e.target.value.replace(/[^0-9]/g, "")})}
                                                        placeholder="01012345678"
                                                        className="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded text-[14px] font-bold outline-none focus:border-blue-600 focus:bg-white"
                                                    />
                                                </div>
                                            </div>

                                            <div>
                                                <label className="block text-[12px] font-bold text-gray-700 mb-1">주소 *</label>
                                                <div className="flex gap-1.5 mb-2">
                                                    <input 
                                                        type="text"
                                                        readOnly
                                                        value={addrForm.zipcode}
                                                        placeholder="우편번호"
                                                        className="w-24 px-3 py-2 bg-gray-100 border border-gray-300 rounded text-[14px] text-gray-600"
                                                    />
                                                    <button 
                                                        type="button"
                                                        onClick={handleOpenPostcode}
                                                        className="bg-gray-800 hover:bg-black text-white px-3.5 py-2 rounded text-[13px] font-bold"
                                                    >
                                                        주소 검색
                                                    </button>
                                                </div>
                                                <input 
                                                    type="text"
                                                    readOnly
                                                    value={addrForm.baseAddress}
                                                    onClick={handleOpenPostcode}
                                                    placeholder="주소 검색을 눌러주세요"
                                                    className="w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded text-[14px] text-gray-800 mb-2 cursor-pointer"
                                                />
                                                <input 
                                                    type="text"
                                                    value={addrForm.detailAddress}
                                                    onChange={(e) => setAddrForm({...addrForm, detailAddress: e.target.value})}
                                                    placeholder="상세주소 (동, 호수 등)"
                                                    className="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded text-[14px] font-bold outline-none focus:border-blue-600 focus:bg-white"
                                                />
                                            </div>

                                            <div>
                                                <label className="block text-[12px] font-bold text-gray-700 mb-1">배송 메모</label>
                                                <input 
                                                    type="text"
                                                    value={addrForm.memo}
                                                    onChange={(e) => setAddrForm({...addrForm, memo: e.target.value})}
                                                    placeholder="예: 문 앞에 놓아주세요"
                                                    className="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded text-[14px] outline-none focus:border-blue-600 focus:bg-white"
                                                />
                                            </div>

                                            <div className="bg-gray-50 p-3 rounded border border-gray-200 space-y-2">
                                                <div className="text-[12.5px] font-extrabold text-gray-900">
                                                    개인정보 수집 및 제3자 제공 동의
                                                </div>
                                                <div className="text-[12px] text-gray-600 bg-white p-2.5 rounded border border-gray-200 leading-relaxed space-y-1">
                                                    <div><span className="font-bold text-gray-800">수집·이용 목적 :</span> 상품 주문 확인, 배송, 고객 상담 및 민원 처리</div>
                                                    <div><span className="font-bold text-gray-800">수집 항목 :</span> 성명, 연락처, 배송지 주소, 유튜브 닉네임</div>
                                                    <div><span className="font-bold text-gray-800">제3자 제공 :</span> 위탁 배송을 위해 해당 상품 공급사에 배송 정보(성명, 연락처, 주소) 제공</div>
                                                    <div><span className="font-bold text-gray-800">보유 및 이용 :</span> <strong>주소 입력일로부터 30일</strong></div>
                                                    <div className="text-[11px] text-gray-500 pt-0.5">동의를 거부할 권리가 있으나, 거부 시 상품 주문 및 배송 불가합니다.</div>
                                                </div>
                                                <label className="flex items-center gap-2 cursor-pointer pt-1">
                                                    <input type="checkbox" checked={agreePrivacy && agreeThirdParty} onChange={(e) => { setAgreePrivacy(e.target.checked); setAgreeThirdParty(e.target.checked); }} className="w-4 h-4 accent-gray-900 rounded" />
                                                    <span className="text-[13px] font-extrabold text-gray-900">[필수] 개인정보 수집 및 제3자 제공에 동의합니다.</span>
                                                </label>
                                            </div>

                                            <div className="flex gap-2 pt-1">
                                                {currentUser.address && (
                                                    <button type="button" onClick={() => setIsEditingAddress(false)} className="flex-1 py-3 bg-gray-200 text-gray-700 font-bold rounded text-[14px]">
                                                        취소
                                                    </button>
                                                )}
                                                <button type="submit" disabled={isSavingAddress} className="flex-1 py-3 bg-gray-900 hover:bg-black text-white font-extrabold rounded text-[14px] shadow-sm transition-all">
                                                    {isSavingAddress ? "저장 중..." : "배송지 저장"}
                                                </button>
                                            </div>
                                        </form>
                                    )}

                                    <div className="mt-3 pt-3 border-t border-dashed border-gray-200">
                                        <div className="flex items-center justify-between mb-2">
                                            <span className="text-[13.5px] font-extrabold text-gray-900 flex items-center gap-1.5">
                                                <span className="inline-block w-2.5 h-2.5 rounded-full bg-[#E60012]"></span>
                                                <span>롯데택배 송장번호 · 실시간 이동흐름</span>
                                            </span>
                                            {userTrackingList.length > 0 && (
                                                <span className="text-[11px] font-extrabold text-[#E60012] bg-red-50 px-2 py-0.5 rounded border border-red-200">
                                                    출고 {userTrackingList.length}건
                                                </span>
                                            )}
                                        </div>

                                        {userTrackingList.length === 0 ? (
                                            <div className="bg-gray-50 border border-gray-200 rounded-lg px-3 py-2.5 text-[12.5px] text-gray-500 font-semibold flex items-center justify-between">
                                                <span>📦 상품 준비 중 (출고 후 송장번호와 이동흐름이 바로 표시됩니다)</span>
                                            </div>
                                        ) : (
                                            <div className="space-y-3">
                                                {userTrackingList.map((trk, tIdx) => {
                                                    const cleanDigits = String(trk).replace(/[^0-9]/g, '');
                                                    const trkInfo = trackingMap[cleanDigits] || { loading: true, steps: [] };
                                                    const isCollapsed = Boolean(collapsedTracks[cleanDigits]);
                                                    return (
                                                        <div key={tIdx} className="bg-white border-2 border-red-200 rounded-xl overflow-hidden shadow-sm">
                                                            {/* 상단 송장번호 헤더 바 */}
                                                            <div className="bg-red-50/80 px-3 py-2.5 border-b border-red-100 flex items-center justify-between gap-2">
                                                                <div className="min-w-0">
                                                                    <div className="flex items-center gap-1.5">
                                                                        <span className="bg-[#E60012] text-white text-[10px] font-black px-1.5 py-0.5 rounded">롯데택배</span>
                                                                        <span className="text-[14.5px] font-black text-gray-900 tabular-nums tracking-tight">
                                                                            {formatTrackingDisplay(trk)}
                                                                        </span>
                                                                    </div>
                                                                    <div className="text-[12px] font-extrabold text-[#E60012] mt-1 flex items-center gap-1">
                                                                        <Icon name="truck" weight="fill" size={13} />
                                                                        <span>현재상태: {trkInfo.stateText || "배송 조회중..."}</span>
                                                                    </div>
                                                                </div>
                                                                <div className="flex items-center gap-1 shrink-0">
                                                                    <button
                                                                        type="button"
                                                                        onClick={() => copyText(cleanDigits, "송장번호가")}
                                                                        className="bg-white hover:bg-gray-100 text-gray-800 border border-gray-300 px-2.5 py-1.5 rounded-lg text-[11.5px] font-extrabold shadow-sm"
                                                                    >
                                                                        번호복사
                                                                    </button>
                                                                    <button
                                                                        type="button"
                                                                        onClick={() => fetchInlineTracking(cleanDigits, true)}
                                                                        className="bg-white hover:bg-gray-100 text-gray-700 border border-gray-300 p-1.5 rounded-lg text-[12px] font-bold shadow-sm"
                                                                        title="배송상태 새로고침"
                                                                    >
                                                                        <Icon name="arrows-clockwise" weight="bold" size={14} className={trkInfo.loading ? "animate-spin text-[#E60012]" : ""} />
                                                                    </button>
                                                                    {trkInfo.steps && trkInfo.steps.length > 0 && (
                                                                        <button
                                                                            type="button"
                                                                            onClick={() => setCollapsedTracks(prev => ({ ...prev, [cleanDigits]: !prev[cleanDigits] }))}
                                                                            className="bg-white hover:bg-gray-100 text-gray-700 border border-gray-300 px-2 py-1.5 rounded-lg text-[11.5px] font-extrabold shadow-sm"
                                                                        >
                                                                            {isCollapsed ? "펼치기" : "접기"}
                                                                        </button>
                                                                    )}
                                                                </div>
                                                            </div>

                                                            {/* 바로 아래에 펼쳐지는 실시간 이동흐름 타임라인 */}
                                                            {!isCollapsed && (
                                                                <div className="p-3 bg-white">
                                                                    {trkInfo.loading ? (
                                                                        <div className="py-4 flex items-center justify-center gap-2 text-[12.5px] font-bold text-gray-500">
                                                                            <Icon name="spinner" className="animate-spin text-[#E60012]" size={18} />
                                                                            <span>실시간 택배 이동흐름을 불러오고 있습니다...</span>
                                                                        </div>
                                                                    ) : trkInfo.steps && trkInfo.steps.length > 0 ? (
                                                                        <div className="relative pl-3.5 border-l-2 border-red-200 space-y-3 my-1 ml-1">
                                                                            {trkInfo.steps.map((st, sIdx) => (
                                                                                <div key={sIdx} className="relative">
                                                                                    <span className={`absolute -left-[19px] top-1 w-2.5 h-2.5 rounded-full border-2 border-white ${sIdx === 0 ? 'bg-[#E60012] ring-2 ring-red-200' : 'bg-gray-300'}`}></span>
                                                                                    <div className={`text-[13px] font-extrabold leading-snug ${sIdx === 0 ? 'text-gray-900' : 'text-gray-600'}`}>
                                                                                        {st.status}
                                                                                    </div>
                                                                                    <div className="text-[11.5px] font-semibold text-gray-500 flex items-center gap-1.5 mt-0.5">
                                                                                        <span className="text-gray-700 font-bold">📍 {st.location}</span>
                                                                                        <span>·</span>
                                                                                        <span className="tabular-nums">{st.time}</span>
                                                                                    </div>
                                                                                </div>
                                                                            ))}
                                                                        </div>
                                                                    ) : (
                                                                        <div className="py-2.5 px-2 bg-gray-50 rounded-lg text-[12px] text-gray-600 font-semibold text-center leading-relaxed">
                                                                            송장이 등록되어 택배사 집하(상품인수) 대기 중입니다.<br/>
                                                                            집하 스캔 후 이 자리에서 바로 이동흐름이 표시됩니다.
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            )}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )}
                                    </div>
                                </section>

                                {/* 4. 하단 최종 확인 버튼 & 카톡 채널 문의 */}
                                <section className="pt-0.5 space-y-2 safe-bottom">
                                    {currentUser.isConfirmed ? (
                                        <div className="w-full py-3 bg-green-600 text-white font-extrabold rounded-lg text-center text-[14px] flex items-center justify-center gap-1.5 shadow-sm">
                                            <Icon name="check-circle" weight="fill" size={17} />
                                            <span>주문 및 배송지 확정 완료</span>
                                        </div>
                                    ) : (
                                        <button 
                                            onClick={handleConfirmOrder}
                                            className="w-full py-3.5 bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-extrabold rounded-lg text-[14px] shadow-sm flex items-center justify-center gap-1.5 transition-all"
                                        >
                                            <Icon name="check-circle" weight="bold" size={17} />
                                            <span>주문내역·배송지 확정 (터치해야 발송됩니다)</span>
                                        </button>
                                    )}

                                    <a 
                                        href={KAKAO_CHANNEL_URL}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="w-full py-3 bg-[#FEE500] hover:bg-[#FADA0A] text-gray-900 font-extrabold rounded-lg text-[14px] flex items-center justify-center gap-1.5 shadow-sm"
                                    >
                                        <Icon name="chat-circle-dots" weight="fill" size={17} />
                                        <span>품목수정 / 오류 등 카카오채널 연락하기</span>
                                    </a>

                                    {/* 5. 하단 EMBER SISTER OFFICIAL / SYSTEM BY. 깔로AI & 한번 더 당길 때만 가장 바닥에 열리는 사업자정보 */}
                                    <footer className="pt-6 pb-1 text-center select-none">
                                        <div 
                                            onClick={() => setShowBizFooter(prev => !prev)}
                                            className="cursor-pointer inline-flex flex-col items-center py-1 px-4 rounded-xl transition-opacity hover:opacity-85"
                                        >
                                            <div className="text-[11.5px] font-black tracking-[0.24em] text-gray-800 pl-[0.24em]">
                                                EMBER SISTER OFFICIAL
                                            </div>
                                            <div className="mt-1 flex items-center gap-2">
                                                <span className="w-3 h-[1px] bg-gray-300/80"></span>
                                                <span className="text-[10px] font-extrabold tracking-[0.14em] kalo-signature">
                                                    SYSTEM BY. 깔로AI
                                                </span>
                                                <span className="w-3 h-[1px] bg-gray-300/80"></span>
                                            </div>
                                        </div>

                                        {showBizFooter && (
                                            <div className="mt-3 pt-2 border-t border-gray-200/50 text-[9.5px] text-gray-300 leading-tight space-y-0.5 font-normal tracking-tight">
                                                <div>
                                                    상호: {BUSINESS_INFO.companyName} <span className="mx-1 text-gray-200">|</span> 대표자: {BUSINESS_INFO.ceoName} <span className="mx-1 text-gray-200">|</span> 사업자번호: {BUSINESS_INFO.bizNumber}
                                                </div>
                                                <div>
                                                    통신판매업신고: {BUSINESS_INFO.mailOrderNumber} <span className="mx-1 text-gray-200">|</span> 개인정보보호책임자: {BUSINESS_INFO.privacyOfficer}
                                                </div>
                                                <div>
                                                    소재지: {BUSINESS_INFO.address} <span className="mx-1 text-gray-200">|</span> 고객센터: {BUSINESS_INFO.csCenter}
                                                </div>
                                            </div>
                                        )}
                                    </footer>
                                </section>
                            </main>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PortalApp />);
    </script>
</body>
</html>
