        const Icon = ({ name, className = "", weight = "regular", size = 16 }) => (
            <i className={`ph ph-${name} ${className}`} data-phosphor-icon-weight={weight} style={{ fontSize: size }}></i>
        );

        const cleanHandle = (str) => {
            if (!str) return '';
            let s = String(str).trim().replace(/^@+/, '');
            s = s.replace(/-[a-zA-Z0-9]{2,6}$/, '');
            return s.replace(/\s+/g, '').toLowerCase();
        };

        const isFlexibleNickMatch = (targetNick, inputNick) => {
            const t = cleanHandle(targetNick).replace(/[^a-z0-9가-힣]/g, '');
            const i = cleanHandle(inputNick).replace(/[^a-z0-9가-힣]/g, '');
            if (!t || !i) return false;
            if (t === i) return true;
            const tKo = t.replace(/[^가-힣]/g, '');
            const iKo = i.replace(/[^가-힣]/g, '');
            if (tKo.length >= 2 && iKo.length >= 2 && tKo === iKo) return true;
            if (t.length >= 2 && i.length >= 2 && (t.startsWith(i) || i.startsWith(t) || t.includes(i) || i.includes(t))) return true;
            return false;
        };

        const maskName = (name) => {
            if (!name) return "";
            const s = String(name).trim();
            if (s.length <= 1) return s;
            if (s.length === 2) return s[0] + "*";
            return s[0] + "*".repeat(s.length - 2) + s[s.length - 1];
        };

        const maskPhone = (phone) => {
            if (!phone) return "";
            const clean = String(phone).replace(/[^0-9]/g, "");
            if (clean.length < 8) return clean;
            const head = clean.slice(0, 3);
            const tail = clean.slice(-4);
            return `${head}-****-${tail}`;
        };

        // 우편번호 및 기본/상세주소 정제 도우미 (중복 우편번호 및 빈 괄호 완벽 제거)
        const sanitizeAddressObject = (addr) => {
            if (!addr) return null;
            let rawZip = String(addr.zipcode || "").replace(/[^0-9]/g, "");
            let base = String(addr.baseAddress || "").trim();
            let detail = String(addr.detailAddress || "").trim();

            // 주소 앞부분의 빈 괄호 "()" 제거
            base = base.replace(/^\(\s*\)\s*/, "").trim();

            // 기본주소 맨 앞에 "(62409)" 처럼 우편번호가 이미 포함되어 있으면 추출 후 본문에서 제거
            const leadingZipMatch = base.match(/^\((\d{5})\)\s*(.*)$/);
            if (leadingZipMatch) {
                if (!rawZip) rawZip = leadingZipMatch[1];
                base = leadingZipMatch[2].trim();
            }

            // 혹시 한번 더 빈 괄호나 중복 우편번호가 남아있다면 제거
            base = base.replace(/^\(\s*\)\s*/, "").replace(/^\(\d{5}\)\s*/, "").trim();

            return {
                ...addr,
                zipcode: rawZip,
                baseAddress: base,
                detailAddress: detail
            };
        };

        // 자연스러운 상세주소 마스킹 ("101-1204" -> "101동 ****호", "101동 1204호" -> "101동 ****호")
        const maskDetailAddress = (detail) => {
            if (!detail) return "";
            const s = String(detail).trim();
            // "101-1204" 형태인 경우
            const dashMatch = s.match(/^(\d+)\s*-\s*(\d+)$/);
            if (dashMatch) {
                return `${dashMatch[1]}동 ${"*".repeat(dashMatch[2].length)}호`;
            }
            // "101동 1204호" 형태인 경우 동은 보여주고 호수만 마스킹
            if (s.includes("동") && s.includes("호")) {
                return s.replace(/(\d+)\s*호/g, (m, p1) => `${"*".repeat(p1.length)}호`);
            }
            // 그 외 일반 상세주소는 뒤쪽 숫자만 자연스럽게 마스킹
            return s.replace(/\d+/g, (num) => "*".repeat(num.length));
        };

        const getKstNowString = () => {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd} ${hh}:${min}`;
        };

        const formatDepositTime = (val) => {
            if (!val) return '';
            const strVal = String(val).trim();
            const korMatch = strVal.match(/(오전|오후|AM|PM)?\s*(\d{1,2}):(\d{2})(?::(\d{2}))?/i);
            if (korMatch && (strVal.includes('오전') || strVal.includes('오후') || /\b(AM|PM)\b/i.test(strVal) || !strVal.includes('T'))) {
                const ampm = (korMatch[1] || '').toUpperCase();
                let hour = parseInt(korMatch[2], 10);
                const min = korMatch[3];
                if ((ampm === '오후' || ampm === 'PM') && hour < 12) hour += 12;
                else if ((ampm === '오전' || ampm === 'AM') && hour === 12) hour = 0;
                return `${String(hour).padStart(2, '0')}:${min}`;
            }
            const dt = new Date(strVal);
            if (!isNaN(dt.getTime()) && strVal.length > 8) {
                return dt.toLocaleTimeString('ko-KR', { hour12: false, hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Seoul' });
            }
            return strVal;
        };

        const CustomerPortal = () => {
            const [nickInput, setNickInput] = useState("");
            const [pinInput, setPinInput] = useState("");
            const [loginError, setLoginError] = useState("");
            const [isLoading, setIsLoading] = useState(false);

            const [currentUser, setCurrentUser] = useState(null);
            const [isEditingAddress, setIsEditingAddress] = useState(false);
            const [isSavingAddress, setIsSavingAddress] = useState(false);

            const [addrForm, setAddrForm] = useState({
                realname: "",
                phone: "",
                zipcode: "",
                baseAddress: "",
                detailAddress: "",
                memo: ""
            });

            const [agreePrivacy, setAgreePrivacy] = useState(false);
            const [agreeThirdParty, setAgreeThirdParty] = useState(false);
            const [showPolicyDetail, setShowPolicyDetail] = useState(false);
            const [toastMsg, setToastMsg] = useState(null);

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(null), 2500);
            };

            const fetchOrderFromServer = async (nick, pin, silent = false) => {
                const trimmedNick = nick.trim();
                const trimmedPin = pin.trim().replace(/[^0-9]/g, "");

                if (!trimmedNick) {
                    setLoginError("닉네임을 입력해 주세요.");
                    return;
                }
                if (trimmedPin.length !== 4) {
                    setLoginError("비밀번호(핸드폰 뒤 4자리)를 입력해 주세요.");
                    return;
                }

                // 1. 샘플 테스트 계정(테스트1, 테스트2, 테스트3) 우선 확인
                const sampleFound = SAMPLE_DB.find(u => cleanHandle(u.nickname) === cleanHandle(trimmedNick)) ||
                                    SAMPLE_DB.find(u => isFlexibleNickMatch(u.nickname, trimmedNick) && u.phoneLast4 === trimmedPin);
                if (sampleFound) {
                    if (sampleFound.phoneLast4 !== trimmedPin) {
                        setLoginError("비밀번호 4자리가 일치하지 않습니다. (테스트용: 1234)");
                        return;
                    }
                    const cloned = JSON.parse(JSON.stringify(sampleFound));
                    if (cloned.address) cloned.address = sanitizeAddressObject(cloned.address);
                    setCurrentUser(cloned);
                    if (!cloned.address) {
                        setIsEditingAddress(true);
                        setAddrForm({ realname: "", phone: "", zipcode: "", baseAddress: "", detailAddress: "", memo: "" });
                    } else {
                        setIsEditingAddress(false);
                        setAddrForm({ ...cloned.address });
                    }
                    setLoginError("");
                    if (silent) showToast("최신 주문 상태로 새로고침되었습니다.");
                    return;
                }

                // 2. 실제 구글 마스터 시트(Code.gs) 실시간 조회
                if (!silent) setIsLoading(true);
                setLoginError("");

                try {
                    const url = `${DEFAULT_GAS_URL}?action=get_customer_order&masterId=${encodeURIComponent(DEFAULT_MASTER_SHEET_ID)}&nickname=${encodeURIComponent(trimmedNick)}&pin=${encodeURIComponent(trimmedPin)}&t=${Date.now()}`;
                    const res = await fetch(url, { method: 'GET', redirect: 'follow' });
                    const data = await res.json();

                    if (data.status === 'success' && data.customerData) {
                        const userObj = data.customerData;
                        if (userObj.address) {
                            userObj.address = sanitizeAddressObject(userObj.address);
                        }
                        setCurrentUser(userObj);
                        if (!userObj.address || !userObj.address.baseAddress) {
                            setIsEditingAddress(true);
                            setAddrForm({ realname: "", phone: "", zipcode: "", baseAddress: "", detailAddress: "", memo: "" });
                        } else {
                            setIsEditingAddress(false);
                            setAddrForm({ ...userObj.address });
                        }
                        if (silent) showToast("최신 주문 및 입금 내역이 반영되었습니다.");
                    } else if (data.status === 'error' && data.errorType === 'WRONG_PIN') {
                        setLoginError("비밀번호(핸드폰 뒤 4자리)가 일치하지 않습니다. 첫 구매이신 경우 노란색 버튼으로 문의해 주세요.");
                    } else if (data.status === 'not_found') {
                        setLoginError("현재 등록된 주문 내역이 없습니다. 사장님 주문서에서 [수동 저장]이 완료되었는지 확인해 주세요.");
                    } else {
                        setLoginError(data.message || "조회에 실패했습니다. 잠시 후 다시 시도해 주세요.");
                    }
                } catch (err) {
                    setLoginError("서버 통신 오류가 발생했습니다. 인터넷 연결을 확인해 주세요.");
                } finally {
                    setIsLoading(false);
                }
            };

            const handleLogin = (e) => {
                if (e) e.preventDefault();
                fetchOrderFromServer(nickInput, pinInput, false);
            };

            const summary = useMemo(() => {
                if (!currentUser) return null;
                const activeItems = (currentUser.items || []).filter(i => !i.isWaitlist);
                const waitlistItems = (currentUser.items || []).filter(i => i.isWaitlist);
                const totalQty = activeItems.reduce((s, i) => s + Number(i.qty || 1), 0);
                const productTotal = activeItems.reduce((s, i) => s + Number(i.price || 0), 0);
                const productTotalForShipping = activeItems.reduce((s, i) => s + (Number(i.price) > 0 ? Number(i.price) : 0), 0);

                const freeThreshold = Number(currentUser.freeShippingThreshold) || SHOP_CONFIG.freeShippingThreshold;
                const isJeju = (addrForm.baseAddress || currentUser.address?.baseAddress || "").includes("제주");

                let shipping = 0;
                if (currentUser.isVip || currentUser.isManager) {
                    shipping = 0;
                } else if (activeItems.length === 0) {
                    shipping = 0;
                } else {
                    shipping = (freeThreshold > 0 && productTotalForShipping >= freeThreshold) ? 0 : Number(currentUser.shipping ?? SHOP_CONFIG.defaultShipping);
                    if (isJeju && shipping > 0) shipping += SHOP_CONFIG.jejuExtraShipping;
                }

                const baseGrandTotal = productTotal + shipping;
                const depositTotal = Number(currentUser.depositTotal || 0);
                const baseBalance = baseGrandTotal - depositTotal;
                const cardFee = (currentUser.isCard && baseBalance > 0) ? Math.round(baseBalance * 0.1) : 0;
                const finalGrandTotal = baseGrandTotal + cardFee;
                const finalBalance = baseBalance + cardFee;

                let paymentStatus = "UNPAID";
                if (currentUser.isCard) paymentStatus = "CARD";
                else if (finalBalance === 0 && activeItems.length > 0) paymentStatus = "PAID";
                else if (finalBalance < 0) paymentStatus = "OVERPAID";
                else if (depositTotal > 0 && finalBalance > 0) paymentStatus = "PARTIAL";

                let depositsList = Array.isArray(currentUser.deposits) && currentUser.deposits.length > 0
                    ? currentUser.deposits
                    : (depositTotal > 0 ? [{ id: 'sum_1', time: '확인됨', name: currentUser.address?.realname || currentUser.nickname, amount: depositTotal }] : []);

                return {
                    activeItems,
                    waitlistItems,
                    totalQty,
                    productTotal,
                    shipping,
                    baseGrandTotal,
                    depositTotal,
                    cardFee,
                    finalGrandTotal,
                    finalBalance,
                    paymentStatus,
                    depositsList
                };
            }, [currentUser, addrForm.baseAddress]);

            const handleSearchPostcode = () => {
                try {
                    new window.daum.Postcode({
                        oncomplete: function(data) {
                            let fullAddr = data.address;
                            let extraAddr = '';
                            if (data.addressType === 'R') {
                                if (data.bname !== '') extraAddr += data.bname;
                                if (data.buildingName !== '') extraAddr += (extraAddr !== '' ? ', ' + data.buildingName : data.buildingName);
                                if (extraAddr !== '') fullAddr += ' (' + extraAddr + ')';
                            }
                            setAddrForm(prev => ({
                                ...prev,
                                zipcode: data.zonecode,
                                baseAddress: fullAddr
                            }));
                        }
                    }).open();
                } catch (err) {
                    showToast("주소 검색창을 열지 못했습니다.");
                }
            };

            const handleSaveAddress = async (e) => {
                e.preventDefault();
                if (!addrForm.realname.trim()) return showToast("수령인 성함을 입력해 주세요.");
                const cleanPhone = addrForm.phone.replace(/[^0-9]/g, "");
                if (cleanPhone.length < 10) return showToast("정확한 휴대폰 번호를 입력해 주세요.");
                if (!addrForm.baseAddress.trim()) return showToast("주소 검색을 통해 기본 주소를 입력해 주세요.");
                if (!agreePrivacy || !agreeThirdParty) return showToast("필수 개인정보 수집 및 제공에 동의해 주세요.");

                const nowStr = getKstNowString();
                const updatedAddr = { ...addrForm, phone: cleanPhone, updatedAt: nowStr };
                const newLast4 = cleanPhone.slice(-4);

                const isSample = SAMPLE_DB.some(u => cleanHandle(u.nickname) === cleanHandle(currentUser.nickname));
                if (isSample) {
                    setCurrentUser(prev => ({ ...prev, phoneLast4: newLast4, address: updatedAddr }));
                    setIsEditingAddress(false);
                    showToast("배송지가 저장되었습니다!");
                    return;
                }

                setIsSavingAddress(true);
                try {
                    const cleanZip = String(updatedAddr.zipcode || "").replace(/[^0-9]/g, "");
                    const cleanBase = String(updatedAddr.baseAddress || "").replace(/^\(\d{5}\)\s*/, "").trim();
                    const zipPrefix = cleanZip ? `(${cleanZip}) ` : "";
                    const fullCombinedAddress = `${zipPrefix}${cleanBase} ${updatedAddr.detailAddress}`.trim();
                    const payload = {
                        action: 'save_master_address',
                        masterId: DEFAULT_MASTER_SHEET_ID,
                        data: {
                            nickname: currentUser.nickname,
                            realname: updatedAddr.realname.trim(),
                            phone: "'" + cleanPhone,
                            zipcode: "",
                            address: fullCombinedAddress,
                            memo: updatedAddr.memo.trim()
                        }
                    };
                    const res = await fetch(DEFAULT_GAS_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                    const result = await res.json();
                    if (result.success || result.status === 'success') {
                        setCurrentUser(prev => ({ ...prev, phoneLast4: newLast4, address: updatedAddr }));
                        setPinInput(newLast4);
                        setIsEditingAddress(false);
                        showToast("배송지가 안전하게 저장되었습니다!");
                    } else {
                        showToast("저장에 실패했습니다. 다시 시도해 주세요.");
                    }
                } catch (err) {
                    showToast("통신 오류가 발생했습니다.");
                } finally {
                    setIsSavingAddress(false);
                }
            };

            const handleConfirmOrder = async () => {
                if (!currentUser.address || !currentUser.address.baseAddress) {
                    showToast("먼저 배송지를 입력하고 저장해 주세요!");
                    setIsEditingAddress(true);
                    return;
                }
                const nowStr = getKstNowString();
                const isSample = SAMPLE_DB.some(u => cleanHandle(u.nickname) === cleanHandle(currentUser.nickname));
                if (isSample) {
                    setCurrentUser(prev => ({
                        ...prev,
                        isConfirmed: true,
                        address: prev.address ? { ...prev.address, updatedAt: nowStr } : prev.address
                    }));
                    showToast("주문 및 배송지 확인이 완료되었습니다!");
                    return;
                }

                try {
                    await fetch(DEFAULT_GAS_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({
                            action: 'confirm_customer_order',
                            masterId: DEFAULT_MASTER_SHEET_ID,
                            data: { nickname: currentUser.nickname }
                        })
                    });
                    setCurrentUser(prev => ({
                        ...prev,
                        isConfirmed: true,
                        address: prev.address ? { ...prev.address, updatedAt: nowStr } : prev.address
                    }));
                    showToast("주문 및 배송지 확인이 완료되었습니다!");
                } catch (e) {
                    showToast("확인 처리 중 오류가 발생했습니다.");
                }
            };

            const copyBankAccount = () => {
                const text = `${SHOP_CONFIG.bankName} ${SHOP_CONFIG.accountNumber} (${SHOP_CONFIG.accountHolder})`;
                const t = document.createElement("textarea");
                t.value = text;
                document.body.appendChild(t);
                t.select();
                document.execCommand("copy");
                document.body.removeChild(t);
                showToast("계좌번호가 복사되었습니다.");
            };

            return (
                <div className={`min-h-[100dvh] flex flex-col items-center ${!currentUser ? 'justify-start sm:justify-center p-0 sm:py-6' : 'justify-start py-2 px-2'}`}>
                    {/* 토스트 알림 */}
                    {toastMsg && (
                        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-gray-900/95 text-white px-4 py-2 rounded-md shadow-lg text-xs font-bold flex items-center gap-1.5 whitespace-nowrap">
                            <Icon name="check-circle" weight="fill" className="text-green-400" size={15} />
                            <span>{toastMsg}</span>
                        </div>
                    )}

                    {}
                    {!currentUser ? (
                        <div className="w-full max-w-[420px] h-[100dvh] sm:h-[760px] bg-[#e5e4e2] sm:rounded-2xl shadow-lg border-0 sm:border border-gray-300 overflow-hidden relative flex flex-col justify-end">
                            {/* 화보 배경 이미지 (가을/겨울 시즌 코트 화보 1장 고정) */}
                            <img 
                                src={FIXED_AUTUMN_WINTER_HERO} 
                                onError={(e) => { e.target.onerror = null; e.target.src = FALLBACK_COAT_HERO; }}
                                alt="엠버언니 가을겨울 화보" 
                                className="absolute inset-0 w-full h-full object-cover object-top select-none pointer-events-none"
                            />

                            {/* 하단 반투명 글래스모피즘 로그인 카드 */}
                            <div className="relative z-10 px-2.5 pb-3 pt-2 safe-bottom">
                                <div className="bg-white/45 backdrop-blur-md rounded-xl p-3 shadow-lg border border-white/60">
                                    <div className="flex items-center justify-between mb-2">
                                        <h2 className="text-[13px] font-black text-gray-900 tracking-tight drop-shadow-sm">
                                            엠버언니 주문&입금확인
                                        </h2>
                                        <span className="text-[10px] font-bold text-blue-700 flex items-center gap-0.5 drop-shadow-sm">
                                            <Icon name="shield-check" weight="bold" size={12} /> 본인 인증 후 열람가능
                                        </span>
                                    </div>

                                    <form onSubmit={handleLogin} className="space-y-1.5">
                                        <div className="flex items-stretch gap-1.5">
                                            <div className="flex-1 space-y-1.5 min-w-0">
                                                {/* 닉네임 줄 */}
                                                <div className="flex items-center gap-1.5">
                                                    <label className="text-[11px] font-extrabold text-gray-900 w-[56px] shrink-0 flex justify-between items-center drop-shadow-sm">
                                                        <span>닉</span><span>네</span><span>임</span><span className="ml-0.5">:</span>
                                                    </label>
                                                    <input 
                                                        type="text"
                                                        value={nickInput}
                                                        onChange={(e) => setNickInput(e.target.value)}
                                                        placeholder="예) @깔로-k3j ➔ 깔로"
                                                        className="flex-1 min-w-0 px-2.5 py-1.5 bg-white/75 border border-white/80 rounded text-[12px] font-bold text-gray-900 placeholder:text-gray-500 placeholder:font-normal focus:bg-white focus:border-blue-600 outline-none shadow-sm"
                                                    />
                                                </div>

                                                {/* 비밀번호 줄 */}
                                                <div className="flex items-center gap-1.5">
                                                    <label className="text-[11px] font-extrabold text-gray-900 w-[56px] shrink-0 flex justify-between items-center drop-shadow-sm">
                                                        <span>비</span><span>밀</span><span>번</span><span>호</span><span className="ml-0.5">:</span>
                                                    </label>
                                                    <input 
                                                        type="password"
                                                        inputMode="numeric"
                                                        maxLength={4}
                                                        value={pinInput}
                                                        onChange={(e) => setPinInput(e.target.value.replace(/[^0-9]/g, ""))}
                                                        placeholder="핸드폰번호 뒤 4자리"
                                                        className="flex-1 min-w-0 px-2.5 py-1.5 bg-white/75 border border-white/80 rounded text-[12px] font-bold text-gray-900 placeholder:text-gray-500 placeholder:font-normal focus:bg-white focus:border-blue-600 outline-none shadow-sm"
                                                    />
                                                </div>
                                            </div>

                                            {/* 우측 2줄 통합 검정색 조회 버튼 */}
                                            <button 
                                                type="submit"
                                                disabled={isLoading}
                                                className="w-[74px] shrink-0 bg-gray-950 hover:bg-black active:scale-[0.99] text-white font-extrabold rounded text-[11px] leading-tight shadow transition-all flex flex-col items-center justify-center gap-0.5"
                                            >
                                                {isLoading ? (
                                                    <Icon name="spinner" className="animate-spin" size={16} />
                                                ) : (
                                                    <>
                                                        <span>주문서</span>
                                                        <span>조회하기</span>
                                                    </>
                                                )}
                                            </button>
                                        </div>

                                        {loginError && (
                                            <div className="p-2 bg-red-600/90 text-white rounded text-[11px] font-bold leading-snug">
                                                {loginError}
                                            </div>
                                        )}
                                    </form>

                                    {/* 첫구매 / 미열람 고객 카카오톡 문의 버튼 */}
                                    <div className="mt-2 pt-2 border-t border-gray-900/10">
                                        <a 
                                            href={KAKAO_CHANNEL_URL}
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            className="w-full py-2 bg-[#FEE500] hover:bg-[#FADA0A] text-gray-900 font-extrabold rounded text-[11px] flex items-center justify-center gap-1.5 shadow-sm transition-all"
                                        >
                                            <Icon name="chat-circle-dots" weight="fill" size={15} />
                                            <span>첫구매 / 주문서가 열리지 않는분 문의하기</span>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className="w-full max-w-[420px] bg-gray-100 rounded-xl shadow border border-gray-300 overflow-hidden">
                            {/* 상단 검정색 EMBER 브랜드 헤더 */}
                            <header className="bg-[#111111] text-white py-2.5 px-4 text-center">
                                <h1 className="text-[14px] font-black tracking-[0.35em] uppercase">E M B E R</h1>
                            </header>

                            <main className="p-2 space-y-2">
                                {/* 구획 1: 주문자 정보 & 새로고침 */}
                                <section className="bg-white rounded-lg p-2.5 border border-gray-200 shadow-sm flex items-center justify-between">
                                    <div className="flex items-center gap-1.5 min-w-0">
                                        <button 
                                            onClick={() => { setCurrentUser(null); setLoginError(""); }}
                                            className="text-gray-500 hover:text-gray-900 p-1 rounded border border-gray-200 bg-gray-50 shrink-0"
                                            title="처음으로"
                                        >
                                            <Icon name="arrow-left" weight="bold" size={13} />
                                        </button>
                                        <span className="text-[14px] font-extrabold text-gray-900 truncate">
                                            {currentUser.nickname} 님
                                        </span>
                                        {currentUser.isVip && (
                                            <span className="bg-blue-50 text-blue-700 border border-blue-200 text-[10px] font-bold px-1.5 py-0.5 rounded shrink-0">
                                                VIP 무료배송
                                            </span>
                                        )}
                                        {currentUser.isManager && (
                                            <span className="bg-blue-50 text-blue-700 border border-blue-200 text-[10px] font-bold px-1.5 py-0.5 rounded shrink-0">
                                                관리자
                                            </span>
                                        )}
                                    </div>
                                    <button 
                                        onClick={() => fetchOrderFromServer(currentUser.nickname, currentUser.phoneLast4 || pinInput, true)}
                                        className="bg-blue-600 hover:bg-blue-700 active:scale-95 text-white text-[11px] font-bold px-2.5 py-1 rounded flex items-center gap-1 shrink-0 shadow-sm transition-all"
                                    >
                                        <Icon name="arrows-clockwise" weight="bold" size={12} />
                                        <span>새로고침</span>
                                    </button>
                                </section>

                                {/* 구획 2: 주문 품목 및 금액 합계 */}
                                <section className="bg-white rounded-lg p-3 border border-gray-200 shadow-sm">
                                    <div className="flex items-center justify-between pb-2 mb-2 border-b border-gray-200">
                                        <h3 className="text-[12px] font-extrabold text-gray-900">
                                            {currentUser.broadcastName || '실시간 라이브'} 주문목록
                                        </h3>
                                        <span className="text-[11px] font-bold text-gray-600">
                                            {summary.activeItems.length}품목 / 총수량 {summary.totalQty}개
                                        </span>
                                    </div>

                                    <div className="divide-y divide-gray-100">
                                        {summary.activeItems.map(item => (
                                            <div key={item.id} className="py-1.5 flex justify-between items-center text-[12px] gap-2">
                                                <span className="font-semibold text-gray-900 leading-snug break-all flex-1">
                                                    {item.product}
                                                </span>
                                                <div className="flex items-center gap-2 shrink-0">
                                                    <span className={`text-[11px] font-bold ${item.qty > 1 ? 'text-red-600' : 'text-gray-500'}`}>
                                                        {item.qty}개
                                                    </span>
                                                    <span className="font-bold text-gray-900 tabular-nums w-[68px] text-right">
                                                        {Number(item.price).toLocaleString()}원
                                                    </span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="mt-2 pt-2 border-t border-dashed border-gray-300 space-y-1 text-[12px]">
                                        <div className="flex justify-between text-gray-600">
                                            <span>상품 합계</span>
                                            <span className="font-semibold text-gray-900 tabular-nums">{summary.productTotal.toLocaleString()}원</span>
                                        </div>
                                        <div className="flex justify-between text-gray-600">
                                            <span>
                                                배송비 {(currentUser.isVip || currentUser.isManager) ? "(VIP 무료)" : summary.shipping === 0 ? "(무료배송)" : ""}
                                            </span>
                                            <span className="font-semibold text-gray-900 tabular-nums">{summary.shipping.toLocaleString()}원</span>
                                        </div>
                                        {currentUser.isCard && summary.cardFee > 0 && (
                                            <div className="flex justify-between text-gray-600">
                                                <span>카드 수수료 (10%)</span>
                                                <span className="font-semibold text-gray-900 tabular-nums">+{summary.cardFee.toLocaleString()}원</span>
                                            </div>
                                        )}
                                        <div className="flex justify-between items-center pt-1.5 border-t border-gray-100">
                                            <span className="font-extrabold text-gray-900 text-[13px]">총 주문금액</span>
                                            <span className="text-[15px] font-black text-blue-600 tabular-nums">
                                                {summary.finalGrandTotal.toLocaleString()}원
                                            </span>
                                        </div>
                                    </div>

                                    {summary.waitlistItems.length > 0 && (
                                        <div className="mt-2.5 pt-2 border-t border-gray-200 bg-amber-50/70 -mx-3 -mb-3 p-2.5 rounded-b-lg">
                                            <div className="text-[11px] font-extrabold text-amber-800 mb-1">
                                                품절 대기 ({summary.waitlistItems.length}건 · 결제제외)
                                            </div>
                                            {summary.waitlistItems.map(w => (
                                                <div key={w.id} className="text-[11px] text-gray-700 flex justify-between py-0.5">
                                                    <span className="truncate pr-2">{w.product}</span>
                                                    <span className="font-bold shrink-0">{w.qty}개</span>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </section>

                                {/* 구획 3: 입금 내역 및 결제 안내 */}
                                <section className="bg-white rounded-lg p-3 border border-gray-200 shadow-sm space-y-2.5">
                                    <div className="flex items-center justify-between pb-1.5 border-b border-gray-200">
                                        <h3 className="text-[12px] font-extrabold text-gray-900">입금 내역</h3>
                                        <span className="text-[11px] font-bold text-gray-700">
                                            누적 {summary.depositTotal.toLocaleString()}원
                                        </span>
                                    </div>

                                    {summary.depositsList.length > 0 ? (
                                        <div className="divide-y divide-gray-100 text-[12px]">
                                            {summary.depositsList.map((d, idx) => {
                                                // d.time 또는 d.id에서 입금 시간("2026. 10. 18 오후 3:27:27" 또는 ISO)을 추출하여 24시간제(15:27)로 표시
                                                let dispTime = formatDepositTime(d.time || '');
                                                if (!dispTime && d.id) {
                                                    dispTime = formatDepositTime(d.id);
                                                }
                                                return (
                                                    <div key={d.id || idx} className="py-1.5 flex justify-between items-center">
                                                        <div className="flex items-center gap-1.5 text-gray-700">
                                                            {dispTime && (
                                                                <span className="text-[11px] font-bold text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded border border-blue-100 tabular-nums">
                                                                    {dispTime}
                                                                </span>
                                                            )}
                                                            <span className="font-medium">
                                                                입금 {d.name ? `(${d.name})` : ''}
                                                            </span>
                                                        </div>
                                                        <span className="font-bold text-gray-900 tabular-nums">
                                                            {Number(d.amount).toLocaleString()}원
                                                        </span>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    ) : (
                                        <div className="text-[12px] text-gray-400 py-1">
                                            아직 확인된 입금 내역이 없습니다.
                                        </div>
                                    )}

                                    {summary.paymentStatus === "PAID" && (
                                        <div className="bg-blue-50 border border-blue-600 rounded p-2 text-center">
                                            <span className="text-[13px] font-extrabold text-blue-700">
                                                입금완료(완납)
                                            </span>
                                        </div>
                                    )}

                                    {(summary.paymentStatus === "UNPAID" || summary.paymentStatus === "PARTIAL") && (
                                        <div className="bg-red-50 border border-red-500 rounded p-2.5 space-y-2">
                                            <div className="flex justify-between items-center">
                                                <span className="text-[12px] font-extrabold text-red-700">
                                                    {summary.paymentStatus === "PARTIAL" ? "남은 미납금액" : "입금하실 금액"}
                                                </span>
                                                <span className="text-[15px] font-black text-red-600 tabular-nums">
                                                    {summary.finalBalance.toLocaleString()}원
                                                </span>
                                            </div>
                                            <div className="bg-white rounded p-2 border border-red-200 flex items-center justify-between gap-2">
                                                <div className="text-[11px] leading-snug">
                                                    <span className="text-gray-500 font-semibold block">{SHOP_CONFIG.bankName} (예금주: {SHOP_CONFIG.accountHolder})</span>
                                                    <span className="font-extrabold text-gray-900 text-[12px]">{SHOP_CONFIG.accountNumber}</span>
                                                </div>
                                                <button 
                                                    onClick={copyBankAccount}
                                                    className="bg-gray-900 hover:bg-black text-white px-2.5 py-1.5 rounded text-[11px] font-bold shrink-0"
                                                >
                                                    계좌복사
                                                </button>
                                            </div>
                                        </div>
                                    )}

                                    {summary.paymentStatus === "OVERPAID" && (
                                        <div className="bg-blue-50 border border-blue-500 rounded p-2.5 flex justify-between items-center">
                                            <span className="text-[12px] font-extrabold text-blue-800">과납 금액 (환불/적립 카톡문의)</span>
                                            <span className="text-[14px] font-black text-blue-700 tabular-nums">
                                                +{Math.abs(summary.finalBalance).toLocaleString()}원
                                            </span>
                                        </div>
                                    )}

                                    {summary.paymentStatus === "CARD" && (
                                        <div className="bg-gray-50 border border-gray-400 rounded p-2.5 flex justify-between items-center">
                                            <span className="text-[12px] font-extrabold text-gray-800">카드결제 요청 예정액 (수수료포함)</span>
                                            <span className="text-[14px] font-black text-gray-900 tabular-nums">
                                                {Math.max(0, summary.finalBalance).toLocaleString()}원
                                            </span>
                                        </div>
                                    )}
                                </section>

                                {/* 구획 4: 배송지 확인 및 변경 */}
                                <section className="bg-white rounded-lg p-3 border border-gray-200 shadow-sm">
                                    <div className="flex items-center justify-between pb-2 mb-2 border-b border-gray-200">
                                        <div className="flex items-center gap-1.5 flex-wrap">
                                            <h3 className="text-[12px] font-extrabold text-gray-900">배송지</h3>
                                            {currentUser.address && currentUser.address.updatedAt && (
                                                <span className="text-[10px] font-semibold text-gray-500">
                                                    (최근 입력·확인: {currentUser.address.updatedAt})
                                                </span>
                                            )}
                                        </div>
                                        {currentUser.address && !isEditingAddress && (
                                            <button 
                                                onClick={() => setIsEditingAddress(true)}
                                                className="text-[11px] font-bold text-gray-700 bg-gray-100 hover:bg-gray-200 px-2 py-0.5 rounded border border-gray-300"
                                            >
                                                변경
                                            </button>
                                        )}
                                    </div>

                                    {currentUser.address && !isEditingAddress ? (
                                        <div className="text-[12px] space-y-1 bg-gray-50 p-2.5 rounded border border-gray-200">
                                            <div className="flex items-center gap-2 font-bold text-gray-900">
                                                <span>{maskName(currentUser.address.realname)}</span>
                                                <span className="text-gray-400">·</span>
                                                <span>{maskPhone(currentUser.address.phone)}</span>
                                            </div>
                                            <div className="text-gray-800 leading-snug">
                                                {currentUser.address.zipcode && !currentUser.address.baseAddress.startsWith(`(${currentUser.address.zipcode})`) && (
                                                    <span className="text-gray-800 mr-1">({currentUser.address.zipcode})</span>
                                                )}
                                                <span>{currentUser.address.baseAddress}</span>
                                                {currentUser.address.detailAddress && (
                                                    <span className="ml-1 font-semibold">{maskDetailAddress(currentUser.address.detailAddress)}</span>
                                                )}
                                            </div>
                                            {currentUser.address.memo && (
                                                <div className="text-[11px] text-gray-500 pt-0.5">
                                                    메모: {currentUser.address.memo}
                                                </div>
                                            )}
                                        </div>
                                    ) : (
                                        <form onSubmit={handleSaveAddress} className="space-y-2 text-[12px]">
                                            {!currentUser.address && (
                                                <div className="p-2 bg-red-50 border border-red-200 rounded text-[11px] text-red-600 font-bold">
                                                    등록된 주소가 없습니다. 배송지를 입력해 주세요.
                                                </div>
                                            )}
                                            <div className="grid grid-cols-2 gap-1.5">
                                                <div>
                                                    <label className="block text-[10px] font-bold text-gray-600 mb-0.5">수령인 성함 *</label>
                                                    <input 
                                                        type="text"
                                                        value={addrForm.realname}
                                                        onChange={(e) => setAddrForm({...addrForm, realname: e.target.value})}
                                                        placeholder="홍길동"
                                                        className="w-full px-2.5 py-1.5 bg-gray-50 border border-gray-300 rounded text-[12px] font-semibold outline-none focus:border-blue-600 focus:bg-white"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-[10px] font-bold text-gray-600 mb-0.5">연락처 (숫자만) *</label>
                                                    <input 
                                                        type="tel"
                                                        inputMode="numeric"
                                                        value={addrForm.phone}
                                                        onChange={(e) => setAddrForm({...addrForm, phone: e.target.value.replace(/[^0-9]/g, "")})}
                                                        placeholder="01012345678"
                                                        className="w-full px-2.5 py-1.5 bg-gray-50 border border-gray-300 rounded text-[12px] font-semibold outline-none focus:border-blue-600 focus:bg-white"
                                                    />
                                                </div>
                                            </div>

                                            <div>
                                                <label className="block text-[10px] font-bold text-gray-600 mb-0.5">주소 *</label>
                                                <div className="flex gap-1.5 mb-1.5">
                                                    <input 
                                                        type="text"
                                                        value={addrForm.zipcode}
                                                        readOnly
                                                        placeholder="우편번호"
                                                        className="w-20 px-2.5 py-1.5 bg-gray-100 border border-gray-300 rounded text-[12px] text-gray-600"
                                                    />
                                                    <button 
                                                        type="button"
                                                        onClick={handleSearchPostcode}
                                                        className="bg-gray-800 hover:bg-black text-white px-3 py-1.5 rounded text-[11px] font-bold"
                                                    >
                                                        주소 검색
                                                    </button>
                                                </div>
                                                <input 
                                                    type="text"
                                                    value={addrForm.baseAddress}
                                                    readOnly
                                                    placeholder="주소 검색 버튼을 눌러주세요"
                                                    className="w-full px-2.5 py-1.5 bg-gray-100 border border-gray-300 rounded text-[12px] text-gray-700 mb-1.5"
                                                />
                                                <input 
                                                    type="text"
                                                    value={addrForm.detailAddress}
                                                    onChange={(e) => setAddrForm({...addrForm, detailAddress: e.target.value})}
                                                    placeholder="상세주소 (동, 호수 등)"
                                                    className="w-full px-2.5 py-1.5 bg-gray-50 border border-gray-300 rounded text-[12px] font-semibold outline-none focus:border-blue-600 focus:bg-white"
                                                />
                                            </div>

                                            <div>
                                                <label className="block text-[10px] font-bold text-gray-600 mb-0.5">배송 메모</label>
                                                <input 
                                                    type="text"
                                                    value={addrForm.memo}
                                                    onChange={(e) => setAddrForm({...addrForm, memo: e.target.value})}
                                                    placeholder="예: 문 앞에 놓아주세요"
                                                    className="w-full px-2.5 py-1.5 bg-gray-50 border border-gray-300 rounded text-[12px] outline-none focus:border-blue-600 focus:bg-white"
                                                />
                                            </div>

                                            <div className="bg-gray-50 p-2 rounded border border-gray-200 space-y-1 pt-1.5">
                                                <div className="flex items-center justify-between">
                                                    <span className="text-[11px] font-bold text-gray-700">개인정보 수집 및 이용 동의</span>
                                                    <button type="button" onClick={() => setShowPolicyDetail(!showPolicyDetail)} className="text-[10px] text-gray-500 underline">
                                                        {showPolicyDetail ? "닫기" : "내용보기"}
                                                    </button>
                                                </div>
                                                {showPolicyDetail && (
                                                    <div className="text-[10px] text-gray-600 bg-white p-1.5 rounded border border-gray-200 leading-relaxed">
                                                        · 목적: 주문 상품 배송 및 고객 상담<br/>
                                                        · 항목: 수령인 성함, 연락처, 배송 주소<br/>
                                                        · 보유기간: <strong>주소 입력·확인일로부터 30일 보관 후 자동 파기</strong>
                                                    </div>
                                                )}
                                                <label className="flex items-center gap-1.5 cursor-pointer pt-0.5">
                                                    <input type="checkbox" checked={agreePrivacy && agreeThirdParty} onChange={(e) => { setAgreePrivacy(e.target.checked); setAgreeThirdParty(e.target.checked); }} className="w-3.5 h-3.5 accent-blue-600 rounded" />
                                                    <span className="text-[11px] font-semibold text-gray-800">[필수] 개인정보 수집·이용 및 택배사 제공 동의 (30일 보관)</span>
                                                </label>
                                            </div>

                                            <div className="flex gap-1.5 pt-1">
                                                {currentUser.address && (
                                                    <button type="button" onClick={() => setIsEditingAddress(false)} className="flex-1 py-2 bg-gray-200 text-gray-700 font-bold rounded text-[12px]">
                                                        취소
                                                    </button>
                                                )}
                                                <button type="submit" disabled={isSavingAddress} className="flex-1 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded text-[12px]">
                                                    {isSavingAddress ? "저장 중..." : "배송지 저장"}
                                                </button>
                                            </div>
                                        </form>
                                    )}
                                </section>

                                {/* 구획 5: 최종 주문 확정 및 카톡 문의 버튼 */}
                                <section className="space-y-1.5 pt-0.5 pb-1">
                                    {currentUser.isConfirmed ? (
                                        <div className="w-full py-2.5 bg-blue-50 border border-blue-600 text-blue-700 font-extrabold rounded-lg text-[12px] text-center">
                                            주문 및 배송지 확인 완료
                                        </div>
                                    ) : (
                                        <button 
                                            onClick={handleConfirmOrder}
                                            className="w-full py-2.5 bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-extrabold rounded-lg text-[12px] shadow-sm transition-all"
                                        >
                                            네, 주문내역과 배송지가 모두 맞습니다
                                        </button>
                                    )}

                                    <a 
                                        href={KAKAO_CHANNEL_URL}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="w-full py-2 bg-[#FEE500] hover:bg-[#FADA0A] text-gray-900 font-bold rounded-lg text-[11px] flex items-center justify-center gap-1.5 shadow-sm transition-all"
                                    >
                                        <Icon name="chat-circle-dots" weight="fill" size={15} />
                                        <span>품목 수정 / 합배송 카톡 연락하기</span>
                                    </a>
                                </section>
                            </main>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CustomerPortal />);
    </script>
</body>
</html>
