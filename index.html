                if (idx < 0 || idx >= orderHistoryList.length) return;
                setSelectedBroadcastIdx(idx);
                setCurrentUser(orderHistoryList[idx]);
                initAddressState(orderHistoryList[idx]);
            };

            const fetchInlineTracking = async (cleanDigits, force = false) => {
                if (!cleanDigits) return;
                if (!force && trackingMap[cleanDigits] && !trackingMap[cleanDigits].loading) return;
                setTrackingMap(prev => ({ ...prev, [cleanDigits]: { loading: true, stateText: "조회중...", steps: prev[cleanDigits]?.steps || [] } }));
                try {
                    const res = await fetch(`https://apis.tracker.delivery/carriers/kr.lotte/tracks/${cleanDigits}`);
                    if (res.ok) {
                        const data = await res.json();
                        const progresses = Array.isArray(data.progresses) ? data.progresses.slice().reverse() : [];
                        const steps = progresses.map(p => ({
                            time: p.time ? String(p.time).replace('T', ' ').slice(0, 16) : '',
                            location: p.location?.name || '롯데택배',
                            status: p.status?.text ? `${p.status.text}${p.description ? ' · ' + p.description : ''}` : (p.description || '')
                        }));
                        setTrackingMap(prev => ({
                            ...prev,
                            [cleanDigits]: { loading: false, stateText: data.state?.text || '배송중', steps }
                        }));
                        return;
                    }
                } catch (e) {}
                try {
                    const gasRes = await fetchGasWithRetry(`${DEFAULT_GAS_URL}?action=get_lotte_tracking&invNo=${cleanDigits}&t=${Date.now()}`, {}, 1);
                    if (gasRes && gasRes.status === 'success') {
                        setTrackingMap(prev => ({
                            ...prev,
                            [cleanDigits]: { loading: false, stateText: gasRes.stateText || '배송중', steps: gasRes.steps || [] }
                        }));
                        return;
                    }
                } catch (e) {}
                setTrackingMap(prev => ({
                    ...prev,
                    [cleanDigits]: { loading: false, stateText: '집하/상품준비중', steps: [] }
                }));
            };

            const handleSaveCustomerRefundAccount = async (csId) => {
                const nextAcc = String(editingCsAccountMap[csId] || '').trim();
                if (!nextAcc) {
                    showToast("환불받으실 은행명, 계좌번호, 예금주를 입력해 주세요.");
                    return;
                }
                setCustomerCsList(prev => prev.map(c => c.id === csId ? { ...c, refundAccount: nextAcc } : c));
                setEditingCsAccountMap(prev => {
                    const next = { ...prev };
                    delete next[csId];
                    return next;
                });
                if (portalFbDb) {
                    portalFbDb.ref(`ember_live_data/_portal_cs_accounts/${csId}`).set({
                        csId,
                        refundAccount: nextAcc,
                        updatedAt: Date.now()
                    }).catch(() => {});
                }
                showToast("환불 계좌번호가 저장되었습니다!");
            };

            const handleLogin = async (e, overrideNick = null, overridePin = null, isRefreshCall = false) => {
                if (e && e.preventDefault) e.preventDefault();
                setLoginError("");

                const rawNick = String(overrideNick !== null ? overrideNick : nickInput).trim();
                const cleanPin = String(overridePin !== null ? overridePin : pinInput).replace(/[^0-9]/g, "");

                if (!rawNick) {
                    setLoginError("유튜브 닉네임을 입력해 주세요.");
                    return;
                }
                if (cleanPin.length !== 4) {
                    setLoginError("비밀번호(휴대폰 뒷 4자리)를 입력해 주세요.");
                    return;
                }

                setIsLoading(true);
                if (isRefreshCall) setIsRefreshing(true);
                setTrackingMap({});

                const applyAndMergeOrders = (rawList) => {
                    const verified = filterVerifiedHistoryList(rawList, rawNick, cleanPin);
                    const cleaned = removeDummyEmptyOrdersIfRealExists(verified);
                    const sorted = sortHistoryByNewestDate(cleaned);
                    if (sorted.length === 0) return false;

                    setOrderHistoryList(sorted);
                    setSelectedBroadcastIdx(0);
                    setCurrentUser(sorted[0]);
                    initAddressState(sorted[0]);
                    setIsLoading(false);
                    setIsRefreshing(false);

                    const primaryNick = sorted[0].nickname || rawNick;
                    lookupCustomerCsRecords([primaryNick, rawNick], cleanPin)
                        .then(csList => {
                            if (Array.isArray(csList)) setCustomerCsList(csList);
                        })
                        .catch(() => {});
                    return true;
                };

                try {
                    // ⚡ [새로고침] 버튼을 직접 누른 경우에만 서버 강제 재요청을 하고, 첫 로그인 시에는 백그라운드에 미리 준비된 캐시로 0.1초 만에 즉시 오픈!
                    if (isRefreshCall) {
                        portalSheetCache.bossLiveOrderRows = null;
                        await Promise.all([
                            preloadPortalDataInBackground(true),
                            portalFbDb ? portalFbDb.ref('ember_live_data').once('value').then(s => { portalSheetCache.fbSnapshot = s.val() || {}; }).catch(() => {}) : Promise.resolve()
                        ]);
                    }

                    const [staffDirectData, bossLiveSheetData, fbInstantData] = await Promise.all([
                        lookupOrderFromStaffSheetDirect(rawNick, cleanPin, false),
                        lookupOrderFromBossLiveSheetDirect(rawNick, cleanPin, isRefreshCall),
                        lookupOrderFromFirebase(rawNick, cleanPin)
                    ]);

                    const rootFb = portalSheetCache.fbSnapshot || {};
                    const liveModeVal = rootFb._portal_live_mode || {};
                    const hasMainLiveCustomers = Array.isArray(rootFb._portal_orders?.__MAIN_LIVE__?.customers) && rootFb._portal_orders.__MAIN_LIVE__.customers.length > 0;
                    const isLiveNow = Boolean(liveModeVal.isLive && hasMainLiveCustomers);
                    const activeLiveBName = cleanBroadcastKey(liveModeVal.activeBroadcastName || rootFb._portal_orders?.__MAIN_LIVE__?.broadcastName || '');

                    const bcastAddrsVal = rootFb._portal_broadcast_addresses || {};
                    const confVal = rootFb._portal_confirmed || {};
                    const bcastConfVal = rootFb._portal_broadcast_confirmed || {};
                    const credVal = rootFb._portal_credits || {};
                    const validSheetSet = new Set(Array.isArray(staffDirectData?.validSheetBroadcasts) ? staffDirectData.validSheetBroadcasts : []);

                    const rawCombinedList = [];

                    // 1순위: 직원용 시스템에서 실시간으로 동기화한 클라우드 데이터(_portal_orders) 및 직원용 구글 시트(staffDirectData) 모두 가져오기!
                    if (fbInstantData && fbInstantData.status === "success" && Array.isArray(fbInstantData.historyList)) {
                        fbInstantData.historyList.forEach(fbItem => {
                            const fbBName = cleanBroadcastKey(fbItem.broadcastName || fbItem.sheetTabName || '');
                            const hasDummyItem = Array.isArray(fbItem.items) && fbItem.items.some(it => String(it.product || '').includes('222222'));
                            if (hasDummyItem) return;

                            if (fbItem._isLiveSource) {
                                // 현재 사장님 주문서가 진짜 생방송 중일 때만 __MAIN_LIVE__ 표시
                                if (isLiveNow) {
                                    const displayLiveTitle = (!fbBName || fbBName === '오늘의방송' || fbBName === '기본방송') ? '오늘의 라이브' : fbBName;
                                    rawCombinedList.push({
                                        ...fbItem,
                                        broadcastName: displayLiveTitle,
                                        _isLiveSource: true
                                    });
                                }
                            } else if (fbBName && fbBName !== '오늘의방송' && fbBName !== '기본방송' && fbBName !== '10/24 라이브') {
                                // 직원용 시스템에 있는 모든 마감 방송 데이터 반영 (시트가 로드된 경우 시트에 존재하는 방송이거나 방금 마감된 방송 모두 포함)
                                if (validSheetSet.size === 0 || validSheetSet.has(fbBName) || fbItem._fromStaffRealtime) {
                                    rawCombinedList.push({
                                        ...fbItem,
                                        broadcastName: fbBName,
                                        _isLiveSource: false
                                    });
                                }
                            }
                        });
                    }

                    // 2순위: 직원용 구글 시트('메인주문')에서 직접 읽어온 모든 방송 블록 병합
                    if (staffDirectData && staffDirectData.status === "success" && Array.isArray(staffDirectData.historyList)) {
                        const allAddrsVal = rootFb._portal_addresses || {};
                        staffDirectData.historyList.forEach(sheetCard => {
                            const bName = cleanBroadcastKey(sheetCard.broadcastName || '');
                            if (!bName || bName === '오늘의방송' || bName === '기본방송') return;
                            const safeBKey = bName.replace(/[.#$\[\]\/]/g, '_');
                            const safeNickKey = String(sheetCard.nickname || '').replace(/[.#$\[\]\/]/g, '_');
                            const bAddr = bcastAddrsVal[safeBKey]?.[safeNickKey]
                                || Object.values(bcastAddrsVal[safeBKey] || {}).find(x => x && normalizeNick(x.nickname) === normalizeNick(sheetCard.nickname))
                                || allAddrsVal[safeNickKey]
                                || Object.values(allAddrsVal).find(x => x && normalizeNick(x.nickname) === normalizeNick(sheetCard.nickname));
                            const credEntry = credVal[safeNickKey] || Object.values(credVal).find(x => x && normalizeNick(x.nickname) === normalizeNick(sheetCard.nickname));
                            const isBcastConf = Boolean(
                                bcastConfVal[safeBKey]?.[safeNickKey] ||
                                Object.values(bcastConfVal[safeBKey] || {}).some(x => x && normalizeNick(x.nickname) === normalizeNick(sheetCard.nickname))
                            );
                            const isGlobalConf = Boolean(
                                confVal[safeNickKey] &&
                                (!confVal[safeNickKey].broadcastName || normalizeNick(cleanBroadcastKey(confVal[safeNickKey].broadcastName)) === normalizeNick(bName))
                            );
                            const isConf = Boolean(sheetCard.isConfirmed || isBcastConf || isGlobalConf);

                            rawCombinedList.push({
                                ...sheetCard,
                                credit: credEntry ? Number(credEntry.credit || 0) : (Number(sheetCard.credit) || 0),
                                creditLogs: credEntry && Array.isArray(credEntry.logs) ? credEntry.logs : [],
                                creditUpdatedAt: credEntry?.updatedAtStr || '',
                                address: bAddr ? {
                                    realname: bAddr.realname || sheetCard.address?.realname || '',
                                    phone: fixPhoneStr(bAddr.phone || sheetCard.address?.phone || ''),
                                    zipcode: '',
                                    baseAddress: String(bAddr.address || bAddr.baseAddress || '').replace(/^\(\d{5}\)\s*/, '').trim(),
                                    detailAddress: '',
                                    memo: bAddr.memo ?? sheetCard.address?.memo ?? '',
                                    updatedAt: bAddr.updatedAt || ''
                                } : sheetCard.address,
                                isConfirmed: isConf,
                                _hasBcastCustomAddr: Boolean(bAddr && (bAddr.address || bAddr.baseAddress)),
                                _fromStaffSheet: true
                            });
                        });
                    }

                    // 3순위: 사장님 주문서가 현재 실시간 생방송 중(isLiveNow === true)일 때만 사장님 마스터 시트의 '메인주문'을 추가로 병합! (생방송 중이 아닐 때는 직원용 시스템 데이터만 깨끗하게 사용)
                    if (isLiveNow && bossLiveSheetData && bossLiveSheetData.status === "success" && Array.isArray(bossLiveSheetData.historyList)) {
                        bossLiveSheetData.historyList.forEach(liveCard => {
                            const bName = cleanBroadcastKey(liveCard.broadcastName || activeLiveBName || '오늘의 라이브');
                            const safeBKey = bName.replace(/[.#$\[\]\/]/g, '_');
                            const safeNickKey = String(liveCard.nickname || '').replace(/[.#$\[\]\/]/g, '_');
                            const bAddr = bcastAddrsVal[safeBKey]?.[safeNickKey] || bcastAddrsVal['오늘의방송']?.[safeNickKey];
                            const credEntry = credVal[safeNickKey] || Object.values(credVal).find(x => x && normalizeNick(x.nickname) === normalizeNick(liveCard.nickname));
                            const isConf = Boolean(liveCard.isConfirmed || confVal[safeNickKey]);

                            rawCombinedList.push({
                                ...liveCard,
                                broadcastName: (!bName || bName === '오늘의방송' || bName === '기본방송') ? (activeLiveBName && activeLiveBName !== '오늘의방송' ? activeLiveBName : '오늘의 라이브') : bName,
                                credit: credEntry ? Number(credEntry.credit || 0) : (Number(liveCard.credit) || 0),
                                creditLogs: credEntry && Array.isArray(credEntry.logs) ? credEntry.logs : [],
                                creditUpdatedAt: credEntry?.updatedAtStr || '',
                                address: bAddr ? {
                                    realname: bAddr.realname || liveCard.address?.realname || '',
                                    phone: fixPhoneStr(bAddr.phone || liveCard.address?.phone || ''),
                                    zipcode: '',
                                    baseAddress: String(bAddr.address || bAddr.baseAddress || '').replace(/^\(\d{5}\)\s*/, '').trim(),
                                    detailAddress: '',
                                    memo: bAddr.memo ?? liveCard.address?.memo ?? '',
                                    updatedAt: bAddr.updatedAt || ''
                                } : liveCard.address,
                                isConfirmed: isConf,
                                _hasBcastCustomAddr: Boolean(bAddr),
                                _isLiveSource: true
                            });
                        });
                    }

                    const combinedInstantList = deduplicateHistoryByBroadcastName(rawCombinedList);

                    if (hasRealOrderItems(combinedInstantList) && applyAndMergeOrders(combinedInstantList)) {
                        return;
                    }

                    if ((staffDirectData && staffDirectData.errorType === "WRONG_PIN") || (bossLiveSheetData && bossLiveSheetData.errorType === "WRONG_PIN") || (fbInstantData && fbInstantData.errorType === "WRONG_PIN")) {
                        setIsLoading(false);
                        setIsRefreshing(false);
                        setLoginError("비밀번호(뒷 4자리)가 일치하지 않습니다. 첫 구매이거나 열리지 않으면 아래 노란색 카톡 버튼으로 문의해 주세요.");
                        return;
                    }

                    const matchedFullNickFromStep1 = combinedInstantList[0]?.nickname || rawNick;
                    const csOnlyCheck = await lookupCustomerCsRecords([matchedFullNickFromStep1, rawNick], cleanPin).catch(() => []);

                    if (combinedInstantList.length > 0 && applyAndMergeOrders(combinedInstantList)) {
                        return;
                    }

                    if (Array.isArray(csOnlyCheck) && csOnlyCheck.length > 0) {
                        const firstCs = csOnlyCheck[0];
                        const csCard = {
                            sheetTabName: '주문_' + (firstCs.sourceBroadcast || '교환반품'),
                            nickname: firstCs.nick || rawNick,
                            phoneLast4: normalizePin4(cleanPin),
                            broadcastName: firstCs.sourceBroadcast || '미송/교환/반품 내역',
                            isVip: false,
                            credit: 0,
                            freeShippingThreshold: 70000,
                            cardFeeRate: 10,
                            isCard: '',
                            shipping: 0,
                            depositTotal: 0,
                            deposits: [],
                            items: [],
                            address: null,
                            trackingNumbers: firstCs.origTracking ? [firstCs.origTracking] : [],
                            isConfirmed: false
                        };
                        setOrderHistoryList([csCard]);
                        setSelectedBroadcastIdx(0);
                        setCurrentUser(csCard);
                        initAddressState(csCard);
                        setCustomerCsList(csOnlyCheck);
                        setIsLoading(false);
                        setIsRefreshing(false);
                        return;
                    }

                    setIsLoading(false);
                    setIsRefreshing(false);
                    setLoginError("주문 내역을 찾을 수 없습니다. (뒤쪽 -영문숫자 핸들을 뺀 한글 닉네임만 입력해 보세요!)");
                } catch (err) {
                    setIsLoading(false);
                    setIsRefreshing(false);
                    if (isRefreshCall) {
                        showToast("일시적인 네트워크 지연입니다. 다시 한번 눌러주세요.");
                    } else {
                        setLoginError("일시적인 연결 지연입니다. [주문서 조회하기]를 한 번 더 눌러주세요!");
                    }
                }
            };

            const handleOpenPostcode = () => {
                const startEmbed = () => {
                    setIsPostcodeModalOpen(true);
                    setTimeout(() => {
                        if (!postcodeContainerRef.current || !window.daum || !window.daum.Postcode) return;
                        postcodeContainerRef.current.innerHTML = "";
                        new window.daum.Postcode({
                            oncomplete: function(data) {
                                let fullAddr = data.address;
                                let extraAddr = '';
                                if (data.addressType === 'R') {
                                    if (data.bname !== '') extraAddr += data.bname;
                                    if (data.buildingName !== '') extraAddr += (extraAddr !== '' ? ', ' + data.buildingName : data.buildingName);
                                    fullAddr += (extraAddr !== '' ? ` (${extraAddr})` : '');
                                }
                                setAddrForm(prev => ({
                                    ...prev,
                                    zipcode: data.zonecode,
                                    baseAddress: fullAddr
                                }));
                                setIsPostcodeModalOpen(false);
                            },
                            width: '100%',
                            height: '100%'
                        }).embed(postcodeContainerRef.current);
                    }, 60);
                };

                if (window.daum && window.daum.Postcode) {
                    startEmbed();
                } else {
                    const script = document.createElement('script');
                    script.src = "https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js";
                    script.onload = startEmbed;
                    script.onerror = () => showToast("주소 검색창을 열지 못했습니다. 아래 주소 칸에 직접 주소를 입력해 주세요.");
                    document.head.appendChild(script);
                }
            };

            const handleSaveAddress = async (e) => {
                if (e && e.preventDefault) e.preventDefault();
                const hasTrackingNow = Boolean(
                    (Array.isArray(currentUser?.trackingNumbers) && currentUser.trackingNumbers.length > 0) ||
                    (currentUser?.trackingNumber && String(currentUser.trackingNumber).trim() !== "")
                );
                if (hasTrackingNow) {
                    setIsEditingAddress(false);
                    showToast("이미 송장번호가 등록(출고)된 방송의 배송지는 변경할 수 없습니다.");
                    return false;
                }
                if (!addrForm.realname.trim()) { showToast("수령인 성함을 입력해 주세요."); return false; }
                const cleanPhone = addrForm.phone.replace(/[^0-9]/g, "");
                if (cleanPhone.length < 9) { showToast("정확한 휴대폰 번호를 입력해 주세요."); return false; }
                if (!addrForm.baseAddress.trim()) { showToast("주소를 검색하거나 직접 입력해 주세요."); return false; }
                if (!agreePrivacy || !agreeThirdParty) { showToast("아래 필수 개인정보 수집 및 제공 동의에 체크해 주세요!"); return false; }

                const nowStr = getKstNowString();
                const cleanBase = String(addrForm.baseAddress || "").replace(/^\(\d{5}\)\s*/, "").trim();
                const fullCombinedAddress = `${cleanBase} ${addrForm.detailAddress || ""}`.trim();
                const updatedAddr = {
                    realname: addrForm.realname.trim(),
                    phone: cleanPhone,
                    zipcode: addrForm.zipcode || "",
                    baseAddress: fullCombinedAddress,
                    detailAddress: "",
                    memo: addrForm.memo.trim(),
                    updatedAt: nowStr
                };
                const newLast4 = cleanPhone.slice(-4);

                setIsSavingAddress(true);
                try {
                    const cleanTargetBName = cleanBroadcastKey(currentUser.broadcastName || '');
                    const safeBKey = cleanTargetBName.replace(/[.#$\[\]\/]/g, '_');
                    const safeNickKey = String(currentUser.nickname || '').replace(/[.#$\[\]\/]/g, '_');

                    const addrRecord = {
                        nickname: currentUser.nickname,
                        realname: updatedAddr.realname,
                        phone: cleanPhone,
                        zipcode: '',
                        baseAddress: fullCombinedAddress,
                        detailAddress: '',
                        address: fullCombinedAddress,
                        memo: updatedAddr.memo,
                        sheetTabName: currentUser.sheetTabName || ('주문_' + cleanTargetBName),
                        broadcastName: cleanTargetBName,
                        updatedAt: nowStr
                    };

                    // 1) 파이어베이스 실시간 DB에 즉시 기록 (포털 캐시에도 즉시 반영하여 새로고침 시 절대 날아가지 않게 보장!)
                    if (portalFbDb) {
                        const fbPromises = [];
                        if (safeBKey) {
                            fbPromises.push(portalFbDb.ref(`ember_live_data/_portal_broadcast_addresses/${safeBKey}/${safeNickKey}`).set(addrRecord));
                        }
                        fbPromises.push(portalFbDb.ref(`ember_live_data/_portal_addresses/${safeNickKey}`).set(addrRecord));
                        fbPromises.push(portalFbDb.ref(`ember_live_data/_portal_master_addrs/${safeNickKey}`).set(addrRecord));
                        Promise.all(fbPromises).catch(() => {});
                    }

                    // 로컬 캐시 스냅샷에도 즉시 업데이트
                    if (!portalSheetCache.fbSnapshot) portalSheetCache.fbSnapshot = {};
                    if (safeBKey) {
                        if (!portalSheetCache.fbSnapshot._portal_broadcast_addresses) portalSheetCache.fbSnapshot._portal_broadcast_addresses = {};
                        if (!portalSheetCache.fbSnapshot._portal_broadcast_addresses[safeBKey]) portalSheetCache.fbSnapshot._portal_broadcast_addresses[safeBKey] = {};
                        portalSheetCache.fbSnapshot._portal_broadcast_addresses[safeBKey][safeNickKey] = addrRecord;
                    }
                    if (!portalSheetCache.fbSnapshot._portal_addresses) portalSheetCache.fbSnapshot._portal_addresses = {};
                    portalSheetCache.fbSnapshot._portal_addresses[safeNickKey] = addrRecord;

                    // 2) 화면 상태 먼저 즉시 업데이트 (0.01초 즉시 반영!)
                    setCurrentUser(prev => ({
                        ...prev,
                        phoneLast4: newLast4,
                        address: updatedAddr,
                        _hasBcastCustomAddr: true
                    }));
                    setOrderHistoryList(prev => prev.map((item, idx) =>
                        idx === selectedBroadcastIdx
                            ? { ...item, phoneLast4: newLast4, address: updatedAddr, _hasBcastCustomAddr: true }
                            : item
                    ));
                    setPinInput(newLast4);
                    setIsEditingAddress(false);
                    showToast(`✅ 배송지가 정상적으로 저장되었습니다!`);

                    // 3) 백그라운드로 사장님 마스터 시트 + 직원용 시트에 동시 기록
                    const gasPayload = {
                        action: 'save_master_address',
                        masterId: DEFAULT_MASTER_SHEET_ID,
                        data: {
                            nickname: currentUser.nickname,
                            realname: updatedAddr.realname,
                            phone: cleanPhone ? "'" + cleanPhone : '',
                            address: fullCombinedAddress,
                            memo: updatedAddr.memo,
                            broadcastName: cleanTargetBName,
                            sheetTabName: currentUser.sheetTabName || ('주문_' + cleanTargetBName),
                            forceOverwrite: true
                        }
                    };
                    fetchGasWithRetry(DEFAULT_GAS_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(gasPayload)
                    }, 1).catch(() => {});

                    fetchGasWithRetry(DEFAULT_GAS_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ ...gasPayload, masterId: DEFAULT_STAFF_SHEET_ID })
                    }, 1).catch(() => {});

                    return true;
                } catch (err) {
                    setCurrentUser(prev => ({ ...prev, phoneLast4: newLast4, address: updatedAddr, _hasBcastCustomAddr: true }));
                    setOrderHistoryList(prev => prev.map((item, i) => i === selectedBroadcastIdx ? { ...item, phoneLast4: newLast4, address: updatedAddr, _hasBcastCustomAddr: true } : item));
                    setPinInput(newLast4);
                    setIsEditingAddress(false);
                    showToast(`✅ 배송지가 정상적으로 저장되었습니다!`);
                    return true;
                } finally {
                    setIsSavingAddress(false);
                }
            };

            const handleConfirmOrder = async () => {
                if (!currentUser) return;

                // 만약 주소가 아직 없거나 고객이 주소 입력창을 열어둔 상태에서 바로 [주문내역·배송지 확정]을 눌렀다면 먼저 주소 저장 실행
                if (!currentUser.address || !currentUser.address.baseAddress || isEditingAddress) {
                    const hasTypedAddr = Boolean(addrForm.realname.trim() && addrForm.phone.trim() && addrForm.baseAddress.trim());
                    if (hasTypedAddr) {
                        if (!agreePrivacy || !agreeThirdParty) {
                            setAgreePrivacy(true);
                            setAgreeThirdParty(true);
                        }
                        const savedOk = await handleSaveAddress();
                        if (!savedOk) return;
                    } else if (!currentUser.address || !currentUser.address.baseAddress) {
                        showToast("먼저 배송지를 입력하고 저장해 주세요!");
                        setIsEditingAddress(true);
                        return;
                    } else {
                        setIsEditingAddress(false);
                    }
                }

                const nowStr = getKstNowString();
                const cleanTargetBName = cleanBroadcastKey(currentUser.broadcastName || '');
                const safeBKey = cleanTargetBName.replace(/[.#$\[\]\/]/g, '_');
                const safeNickKey = String(currentUser.nickname || '').replace(/[.#$\[\]\/]/g, '_');

                // 1) 화면 상태부터 0.01초 만에 즉시 [주문 및 배송지 확정 완료]로 전환! (네트워크 지연으로 인한 오류/멈춤 ZERO!)
                setCurrentUser(prev => ({
                    ...prev,
                    isConfirmed: true,
                    address: prev.address ? { ...prev.address, updatedAt: nowStr } : prev.address
                }));
                setOrderHistoryList(prev => prev.map((item, i) =>
                    i === selectedBroadcastIdx
                        ? { ...item, isConfirmed: true, address: item.address ? { ...item.address, updatedAt: nowStr } : item.address }
                        : item
                ));
                showToast("✅ 주문 및 배송지 확정이 완료되었습니다!");

                // 로컬 캐시 스냅샷에도 즉시 기록하여 새로고침 시 절대 풀리지 않게 보장
                if (!portalSheetCache.fbSnapshot) portalSheetCache.fbSnapshot = {};
                if (!portalSheetCache.fbSnapshot._portal_confirmed) portalSheetCache.fbSnapshot._portal_confirmed = {};
                portalSheetCache.fbSnapshot._portal_confirmed[safeNickKey] = {
                    nickname: currentUser.nickname,
                    broadcastName: cleanTargetBName,
                    confirmedAt: nowStr
                };
                if (safeBKey) {
                    if (!portalSheetCache.fbSnapshot._portal_broadcast_confirmed) portalSheetCache.fbSnapshot._portal_broadcast_confirmed = {};
                    if (!portalSheetCache.fbSnapshot._portal_broadcast_confirmed[safeBKey]) portalSheetCache.fbSnapshot._portal_broadcast_confirmed[safeBKey] = {};
                    portalSheetCache.fbSnapshot._portal_broadcast_confirmed[safeBKey][safeNickKey] = {
                        nickname: currentUser.nickname,
                        broadcastName: cleanTargetBName,
                        confirmedAt: nowStr
                    };
                }

                // 2) 파이어베이스 실시간 클라우드에 즉시 확정 상태 전송 (사장님 주문서 + 직원용 시스템 실시간 연동)
                if (portalFbDb) {
                    const confPayload = {
                        nickname: currentUser.nickname,
                        broadcastName: cleanTargetBName,
                        confirmedAt: nowStr
                    };
                    portalFbDb.ref(`ember_live_data/_portal_confirmed/${safeNickKey}`).set(confPayload).catch(() => {});
                    if (safeBKey) {
                        portalFbDb.ref(`ember_live_data/_portal_broadcast_confirmed/${safeBKey}/${safeNickKey}`).set(confPayload).catch(() => {});
                        if (portalSheetCache.fbSnapshot?._portal_orders?.[safeBKey]?.customers) {
                            const updatedCusts = portalSheetCache.fbSnapshot._portal_orders[safeBKey].customers.map(c =>
                                normalizeNick(c.nickname) === normalizeNick(currentUser.nickname)
                                    ? { ...c, isConfirmed: true }
                                    : c
                            );
                            portalSheetCache.fbSnapshot._portal_orders[safeBKey].customers = updatedCusts;
                            portalFbDb.ref(`ember_live_data/_portal_orders/${safeBKey}/customers`).set(updatedCusts).catch(() => {});
                        }
                    }
                }

                // 3) 백그라운드로 사장님 마스터 시트와 직원용 시트 양쪽에 동시 기록 (실패하거나 지연되어도 고객 화면에는 에러를 띄우지 않음)
                const confirmBody = {
                    action: 'confirm_customer_order',
                    masterId: DEFAULT_MASTER_SHEET_ID,
                    data: {
                        nickname: currentUser.nickname,
                        sheetTabName: currentUser.sheetTabName || ('주문_' + cleanTargetBName),
                        broadcastName: cleanTargetBName
                    }
                };
                fetchGasWithRetry(DEFAULT_GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(confirmBody)
                }, 1).catch(() => {});

                fetchGasWithRetry(DEFAULT_GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ ...confirmBody, masterId: DEFAULT_STAFF_SHEET_ID })
                }, 1).catch(() => {});
            };

            const activeItems = currentUser ? (currentUser.items || []).filter(i => !i.isWaitlist) : [];
            const waitlistItems = currentUser ? (currentUser.items || []).filter(i => i.isWaitlist) : [];
            const totalQty = activeItems.reduce((s, i) => s + Number(i.qty || 1), 0);
            const productTotal = activeItems.reduce((s, i) => s + Number(i.price || 0), 0);
            const isVipFree = Boolean(currentUser && (currentUser.isVip || currentUser.isManager));
            const shippingFee = currentUser ? (isVipFree ? 0 : (activeItems.length > 0 && productTotal > 0 ? Number(currentUser.shipping || 0) : 0)) : 0;
            const baseGrandTotal = productTotal + shippingFee;
            const depositTotal = currentUser ? Number(currentUser.depositTotal || 0) : 0;
            const rawBalance = baseGrandTotal - depositTotal;
            const rawCardStr = String(currentUser?.isCard || '');
            const cardOnlyStr = rawCardStr.replace(/현영완료|현영요청|현영/g, '').replace(/\//g, '').trim();
            const isCard = Boolean(currentUser && (currentUser.isCard === true || cardOnlyStr.toUpperCase().startsWith('O') || cardOnlyStr.includes('카드') || cardOnlyStr.includes('완료')));
            const isCardPaid = Boolean(isCard && cardOnlyStr.includes('완료'));
            const isCashReceiptComp = Boolean(currentUser?.cashReceipt === 'completed' || rawCardStr.includes('현영완료'));
            const isCashReceiptReq = Boolean(!isCashReceiptComp && (currentUser?.cashReceipt === 'requested' || rawCardStr.includes('현영')));
            const parsedFeeFromCardStr = (() => {
                const m = String(currentUser?.isCard || '').match(/(\d+(?:\.\d+)?)%/);
                return m ? Number(m[1]) : 0;
            })();
            const cardFeeRate = parsedFeeFromCardStr > 0 ? parsedFeeFromCardStr : ((currentUser && Number(currentUser.cardFeeRate) > 0) ? Number(currentUser.cardFeeRate) : 10);
            const cardFee = (isCard && rawBalance > 0) ? Math.round(rawBalance * (cardFeeRate / 100)) : 0;
            const finalBalance = rawBalance + cardFee;

            const isPaid = activeItems.length > 0 && finalBalance === 0 && !isCard;
            const isOverpaid = finalBalance < 0 && !isCard;
            const isUnpaid = finalBalance > 0 && !isCard;
            // 고객의 현재 보유적립금은 시트/클라우드에 저장된 최종 잔액 그대로 표시! (과납 등으로 재적립된 적립금이 사라지지 않도록 보호)
            const customerCredit = currentUser ? Math.max(0, Number(currentUser.credit) || 0) : 0;
            const customerCreditLogs = (currentUser && Array.isArray(currentUser.creditLogs)) ? currentUser.creditLogs : [];
            const customerCreditUpdatedAt = (currentUser && currentUser.creditUpdatedAt) ? currentUser.creditUpdatedAt : '';
            const usedCreditInCurrentOrder = activeItems
                .filter(i => String(i.product || '').trim().includes('적립금') && Number(i.price) < 0)
                .reduce((s, i) => s + Math.abs(Number(i.price) || 0), 0);

            const depositsHistory = currentUser && Array.isArray(currentUser.deposits) && currentUser.deposits.length > 0
                ? currentUser.deposits
                : (depositTotal > 0 ? [{ id: 'dep_sum', time: '', name: (currentUser?.address?.realname || currentUser?.nickname || '입금확인'), amount: depositTotal }] : []);

            const userTrackingList = (() => {
                if (!currentUser) return [];
                if (Array.isArray(currentUser.trackingNumbers) && currentUser.trackingNumbers.length > 0) {
                    return currentUser.trackingNumbers;
                }
                if (currentUser.trackingNumber) {
                    return String(currentUser.trackingNumber).split(/[,\/\n]+/).map(s => s.trim()).filter(Boolean);
                }
                return [];
            })();
            const isAddressLockedByTracking = userTrackingList.length > 0;

            useEffect(() => {
                if (userTrackingList.length > 0) {
                    userTrackingList.forEach(trk => {
                        const cleanDigits = String(trk).replace(/[^0-9]/g, '');
                        if (cleanDigits) fetchInlineTracking(cleanDigits);
                    });
                }
                if (Array.isArray(customerCsList) && customerCsList.length > 0) {
                    customerCsList.forEach(cs => {
                        if (cs.csTracking) {
                            const cleanDigits = String(cs.csTracking).replace(/[^0-9]/g, '');
                            if (cleanDigits) fetchInlineTracking(cleanDigits);
                        }
                    });
                }
            }, [currentUser, selectedBroadcastIdx, customerCsList]);

            return (
                <div className="w-full flex flex-col items-center">
                    {toastMsg && (
                        <div className="fixed top-3 left-1/2 -translate-x-1/2 z-50 bg-gray-900/95 text-white px-4 py-2 rounded-full shadow-lg text-xs font-bold flex items-center gap-1.5">
                            <Icon name="check-circle" weight="fill" className="text-green-400" size={15} />
                            <span>{toastMsg}</span>
                        </div>
                    )}

                    {/* 📮 인앱 브라우저 팝업 차단을 100% 방지하는 내장형 다음 우편번호 검색 모달 */}
                    {isPostcodeModalOpen && (
                        <div className="fixed inset-0 z-[150] bg-black/75 backdrop-blur-sm flex items-center justify-center p-3" onClick={() => setIsPostcodeModalOpen(false)}>
                            <div className="bg-white w-full max-w-[400px] h-[480px] max-h-[85vh] rounded-2xl shadow-2xl overflow-hidden flex flex-col border border-gray-200" onClick={e => e.stopPropagation()}>
                                <div className="bg-gray-900 text-white px-4 py-3 flex items-center justify-between shrink-0">
                                    <span className="font-extrabold text-sm flex items-center gap-1.5">
                                        <Icon name="magnifying-glass" weight="bold" size={16} className="text-amber-400" />
                                        <span>도로명 / 지번 주소 검색</span>
                                    </span>
                                    <button
                                        type="button"
                                        onClick={() => setIsPostcodeModalOpen(false)}
                                        className="text-gray-300 hover:text-white px-2 py-0.5 text-xs font-bold bg-gray-800 rounded"
                                    >
                                        닫기 ✕
                                    </button>
                                </div>
                                <div ref={postcodeContainerRef} className="flex-1 w-full h-full overflow-hidden bg-white"></div>
                            </div>
                        </div>
                    )}

                    {/* 📢 고객용 공지사항 팝업 모달 */}
                    {isNoticePopupOpen && noticeConfig.enabled && noticeConfig.content && (
                        <div className="fixed inset-0 z-[120] bg-black/70 backdrop-blur-sm flex items-center justify-center p-4" onClick={() => setIsNoticePopupOpen(false)}>
                            <div className="bg-white w-full max-w-[360px] rounded-2xl shadow-2xl overflow-hidden border border-gray-200 flex flex-col max-h-[82vh]" onClick={e => e.stopPropagation()}>
                                <div className="bg-gray-950 text-white px-4 py-3.5 flex items-center justify-between">
                                    <div className="flex items-center gap-2 min-w-0">
                                        <span className="w-2 h-2 rounded-full bg-amber-400 animate-pulse shrink-0"></span>
                                        <h3 className="font-extrabold text-[15px] tracking-tight truncate">
                                            {noticeConfig.title || "📢 엠버언니 공지사항"}
                                        </h3>
                                    </div>
                                    <button
                                        type="button"
                                        onClick={() => setIsNoticePopupOpen(false)}
                                        className="text-gray-400 hover:text-white p-1"
                                    >
                                        <Icon name="x" weight="bold" size={18} />
                                    </button>
                                </div>

                                <div className="p-4 overflow-y-auto text-[13.5px] text-gray-800 font-semibold leading-relaxed whitespace-pre-wrap break-words bg-amber-50/30">
                                    {noticeConfig.content}
                                </div>

                                <div className="px-3.5 py-2.5 bg-gray-50 border-t border-gray-200 flex items-center justify-between gap-2">
                                    <button
                                        type="button"
                                        onClick={handleDismissNoticeToday}
                                        className="text-[12px] font-bold text-gray-500 hover:text-gray-800 px-2 py-1.5 rounded transition"
                                    >
                                        오늘 하루 보지 않기
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setIsNoticePopupOpen(false)}
                                        className="px-5 py-2 bg-gray-900 hover:bg-black text-white text-[13px] font-extrabold rounded-lg shadow-sm transition"
                                    >
                                        확인 (닫기)
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 🛠️ 포털 내 관리자 공지사항 즉시 수정 모달 (EMBER 로고 연속 3번 터치 시 오픈) */}
                    {isAdminNoticeModalOpen && (
                        <div className="fixed inset-0 z-[130] bg-black/75 backdrop-blur-sm flex items-center justify-center p-4" onClick={() => setIsAdminNoticeModalOpen(false)}>
                            <div className="bg-white w-full max-w-[380px] rounded-2xl shadow-2xl p-5 border border-gray-200" onClick={e => e.stopPropagation()}>
                                <div className="flex items-center justify-between pb-3 mb-3 border-b border-gray-200">
                                    <h3 className="font-extrabold text-[15px] text-gray-900 flex items-center gap-1.5">
                                        <Icon name="megaphone" weight="fill" className="text-red-600" size={18} />
                                        <span>고객 공지사항 팝업 관리</span>
                                    </h3>
                                    <button type="button" onClick={() => setIsAdminNoticeModalOpen(false)} className="text-gray-400 hover:text-gray-700">
                                        <Icon name="x" weight="bold" size={18} />
                                    </button>
                                </div>

                                {!isAdminVerified ? (
                                    <form
                                        onSubmit={(e) => {
                                            e.preventDefault();
                                            const savedStaffPass = portalSheetCache.fbSnapshot?._global_config?.staffAccessPasscode || "1234";
                                            if (adminPinInput === "003637" || adminPinInput === String(savedStaffPass)) {
                                                setIsAdminVerified(true);
                                                setAdminPinInput("");
                                            } else {
                                                showToast("관리자 비밀번호가 일치하지 않습니다.");
                                            }
                                        }}
                                        className="space-y-3"
                                    >
                                        <p className="text-xs text-gray-600 font-semibold">관리자 비밀번호를 입력해 주세요.</p>
                                        <input
                                            type="password"
                                            value={adminPinInput}
                                            onChange={e => setAdminPinInput(e.target.value)}
                                            placeholder="관리자 비밀번호 입력"
                                            autoFocus
                                            className="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm font-bold outline-none focus:border-black"
                                        />
                                        <div className="flex gap-2">
                                            <button type="button" onClick={() => setIsAdminNoticeModalOpen(false)} className="flex-1 py-2.5 bg-gray-100 text-gray-700 rounded-lg text-xs font-bold">취소</button>
                                            <button type="submit" className="flex-1 py-2.5 bg-gray-900 text-white rounded-lg text-xs font-extrabold">확인</button>
                                        </div>
                                    </form>
                                ) : (
                                    <form onSubmit={handleSaveAdminNotice} className="space-y-3 text-xs">
                                        <div className="flex items-center justify-between bg-gray-50 p-2.5 rounded-lg border border-gray-200">
                                            <span className="font-extrabold text-gray-800">고객 접속 시 팝업 띄우기</span>
                                            <button
                                                type="button"
                                                onClick={() => setEditNoticeForm(p => ({ ...p, enabled: !p.enabled }))}
                                                className={`px-3 py-1 rounded-full font-extrabold text-xs transition ${
                                                    editNoticeForm.enabled
                                                        ? 'bg-emerald-600 text-white shadow-sm'
                                                        : 'bg-gray-300 text-gray-700'
                                                }`}
                                            >
                                                {editNoticeForm.enabled ? '🟢 팝업 켜짐 (ON)' : '⚫ 팝업 꺼짐 (OFF)'}
                                            </button>
                                        </div>

                                        <div>
                                            <label className="block font-extrabold text-gray-700 mb-1">공지 제목</label>
                                            <input
                                                type="text"
                                                value={editNoticeForm.title}
                                                onChange={e => setEditNoticeForm(p => ({ ...p, title: e.target.value }))}
                                                placeholder="📢 엠버언니 공지사항"
                                                className="w-full px-3 py-2 border border-gray-300 rounded-lg font-bold text-gray-900 outline-none focus:border-blue-600"
                                            />
                                        </div>

                                        <div>
                                            <label className="block font-extrabold text-gray-700 mb-1">공지 내용 (줄바꿈 그대로 표시됩니다)</label>
                                            <textarea
                                                value={editNoticeForm.content}
                                                onChange={e => setEditNoticeForm(p => ({ ...p, content: e.target.value }))}
                                                placeholder="예: 택배사 물량 증가로 인해 이번 주 출고분은 평일 기준 2~3일 소요됩니다. 감사합니다 💖"
                                                rows={6}
                                                className="w-full px-3 py-2 border border-gray-300 rounded-lg font-semibold text-gray-900 outline-none focus:border-blue-600 resize-y leading-relaxed"
                                            />
                                        </div>

                                        <div className="flex gap-2 pt-1">
                                            <button type="button" onClick={() => setIsAdminNoticeModalOpen(false)} className="flex-1 py-2.5 bg-gray-100 text-gray-700 rounded-lg font-bold">닫기</button>
                                            <button type="submit" className="flex-1 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-extrabold shadow-sm">
                                                저장 및 즉시 반영
                                            </button>
                                        </div>
                                    </form>
                                )}
                            </div>
                        </div>
                    )}

                    {!currentUser ? (
                        <div className="w-full max-w-[420px] min-h-[100dvh] sm:min-h-[760px] bg-[#2c2a29] sm:rounded-2xl shadow-lg border-0 sm:border border-gray-300 relative flex flex-col justify-end overflow-y-auto">
                            <img 
                                src={FIXED_AUTUMN_WINTER_HERO} 
                                fetchpriority="high"
                                decoding="async"
                                referrerPolicy="no-referrer"
                                onError={(e) => { e.target.onerror = null; e.target.src = FALLBACK_COAT_HERO; }}
                                alt="엠버언니 가을겨울 화보" 
                                className="absolute inset-0 w-full h-full object-cover object-top select-none pointer-events-none transition-all duration-300"
                            />

                            {noticeConfig.enabled && noticeConfig.content && (
                                <div className="absolute top-3 right-3 z-30">
                                    <button
                                        type="button"
                                        onClick={() => setIsNoticePopupOpen(true)}
                                        className="px-3 py-1.5 bg-black/75 hover:bg-black text-amber-300 backdrop-blur-md rounded-full text-xs font-extrabold shadow-lg border border-white/20 flex items-center gap-1.5 transition"
                                    >
                                        <Icon name="megaphone" weight="fill" size={14} />
                                        <span>공지사항 보기</span>
                                    </button>
                                </div>
                            )}

                            <div className="absolute inset-0 z-10 flex items-center justify-center pointer-events-none px-4">
                                <h1
                                    onClick={handleLogoSecretClick}
                                    className="text-[#f8f5f0] text-[48px] sm:text-[54px] font-serif tracking-[0.3em] pl-[0.3em] font-medium drop-shadow-2xl translate-y-2 pointer-events-auto cursor-default select-none"
                                    style={{ textShadow: '0 4px 25px rgba(0,0,0,0.75)' }}
                                >
                                    EMBER
                                </h1>
                            </div>

                            <div className="relative z-20 px-3 pb-6 pt-2 safe-bottom mt-auto">
                                <div className="bg-white/55 backdrop-blur-md rounded-2xl p-4 shadow-xl border border-white/70">
                                    <div className="flex items-center justify-between mb-3">
                                        <div className="flex items-baseline gap-1.5">
                                            <h2 className="text-[16px] font-black text-gray-900 tracking-tight drop-shadow-sm">
                                                통합주문확인
                                            </h2>
                                            <span className="text-[10.5px] font-bold text-gray-600 tracking-tight">
                                                ({PORTAL_UPDATED_DATE} 업데이트 · {PORTAL_VERSION})
                                            </span>
                                        </div>
                                        <span className="text-[11px] font-extrabold text-blue-700 flex items-center gap-0.5 drop-shadow-sm">
                                            <Icon name="shield-check" weight="bold" size={14} /> 본인 인증 후 열람가능
                                        </span>
                                    </div>

                                    <form onSubmit={handleLogin} className="space-y-2.5">
                                        <div className="flex items-stretch gap-2">
                                            <div className="flex-1 space-y-2 min-w-0">
                                                <div className="flex items-center gap-2">
                                                    <label className="text-[13px] font-extrabold text-gray-900 w-[64px] shrink-0 flex justify-between items-center drop-shadow-sm">
                                                        <span>닉</span><span>네</span><span>임</span><span className="ml-0.5">:</span>
                                                    </label>
                                                    <input 
                                                        type="text"
                                                        value={nickInput}
                                                        onChange={(e) => setNickInput(e.target.value)}
                                                        placeholder="예) 깔로-SD2 ➔ 깔로"
                                                        className="flex-1 min-w-0 px-3 py-2.5 bg-white/85 border border-white/90 rounded-lg text-[14px] font-bold text-gray-900 placeholder:text-gray-500 placeholder:font-normal focus:bg-white focus:border-blue-600 outline-none shadow-sm"
                                                    />
                                                </div>

                                                <div className="flex items-center gap-2">
                                                    <label className="text-[13px] font-extrabold text-gray-900 w-[64px] shrink-0 flex justify-between items-center drop-shadow-sm">
                                                        <span>비</span><span>밀</span><span>번</span><span>호</span><span className="ml-0.5">:</span>
                                                    </label>
                                                    <input 
                                                        type="password"
                                                        inputMode="numeric"
                                                        maxLength={4}
                                                        value={pinInput}
                                                        onChange={(e) => setPinInput(e.target.value.replace(/[^0-9]/g, ""))}
                                                        placeholder="핸드폰번호 뒤 4자리"

                                                    />
                                                </div>
                                            </div>

                                            <button 
                                                type="submit"
                                                disabled={isLoading}
                                                className="w-[84px] shrink-0 bg-gray-950 hover:bg-black active:scale-[0.99] text-white font-extrabold rounded-lg text-[13px] leading-snug shadow-md transition-all flex flex-col items-center justify-center gap-0.5"

                                                {isLoading ? (
                                                    <Icon name="spinner" className="animate-spin" size={18} />

                                                    <>
                                                        <span>주문서</span>
                                                        <span>조회하기</span>
                                                    </>

                                            </button>

                                            <div className="p-2.5 bg-red-600/95 text-white rounded-lg text-[12px] font-bold leading-snug">

                                            </div>
                                        )}
                                    </form>

                                    <div className="mt-3 pt-2.5 border-t border-gray-900/15 space-y-2">

                                        </p>
                                        <a 
                                            href={KAKAO_CHANNEL_URL}
                                            target="_blank"
                                            rel="noopener noreferrer"

                                        >
                                            <Icon name="chat-circle-dots" weight="fill" size={17} />
                                            <span>첫구매/주문서 오류시 문의하기</span>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className="w-full max-w-[430px] min-h-[100dvh] sm:min-h-0 bg-gray-100 sm:rounded-xl shadow border-0 sm:border border-gray-300 pb-8 overflow-hidden">

                                <header className="bg-white text-gray-900 px-3.5 py-3 rounded-lg border border-gray-200 shadow-sm flex items-center justify-between">
                                    <div className="flex items-center gap-1.5 min-w-0 flex-wrap">
                                        <span className="font-extrabold text-[16px] text-gray-900 truncate">{currentUser.nickname} 님</span>
                                        {isPaid && <span className="bg-emerald-50 text-emerald-700 border border-emerald-200 text-[11.5px] font-extrabold px-2 py-0.5 rounded-md">완납</span>}
                                        {isUnpaid && <span className="bg-red-50 text-red-600 border border-red-200 text-[11.5px] font-extrabold px-2 py-0.5 rounded-md">미입금</span>}
                                        {isOverpaid && <span className="bg-blue-50 text-blue-700 border border-blue-200 text-[11.5px] font-extrabold px-2 py-0.5 rounded-md">과납</span>}
                                        {isCard && !isCardPaid && <span className="bg-amber-50 text-amber-700 border border-amber-200 text-[11.5px] font-extrabold px-2 py-0.5 rounded-md">카드요청</span>}
                                        {isCard && isCardPaid && <span className="bg-purple-50 text-purple-700 border border-purple-200 text-[11.5px] font-extrabold px-2 py-0.5 rounded-md">카드완료</span>}
                                        {isCashReceiptReq && <span className="bg-indigo-50 text-indigo-700 border border-indigo-200 text-[11.5px] font-extrabold px-2 py-0.5 rounded-md">🧾 현영요청</span>}
                                        {isCashReceiptComp && <span className="bg-teal-50 text-teal-700 border border-teal-200 text-[11.5px] font-extrabold px-2 py-0.5 rounded-md">🧾 현영완료</span>}
                                        {customerCredit > 0 && (
                                            <span className="bg-teal-600 text-white text-[11.5px] font-extrabold px-2 py-0.5 rounded-md shadow-sm flex items-center gap-1">
                                                <span>💰 적립금 {customerCredit.toLocaleString()}원</span>
                                            </span>
                                        )}
                                    </div>
                                    <div className="flex items-center gap-1.5 shrink-0">
                                        {noticeConfig.enabled && noticeConfig.content && (
                                            <button
                                                type="button"
                                                onClick={() => setIsNoticePopupOpen(true)}
                                                className="text-[12px] font-extrabold bg-amber-50 hover:bg-amber-100 text-amber-800 px-2.5 py-1.5 rounded-lg border border-amber-300 flex items-center gap-1 transition-all"

                                                <Icon name="megaphone" weight="fill" size={13} className="text-amber-600" />
                                                <span>공지</span>
                                            </button>
                                        )}
                                        <button 
                                            onClick={() => handleLogin(null, currentUser.nickname, currentUser.phoneLast4 || pinInput, true)}
                                            disabled={isRefreshing || isLoading}
                                            className={`text-[12px] font-bold px-2.5 py-1.5 rounded-lg border flex items-center gap-1 transition-all active:scale-95 ${
                                                isRefreshing 
                                                    ? 'bg-blue-50 text-blue-600 border-blue-200' 
                                                    : 'bg-gray-50 hover:bg-gray-100 text-gray-700 border-gray-200'
                                            }`}
                                        >
                                            <Icon name="arrows-clockwise" weight="bold" size={13} className={isRefreshing ? "animate-spin text-blue-600" : "text-gray-500"} />
                                            <span>{isRefreshing ? "갱신중..." : "새로고침"}</span>
                                        </button>
                                        <button 
                                            onClick={() => { setCurrentUser(null); setOrderHistoryList([]); setCustomerCsList([]); setSelectedBroadcastIdx(0); setNickInput(""); setPinInput(""); }}
                                            className="text-[12px] font-bold bg-gray-50 hover:bg-gray-100 text-gray-600 px-2.5 py-1.5 rounded-lg border border-gray-200 transition-colors"
                                        >
                                            닫기
                                        </button>
                                    </div>
                                </header>
                            </div>

                            {isRefreshing && (
                                <div className="mx-3 mt-2 bg-blue-600 text-white text-[12px] font-extrabold py-2 px-3 rounded-lg flex items-center justify-center gap-2 shadow-sm animate-pulse">
                                    <Icon name="spinner" className="animate-spin" size={15} />
                                    <span>최신 주문 및 입금·배송 상태를 불러오고 있습니다...</span>
                                </div>
                            )}

                                    <section className="bg-white rounded-lg p-2.5 border border-blue-200 shadow-sm">
                                        <div className="flex items-center justify-between mb-1.5 px-0.5">

                                            {orderHistoryList.map((hist, idx) => {

                                                    <button
                                                        key={cleanTitle + '_' + idx}
                                                        type="button"

                                                                ? 'bg-blue-600 text-white border-blue-700 shadow-sm'
                                                                : 'bg-gray-50 text-gray-700 border-gray-200 hover:bg-gray-100'
                                                        }`}

                                                            </span>
                                                        )}
                                                    </button>
                                                );

                                    </section>

                                        <span className="text-[13px] font-bold text-gray-600">

                                            {activeItems.map((item, idx) => (
                                                <div key={item.id || idx} className="py-2 flex items-center justify-between gap-2 text-[14px]">

                                                        {item.product}
                                                    </div>
                                                    <div className="flex items-center gap-2.5 shrink-0">
                                                        <span className={`font-extrabold ${item.qty > 1 ? 'text-red-600 text-[15px]' : 'text-gray-600'}`}>

                                                        <span className="font-extrabold text-gray-900 w-[78px] text-right tabular-nums text-[15px]">
                                                            {Number(item.price).toLocaleString()}원
                                                        </span>
                                                    </div>
                                                </div>

                                                </div>
                                            ))}
                                        </div>

                                            <span className="font-semibold">상품 합계</span>
                                            <span className="font-bold text-gray-900 tabular-nums">{productTotal.toLocaleString()}원</span>
                                        </div>
                                        <div className="flex justify-between text-gray-600">
                                            <span className="font-semibold">
                                                배송비

                                            </span>
                                            <span className="font-bold text-gray-900 tabular-nums">
                                                {shippingFee === 0 ? "0원" : `${shippingFee.toLocaleString()}원`}
                                            </span>
                                        </div>
                                        <div className="flex justify-between items-center pt-2 border-t border-gray-200">
                                            <span className="font-extrabold text-gray-900 text-[15px]">총 주문금액</span>
                                            <span className="font-black text-[18px] text-blue-600 tabular-nums">
                                                {baseGrandTotal.toLocaleString()}원
                                            </span>
                                        </div>
                                    </div>
                                </section>

                                {/* 2. 입금 내역 및 계좌 안내 */}
                                <section className="bg-white rounded-lg p-3.5 border border-gray-200 shadow-sm space-y-2.5">
                                    <button
                                        type="button"
                                        onClick={() => setIsDepositHistoryOpen(prev => !prev)}

                                    >
                                        <span className="text-[14px] font-extrabold text-gray-900">입금 내역</span>
                                        <span className="text-[13px] font-bold text-gray-600 flex items-center gap-1 hover:text-gray-900">
                                            <span>누적 {depositTotal.toLocaleString()}원</span>
                                            <Icon name={isDepositHistoryOpen ? "caret-up" : "caret-down"} weight="bold" size={14} className="text-gray-500" />
                                        </span>
                                    </button>

                                    {isDepositHistoryOpen && (
                                        depositsHistory.length === 0 ? (
                                            <div className="py-2 text-[13px] text-gray-400 text-center">

                                            </div>

                                                    <div key={d.id || index} className="py-2.5 flex items-center justify-between gap-2 text-[14px]">
                                                        <div className="flex items-center gap-2 min-w-0 flex-wrap">

                                                                    <span>{formatKstDateString(d.time)}</span>

                                                        <span className="font-extrabold text-gray-900 tabular-nums shrink-0 text-[15px]">
                                                            {Number(d.amount).toLocaleString()}원
                                                        </span>
                                                    </div>

                                            </div>

                                        <div className="bg-red-50 border border-red-200 rounded-lg p-3 space-y-2.5">

                                                </div>
                                                <button 
                                                    type="button"

                                                >
                                                    <Icon name="copy" weight="bold" size={14} /> 계좌복사

                                            </div>
                                        </div>

                                            <Icon name="check-circle" weight="fill" size={18} />

                                            <span className="text-[16px] font-black text-blue-600">+{Math.abs(finalBalance).toLocaleString()}원</span>
                                        </div>

                                        <div className="bg-teal-50 border border-teal-200 rounded-lg overflow-hidden">

                                                onClick={() => setIsCreditHistoryOpen(prev => !prev)}

                                                    <span className="flex items-center gap-1">

                                                            <span className="text-[11px] font-bold text-teal-600 underline ml-1">

                                                            </span>
                                                        )}
                                                    </span>
                                                    {customerCreditUpdatedAt && (
                                                        <span className="text-[11px] font-semibold text-teal-600 mt-0.5">
                                                            최근 업데이트: {customerCreditUpdatedAt}
                                                        </span>
                                                    )}
                                                </div>
                                                <span className="text-[16px] font-black text-teal-700 tabular-nums shrink-0">
                                                    {customerCredit.toLocaleString()}원
                                                </span>
                                            </button>

                                            {usedCreditInCurrentOrder > 0 && (

                                                    <span className="tabular-nums">-{usedCreditInCurrentOrder.toLocaleString()}원</span>
                                                </div>
                                            )}

                                            {isCreditHistoryOpen && customerCreditLogs.length > 0 && (
                                                <div className="p-2.5 bg-white border-t border-teal-200 divide-y divide-gray-100 space-y-1.5">

                                                                <div className="font-bold text-gray-800 truncate">{lg.reason || '적립금 변동'}</div>

                                                            </div>
                                                            <div className="text-right shrink-0">
                                                                <div className={`font-extrabold tabular-nums ${Number(lg.diff) >= 0 ? 'text-teal-600' : 'text-rose-600'}`}>

                                                                </div>
                                                                <div className="text-[10.5px] text-gray-400 tabular-nums">잔액 {Number(lg.balance || 0).toLocaleString()}원</div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    )}

                                        <div className={`${isCardPaid ? 'bg-purple-50 border-purple-300' : 'bg-amber-50 border-amber-300'} border rounded-lg p-3.5 space-y-2 text-[14px]`}>
                                            <div className="flex items-center justify-between pb-2 border-b border-black/10">
                                                <span className={`font-extrabold text-[14px] flex items-center gap-1.5 ${isCardPaid ? 'text-purple-900' : 'text-amber-900'}`}>

                                                <span className={`text-[11.5px] font-extrabold px-2 py-0.5 rounded ${isCardPaid ? 'bg-purple-600 text-white' : 'bg-amber-500 text-white'}`}>

                                            <div className="flex justify-between items-center text-gray-700 font-semibold pt-0.5">
                                                <span>총 주문금액</span>

                                            </div>

                                                <div className="flex justify-between items-center text-gray-700 font-semibold">

                                                <span className="font-extrabold text-gray-900 tabular-nums">{Math.max(0, rawBalance).toLocaleString()}원</span>
                                            </div>
                                            <div className={`flex justify-between items-center font-bold ${isCardPaid ? 'text-purple-700' : 'text-amber-800'}`}>
                                                <span>카드 수수료 (+{cardFeeRate}%)</span>
                                                <span className="tabular-nums">+{cardFee.toLocaleString()}원</span>
                                            </div>
                                            <div className={`flex justify-between items-center pt-2 border-t font-extrabold ${isCardPaid ? 'border-purple-300 text-purple-900' : 'border-amber-300 text-amber-900'}`}>
                                                <span className="text-[15px]">{isCardPaid ? '최종 카드결제 완료금액' : '최종 카드결제 요청금액'}</span>
                                                <span className={`text-[18px] font-black tabular-nums ${isCardPaid ? 'text-purple-700' : 'text-amber-700'}`}>{Math.max(0, finalBalance).toLocaleString()}원</span>
                                            </div>
                                        </div>
                                    )}
                                </section>

                                {/* 3. 배송지 확인 및 입력 */}
