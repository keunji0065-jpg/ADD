<!DOCTYPE html>
<html lang="ko" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>EMBER 공식 주문확인 & 배송지 센터</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web" crossorigin="anonymous"></script>
    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&display=swap" rel="stylesheet">
    <style>
        html {
            font-size: 14px;
            -webkit-text-size-adjust: 100%;
        }
        body { 
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; 
            background-color: #eef0f4; 
            font-size: 12.5px;
            line-height: 1.45;
            letter-spacing: -0.02em;
            margin: 0;
            padding: 0;
        }
        .ember-logo {
            font-family: 'Cormorant Garamond', 'Georgia', serif;
            letter-spacing: 0.3em;
        }
        .animate-fade-in { animation: fadeIn 0.15s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="text-slate-900 selection:bg-blue-700 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const Icon = ({ name, className = "", weight = "regular", size = 15 }) => (
            <i className={`ph ph-${name} ${className}`} data-phosphor-icon-weight={weight} style={{ fontSize: size }}></i>
        );

        // 개인정보 마스킹 함수 (보안 철저 적용)
        const maskName = (name) => {
            if (!name) return '';
            if (name.length <= 2) return name[0] + '*';
            return name[0] + '*'.repeat(name.length - 2) + name[name.length - 1];
        };

        const maskPhone = (phone) => {
            if (!phone) return '';
            const clean = String(phone).replace(/[^0-9]/g, '');
            if (clean.length < 8) return phone;
            return `${clean.slice(0, 3)}-****-${clean.slice(-4)}`;
        };

        const maskDetailAddress = (detail) => {
            if (!detail) return '***';
            // 상세주소의 동·호수 등 숫자를 모두 *로 마스킹 처리하여 개인정보 완벽 보호
            const masked = String(detail).replace(/[0-9]/g, '*');
            return masked === detail ? detail.slice(0, 2) + '***' : masked;
        };

        // 테스트용 샘플 데이터베이스
        const INITIAL_MOCK_DB = {
            "강은지팬-krl": {
                nickname: "강은지팬-krl",
                phoneLast4: "5678",
                broadcastName: "10/18 여성복",
                isVip: true,
                isManager: false,
                freeShippingThreshold: 200000,
                isCard: false,
                shipping: 0,
                depositTotal: 74000,
                deposits: [
                    { id: "d1", time: "21:15", name: "김선정", amount: 45000 },
                    { id: "d2", time: "21:42", name: "김선정", amount: 29000 }
                ],
                items: [
                    { id: 1, product: "11번 프리미엄 캐시미어 니트 베이지 55", qty: 1, price: 45000, isWaitlist: false },
                    { id: 2, product: "15번 세미 와이드 슬랙스 블랙 S", qty: 1, price: 29000, isWaitlist: false },
                    { id: 10, product: "19번 실크 스카프 버건디 F", qty: 1, price: 18000, isWaitlist: true }
                ],
                address: {
                    realname: "김선정",
                    phone: "01012345678",
                    zipcode: "61945",
                    baseAddress: "광주광역시 서구 상무중앙로 110",
                    detailAddress: "스타타워 101동 1204호",
                    memo: "문 앞에 놓아주세요"
                }
            },
            "멋쟁이토마토-a2b": {
                nickname: "멋쟁이토마토-a2b",
                phoneLast4: "1234",
                broadcastName: "10/18 여성복",
                isVip: false,
                isManager: false,
                freeShippingThreshold: 200000,
                isCard: false,
                shipping: 4000,
                depositTotal: 50000,
                deposits: [
                    { id: "d3", time: "20:50", name: "이영희", amount: 30000 },
                    { id: "d4", time: "21:30", name: "이영희", amount: 20000 }
                ],
                items: [
                    { id: 3, product: "04번 앙고라 가디건 핑크 F", qty: 1, price: 38000, isWaitlist: false },
                    { id: 4, product: "08번 울 체크 스커트 브라운 M", qty: 2, price: 52000, isWaitlist: false },
                    { id: 5, product: "12번 핸드메이드 코트 오트밀 55", qty: 1, price: 129000, isWaitlist: true }
                ],
                address: {
                    realname: "이영희",
                    phone: "01098761234",
                    zipcode: "06035",
                    baseAddress: "서울특별시 강남구 가로수길 5",
                    detailAddress: "현대아파트 203동 501호",
                    memo: "경비실에 맡겨주세요"
                }
            },
            "깔로-krl": {
                nickname: "깔로-krl",
                phoneLast4: "0000",
                broadcastName: "10/18 여성복",
                isVip: false,
                isManager: false,
                freeShippingThreshold: 200000,
                isCard: false,
                shipping: 4000,
                depositTotal: 0,
                deposits: [],
                items: [
                    { id: 6, product: "21번 기모 맨투맨 아이보리 F", qty: 1, price: 25000, isWaitlist: false }
                ],
                address: null
            }
        };

        // 유튜브 핸들(예: @깔로-krl)이나 앞부분 닉네임('깔로')으로 검색해도 전체 닉네임('깔로-krl') 데이터를 찾아주는 도우미
        const cleanYoutubeHandle = (raw) => {
            if (!raw) return '';
            let s = String(raw).trim().replace(/^@+/, '');
            s = s.replace(/-[a-zA-Z0-9]{2,6}$/, '');
            return s.trim();
        };

        const CustomerPortalApp = () => {
            const [mockDb, setMockDb] = useState(INITIAL_MOCK_DB);
            const [loginNick, setLoginNick] = useState('');
            const [loginPhone4, setLoginPhone4] = useState('');
            const [currentUser, setCurrentUser] = useState(null);
            const [errorMsg, setErrorMsg] = useState('');
            const [toastMsg, setToastMsg] = useState('');

            const [isOrderConfirmedByCustomer, setIsOrderConfirmedByCustomer] = useState(false);
            const [showFanfareModal, setShowFanfareModal] = useState(false);
            const [isRefreshing, setIsRefreshing] = useState(false);
            const [lastUpdatedTime, setLastUpdatedTime] = useState('');
            const [demoAddedCount, setDemoAddedCount] = useState(0);

            const [isEditingAddress, setIsEditingAddress] = useState(false);
            const [addrForm, setAddrForm] = useState({
                realname: '',
                phone: '',
                zipcode: '',
                baseAddress: '',
                detailAddress: '',
                memo: '',
                agreePrivacy: false
            });

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 2400);
            };

            const getNowTimeStr = () => new Date().toLocaleTimeString('ko-KR', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });

            const handleLogin = (e, presetNick = null, presetPhone4 = null) => {
                if (e) e.preventDefault();
                setErrorMsg('');

                const rawNick = (presetNick !== null ? presetNick : loginNick).trim().replace(/^@+/, '');
                const baseNick = cleanYoutubeHandle(rawNick);
                const inputLast4 = (presetPhone4 !== null ? presetPhone4 : loginPhone4).trim();

                if (!rawNick) {
                    setErrorMsg('유튜브 닉네임을 입력해 주세요.');
                    return;
                }
                if (inputLast4.length !== 4) {
                    setErrorMsg('연락처 뒷 4자리(비밀번호)를 정확히 입력해 주세요.');
                    return;
                }

                // 고객이 '깔로'만 쳐도, '깔로-krl' 전체를 쳐도 DB에서 정확히 매칭하여 전체 닉네임('깔로-krl')을 불러옴
                const matchedKey = Object.keys(mockDb).find(k => k === rawNick || cleanYoutubeHandle(k) === baseNick);
                const found = matchedKey ? mockDb[matchedKey] : null;

                if (!found) {
                    setErrorMsg(`'${rawNick}' 님의 주문 내역이 없습니다. 닉네임을 다시 확인해 주세요.`);
                    return;
                }

                if (found.phoneLast4 !== inputLast4) {
                    setErrorMsg('연락처 뒷 4자리(비밀번호)가 일치하지 않습니다. 첫 구매 고객님은 아래 카톡 채널로 번호를 먼저 남겨주세요.');
                    return;
                }

                setCurrentUser({ ...found });
                setIsOrderConfirmedByCustomer(false);
                setLastUpdatedTime(getNowTimeStr());
                if (!found.address) {
                    setIsEditingAddress(true);
                }
            };

            const handleUnifiedRefresh = (simulateNewOrder = false) => {
                if (!currentUser || isRefreshing) return;
                setIsRefreshing(true);

                setTimeout(() => {
                    let latestUser = { ...mockDb[currentUser.nickname] };

                    if (simulateNewOrder) {
                        const nextCount = demoAddedCount + 1;
                        setDemoAddedCount(nextCount);
                        const newItem = {
                            id: Date.now(),
                            product: `[추가] ${30 + nextCount}번 캐시미어 머플러 차콜 F`,
                            qty: 1,
                            price: 19000,
                            isWaitlist: false
                        };
                        latestUser = {
                            ...currentUser,
                            items: [...currentUser.items, newItem]
                        };
                        setMockDb(prev => ({ ...prev, [currentUser.nickname]: latestUser }));
                        setIsOrderConfirmedByCustomer(false);
                        showToast("추가 주문 내역과 결제금액이 업데이트되었습니다.");
                    } else {
                        showToast("최신 주문 품목 및 입금 현황을 불러왔습니다.");
                    }

                    setCurrentUser(latestUser);
                    setLastUpdatedTime(getNowTimeStr());
                    setIsRefreshing(false);
                }, 300);
            };

            const handleCopyText = (text, label) => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast(`${label} 복사되었습니다.`);
                } catch (err) {}
                document.body.removeChild(textArea);
            };

            const openAddressEditor = () => {
                setAddrForm({
                    realname: '',
                    phone: '',
                    zipcode: '',
                    baseAddress: '',
                    detailAddress: '',
                    memo: currentUser?.address?.memo || '',
                    agreePrivacy: false
                });
                setIsEditingAddress(true);
            };

            const handlePostcodeSearch = () => {
                try {
                    new window.daum.Postcode({
                        oncomplete: function(data) {
                            let fullAddr = data.address;
                            let extraAddr = '';
                            if (data.addressType === 'R') {
                                if (data.bname !== '') extraAddr += data.bname;
                                if (data.buildingName !== '') extraAddr += (extraAddr !== '' ? ', ' + data.buildingName : data.buildingName);
                                if (extraAddr !== '') fullAddr += ' (' + extraAddr + ')';
                            }
                            setAddrForm(prev => ({ ...prev, zipcode: data.zonecode, baseAddress: fullAddr }));
                        }
                    }).open();
                } catch (e) {
                    showToast("주소 검색 창을 불러오지 못했습니다.");
                }
            };

            const handleSaveAddress = (e) => {
                e.preventDefault();
                if (!addrForm.realname.trim()) return showToast("수령인 성함을 입력해 주세요.");
                const cleanPhone = addrForm.phone.replace(/[^0-9]/g, '');
                if (cleanPhone.length < 10) return showToast("올바른 휴대폰 번호를 입력해 주세요.");
                if (!addrForm.baseAddress.trim()) return showToast("우편번호 검색을 진행해 주세요.");
                if (!addrForm.agreePrivacy) {
                    return showToast("개인정보 수집 및 제3자 제공 동의에 체크해 주세요.");
                }

                const newAddrObj = {
                    realname: addrForm.realname.trim(),
                    phone: cleanPhone,
                    zipcode: addrForm.zipcode,
                    baseAddress: addrForm.baseAddress,
                    detailAddress: addrForm.detailAddress.trim(),
                    memo: addrForm.memo.trim()
                };

                const updatedUser = {
                    ...currentUser,
                    phoneLast4: cleanPhone.slice(-4),
                    address: newAddrObj
                };

                setCurrentUser(updatedUser);
                setMockDb(prev => ({ ...prev, [currentUser.nickname]: updatedUser }));
                setIsEditingAddress(false);
                setLastUpdatedTime(getNowTimeStr());
                showToast("배송지가 저장되어 주문서에 즉시 반영되었습니다.");
            };

            const handleConfirmOrder = () => {
                if (!currentUser.address) {
                    showToast("먼저 배송지를 입력 및 저장해 주세요.");
                    setIsEditingAddress(true);
                    return;
                }
                setIsOrderConfirmedByCustomer(true);
                setShowFanfareModal(true);

                // 팡파레(꽃가루) 애니메이션 실행
                if (window.confetti) {
                    window.confetti({
                        particleCount: 90,
                        spread: 70,
                        origin: { y: 0.6 }
                    });
                    setTimeout(() => {
                        window.confetti({
                            particleCount: 60,
                            angle: 60,
                            spread: 55,
                            origin: { x: 0 }
                        });
                        window.confetti({
                            particleCount: 60,
                            angle: 120,
                            spread: 55,
                            origin: { x: 1 }
                        });
                    }, 200);
                }

                // 2.2초 후 자동으로 창 닫기 (처음 화면으로 안전하게 로그아웃 처리)
                setTimeout(() => {
                    setShowFanfareModal(false);
                    setCurrentUser(null);
                    setIsEditingAddress(false);
                    setLoginNick('');
                    setLoginPhone4('');
                    try { window.close(); } catch (e) {}
                }, 2200);
            };

            const calcSummary = () => {
                if (!currentUser) return null;
                const activeItems = currentUser.items.filter(i => !i.isWaitlist);
                const waitlistItems = currentUser.items.filter(i => i.isWaitlist);
                const productTotal = activeItems.reduce((sum, i) => sum + i.price, 0);
                const threshold = currentUser.freeShippingThreshold || 200000;
                const isFreeByAmount = threshold > 0 && productTotal >= threshold;
                const shipping = (currentUser.isVip || currentUser.isManager || isFreeByAmount) ? 0 : currentUser.shipping;
                const grandTotal = productTotal + (activeItems.length > 0 ? shipping : 0);
                const depositsList = currentUser.deposits || [];
                const depositTotal = depositsList.length > 0 
                    ? depositsList.reduce((sum, d) => sum + Number(d.amount), 0) 
                    : (currentUser.depositTotal || 0);
                const balance = grandTotal - depositTotal;
                const isPaid = balance <= 0 && activeItems.length > 0;
                return { activeItems, waitlistItems, productTotal, shipping, grandTotal, depositTotal, depositsList, balance, isPaid, threshold, isFreeByAmount };
            };

            const summary = calcSummary();

            return (
                <div className="min-h-screen w-full flex flex-col items-center justify-start sm:py-3">
                    {/* 스마트폰 전용 프레임 컨테이너: 불필요한 여백을 줄인 375px 표준 모바일 폭 */}
                    <div className="w-full max-w-[375px] min-h-screen sm:min-h-[680px] bg-[#f1f3f7] sm:rounded-lg sm:shadow-xl sm:border sm:border-slate-300 overflow-hidden flex flex-col pb-6 relative">
                        
                        {/* 상단 토스트 알림 */}
                        {toastMsg && (
                            <div className="fixed top-12 left-1/2 -translate-x-1/2 z-50 bg-[#0a0a0a] text-white text-[12px] font-bold px-3.5 py-2 rounded shadow-lg border border-neutral-700 flex items-center gap-1.5 animate-fade-in whitespace-nowrap">
                                <Icon name="check-circle" weight="fill" className="text-blue-400" size={14} />
                                <span>{toastMsg}</span>
                            </div>
                        )}

                        {/* 주문 확정 팡파레 모달 (자동 닫힘) */}
                        {showFanfareModal && (
                            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-[2px] flex items-center justify-center p-4 animate-fade-in">
                                <div className="bg-white rounded-xl border-2 border-[#1d4ed8] shadow-2xl p-6 w-full max-w-[320px] text-center space-y-3">
                                    <div className="w-14 h-14 rounded-full bg-blue-50 text-[#1d4ed8] mx-auto flex items-center justify-center border border-blue-200 shadow-inner">
                                        <Icon name="confetti" weight="fill" size={32} />
                                    </div>
                                    <div className="space-y-1">
                                        <div className="text-[11px] font-extrabold text-[#1d4ed8] tracking-widest uppercase">ORDER CONFIRMED</div>
                                        <h3 className="text-[18px] font-black text-slate-900">주문확정 완료! 🎉</h3>
                                        <p className="text-[12.5px] text-slate-600 leading-snug pt-1">
                                            <strong className="text-slate-900">{currentUser?.nickname}</strong> 님의 주문과 배송지 확인이<br/>정상적으로 접수되었습니다. 감사합니다!
                                        </p>
                                    </div>
                                    <div className="pt-2">
                                        <div className="text-[11px] text-slate-400 mb-2">잠시 후 창이 자동으로 닫힙니다...</div>
                                        <button
                                            type="button"
                                            onClick={() => {
                                                setShowFanfareModal(false);
                                                setCurrentUser(null);
                                                setIsEditingAddress(false);
                                                setLoginNick('');
                                                setLoginPhone4('');
                                                try { window.close(); } catch (e) {}
                                            }}
                                            className="w-full bg-[#0a0a0a] text-white font-bold py-2 rounded text-[12px]"
                                        >
                                            지금 바로 닫기
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 1. 최상단 EMBER 공식 블랙 시그니처 헤더 */}
                        <header className="w-full bg-[#0a0a0a] text-white shadow-sm sticky top-0 z-40">
                            <div className="px-3 h-11 flex items-center justify-between">
                                <div className="w-20 flex items-center">
                                    {currentUser && (
                                        <button 
                                            type="button"
                                            onClick={() => { setCurrentUser(null); setIsEditingAddress(false); }}
                                            className="text-[11px] font-bold text-neutral-200 hover:text-white flex items-center gap-1 py-1 px-2 rounded bg-neutral-900 border border-neutral-700 transition-colors"
                                        >
                                            <Icon name="arrow-left" weight="bold" size={11} /> 처음으로
                                        </button>
                                    )}
                                </div>

                                <div className="flex items-center justify-center">
                                    <span className="ember-logo text-[17px] font-bold text-white pl-1">EMBER</span>
                                </div>

                                <div className="w-20 flex items-center justify-end">
                                    <Icon name="lock-simple" className="text-neutral-400" size={14} />
                                </div>
                            </div>
                        </header>

                        <div className="w-full px-2.5 pt-2.5 space-y-2 flex-1">
                            {/* 사장님 테스트용 프리셋 바 */}
                            <div className="bg-neutral-900 text-neutral-200 rounded p-2 shadow-sm border border-neutral-800">
                                <div className="flex items-center justify-between mb-1.5">
                                    <span className="text-[11px] font-bold text-blue-400 flex items-center gap-1">
                                        <Icon name="device-mobile" weight="bold" size={12} /> 사장님 화면 테스트 버튼
                                    </span>
                                    <span className="text-[10px] bg-neutral-800 px-1.5 py-0.5 rounded text-neutral-400">실제 고객 비노출</span>
                                </div>
                                <div className="grid grid-cols-3 gap-1">
                                    <button onClick={() => { setLoginNick('강은지팬'); setLoginPhone4('5678'); handleLogin(null, '강은지팬', '5678'); }} className="bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 rounded py-1 px-1 text-[11px] font-bold text-white transition-all text-center leading-tight">
                                        ① 완납+VIP<br/><span className="text-[10px] text-blue-400 font-normal">강은지팬-krl</span>
                                    </button>
                                    <button onClick={() => { setLoginNick('멋쟁이토마토'); setLoginPhone4('1234'); handleLogin(null, '멋쟁이토마토', '1234'); }} className="bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 rounded py-1 px-1 text-[11px] font-bold text-white transition-all text-center leading-tight">
                                        ② 미납+대기<br/><span className="text-[10px] text-amber-300 font-normal">멋쟁이-a2b</span>
                                    </button>
                                    <button onClick={() => { setLoginNick('깔로'); setLoginPhone4('0000'); handleLogin(null, '깔로', '0000'); }} className="bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 rounded py-1 px-1 text-[11px] font-bold text-white transition-all text-center leading-tight">

                                        <button 
                                            type="button"
                                            onClick={() => handleUnifiedRefresh(true)}
                                            className="bg-[#1d4ed8] hover:bg-[#1e40af] text-white text-[11px] font-bold px-2 py-0.5 rounded transition-all shrink-0"

                                        </button>
                                    </div>
                                )}
                            </div>

                                <main className="bg-white rounded border border-slate-200 p-3.5 animate-fade-in space-y-3.5 shadow-sm">

                                        <p className="text-[11.5px] text-slate-600 mt-1 font-medium leading-snug flex items-start gap-1">
                                            <Icon name="shield-check" weight="fill" className="text-[#1d4ed8] shrink-0 mt-0.5" size={14} />
                                            <span>개인정보보호법에 의거하여 고객님의 소중한 정보는 암호화 보호되며, 본인 인증 후에만 안전하게 열람됩니다.</span>
                                        </p>
                                    </div>

                                    <form onSubmit={(e) => handleLogin(e)} className="space-y-3">
                                        <div>
                                            <label className="block text-[12px] font-bold text-slate-800 mb-1">

                                            </label>
                                            <div className="relative">
                                                <Icon name="user" className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400" size={14} />
                                                <input 
                                                    type="text" 
                                                    value={loginNick}
                                                    onChange={(e) => setLoginNick(e.target.value)}
                                                    placeholder="예) @깔로-k3j ➔ 깔로 입력"
                                                    className="w-full pl-8 pr-3 py-2 rounded border border-slate-300 text-[12.5px] font-bold text-slate-900 placeholder:text-slate-400 placeholder:font-normal focus:ring-1 focus:ring-[#1d4ed8] focus:border-[#1d4ed8] outline-none"
                                                />
                                            </div>
                                        </div>

                                            <label className="block text-[12px] font-bold text-slate-800 mb-1">

                                            </label>
                                            <div className="relative">
                                                <Icon name="lock-key" className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400" size={14} />
                                                <input 
                                                    type="password" 
                                                    inputMode="numeric"
                                                    maxLength={4}
                                                    value={loginPhone4}
                                                    onChange={(e) => setLoginPhone4(e.target.value.replace(/[^0-9]/g, ''))}
                                                    placeholder="휴대폰 뒷 4자리 입력 (예: 5678)"
                                                    className="w-full pl-8 pr-3 py-2 rounded border border-slate-300 text-[12.5px] font-bold text-slate-900 placeholder:text-slate-400 placeholder:font-normal placeholder:tracking-normal tracking-widest focus:ring-1 focus:ring-[#1d4ed8] focus:border-[#1d4ed8] outline-none"
                                                />
                                            </div>
                                        </div>

                                        {errorMsg && (
                                            <div className="p-2.5 rounded bg-red-50 border border-red-200 text-red-700 text-[11.5px] font-bold flex items-start gap-1.5 leading-snug">
                                                <Icon name="warning-circle" weight="fill" size={14} className="shrink-0 mt-0.5 text-red-600" />
                                                <span>{errorMsg}</span>
                                            </div>
                                        )}

                                        <button 
                                            type="submit"
                                            className="w-full bg-[#1d4ed8] hover:bg-[#1e40af] text-white font-bold py-2.5 rounded shadow-sm transition-colors flex items-center justify-center gap-1.5 text-[13px]"
                                        >
                                            <span>주문서 조회하기</span>
                                            <Icon name="arrow-right" weight="bold" size={14} />
                                        </button>
                                    </form>

                                    <div className="pt-2.5 border-t border-slate-100">
                                        <div className="bg-slate-50 border border-slate-200 rounded p-2.5 space-y-2">
                                            <div className="text-[11.5px] text-slate-700 text-center leading-snug">
                                                <strong className="text-slate-900 font-bold">첫구매 고객이나 주문서가 열리지 않는 분은</strong><br/>
                                                카톡 채널에 <strong className="text-[#1d4ed8] font-bold">[닉네임 / 연락처 뒷 4자리]</strong>를 남겨주세요.
                                            </div>
                                            <a 
                                                href="#kakao-channel"
                                                onClick={(e) => { e.preventDefault(); showToast("엠버 공식 카카오톡 채널로 이동합니다."); }}
                                                className="w-full bg-[#FEE500] hover:bg-[#fada0a] text-neutral-900 font-bold py-2 px-3 rounded transition-all text-[12px] flex items-center justify-center gap-1.5 border border-[#e5ce00]"
                                            >
                                                <Icon name="chat-circle-dots" weight="fill" size={15} className="text-neutral-900" />
                                                <span>엠버언니 채널 연락하기</span>
                                            </a>
                                        </div>
                                    </div>
                                </main>
                            ) : (
                                /* 3. 로그인 완료 후: 불필요한 문구를 덜어내고 구획별로 깔끔히 나눈 영수증 스타일 */
                                <main className="space-y-2 animate-fade-in">
                                    
                                    {/* 구획 1: 주문자 & 새로고침 */}
                                    <section className="bg-white rounded border border-slate-300 px-3 py-2 flex items-center justify-between gap-2 shadow-sm">
                                        <div className="flex items-center gap-1.5 flex-wrap min-w-0">
                                            <h2 className="text-[14px] font-extrabold text-slate-900 truncate">
                                                {currentUser.nickname} 님
                                            </h2>
                                            {currentUser.isVip && (
                                                <span className="text-[10.5px] font-bold bg-blue-50 text-[#1d4ed8] border border-blue-200 px-1.5 py-0.5 rounded">
                                                    VIP 무료배송
                                                </span>
                                            )}
                                            {currentUser.isManager && (
                                                <span className="text-[10.5px] font-bold bg-blue-50 text-[#1d4ed8] border border-blue-200 px-1.5 py-0.5 rounded">
                                                    관리자 무료배송
                                                </span>
                                            )}
                                            {!currentUser.isVip && !currentUser.isManager && summary.isFreeByAmount && (
                                                <span className="text-[10.5px] font-bold bg-blue-50 text-[#1d4ed8] border border-blue-200 px-1.5 py-0.5 rounded">
                                                    {(summary.threshold / 10000).toLocaleString()}만원이상 무료배송
                                                </span>
                                            )}
                                        </div>

                                        <button 
                                            type="button"
                                            onClick={() => handleUnifiedRefresh(false)}

                                            <Icon name="arrows-clockwise" weight="bold" size={12} className={isRefreshing ? "animate-spin" : ""} />
                                            <span>새로고침</span>
                                        </button>
                                    </section>

                                        <div className="bg-slate-100 border-b border-slate-200 px-3 py-1.5 flex items-center justify-between">

                                                {currentUser.broadcastName} 주문목록

                                            <span className="text-[11.5px] font-bold text-slate-700">
                                                {summary.activeItems.length}품목 / 총수량 {summary.activeItems.reduce((s, i) => s + i.qty, 0)}개
                                            </span>
                                        </div>

                                        <div className="px-3 divide-y divide-slate-100">
                                            {summary.activeItems.map((item) => (
                                                <div key={item.id} className="py-1.5 flex items-center justify-between gap-2 text-[12.5px]">
                                                    <div className="font-medium text-slate-800 flex-1 min-w-0 leading-snug">
                                                        {item.product}
                                                    </div>
                                                    <div className="flex items-center gap-2 shrink-0">

                                                            {item.qty}개
                                                        </span>
                                                        <span className="font-bold text-slate-900 tabular-nums min-w-[60px] text-right">
                                                            {item.price.toLocaleString()}원
                                                        </span>
                                                    </div>
                                                </div>

                                                <span>상품 합계</span>
                                                <span className="tabular-nums">{summary.productTotal.toLocaleString()}원</span>

                                                <span>배송비</span>
                                                <span className="tabular-nums">
                                                    {summary.shipping === 0 ? '0원' : `${summary.shipping.toLocaleString()}원`}

                                            <div className="flex justify-between items-center pt-1 mt-1 border-t border-slate-200 text-[13.5px] font-extrabold text-slate-900">

                                                <span className="text-[#1d4ed8] tabular-nums">
                                                    {summary.grandTotal.toLocaleString()}원
                                                </span>
                                            </div>
                                        </div>

                                        {summary.waitlistItems.length > 0 && (
                                            <div className="border-t border-slate-200 px-3 py-1.5 bg-amber-50/50 text-[12px]">
                                                <div className="font-bold text-amber-900 mb-0.5">
                                                    품절 대기 ({summary.waitlistItems.length}건 · 결제제외)
                                                </div>
                                                {summary.waitlistItems.map((item) => (
                                                    <div key={item.id} className="py-0.5 flex justify-between text-slate-600">
                                                        <span className="truncate pr-2">{item.product}</span>
                                                        <span className="shrink-0">{item.qty}개</span>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </section>

                                    {/* 구획 3: 입금 및 결제 내역 */}

                                        <div className="bg-slate-100 border-b border-slate-200 px-3 py-1.5 flex items-center justify-between">
                                            <h3 className="text-[12.5px] font-extrabold text-slate-900">
                                                입금 내역
                                            </h3>
                                            <span className="text-[11.5px] font-bold text-slate-600 tabular-nums">
                                                누적 {summary.depositTotal.toLocaleString()}원
                                            </span>
                                        </div>

                                        <div className="px-3 py-2 space-y-2 text-[12.5px]">
                                            {summary.depositsList.length > 0 && (
                                                <div className="divide-y divide-slate-100 border-b border-dashed border-slate-300 pb-1.5">
                                                    {summary.depositsList.map((dep, idx) => (
                                                        <div key={dep.id || idx} className="py-1 flex justify-between items-center text-[12px]">
                                                            <span className="text-slate-600 tabular-nums">
                                                                {dep.time} 입금 ({dep.name})
                                                            </span>
                                                            <span className="font-bold text-slate-900 tabular-nums">
                                                                {Number(dep.amount).toLocaleString()}원
                                                            </span>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}

                                            {summary.balance > 0 ? (
                                                <div className="bg-red-50 border-2 border-red-500 rounded p-2.5 space-y-2">
                                                    <div className="flex justify-between items-center">
                                                        <span className="text-[13px] font-extrabold text-red-700">미납 금액 (입금하실 금액)</span>
                                                        <span className="text-[17px] font-black text-red-600 tabular-nums">
                                                            {summary.balance.toLocaleString()}원
                                                        </span>
                                                    </div>
                                                    <div className="flex items-center justify-between bg-white px-2.5 py-1.5 rounded border border-red-200 text-[12px]">
                                                        <div>
                                                            <span className="text-slate-600 mr-1">카카오뱅크</span>
                                                            <strong className="text-slate-900 font-extrabold tabular-nums">7942 32 84990</strong>
                                                            <span className="text-slate-600 ml-1">(김선정)</span>
                                                        </div>
                                                        <button 
                                                            type="button"
                                                            onClick={() => handleCopyText("79423284990", "계좌번호가")}
                                                            className="bg-red-600 hover:bg-red-700 text-white text-[11px] font-bold px-2 py-0.5 rounded shrink-0"
                                                        >
                                                            복사
                                                        </button>
                                                    </div>
                                                </div>
                                            ) : summary.balance < 0 ? (
                                                <div className="bg-blue-50 border-2 border-[#1d4ed8] rounded p-2.5 flex justify-between items-center">
                                                    <span className="text-[13px] font-extrabold text-[#1d4ed8]">과납 금액</span>
                                                    <span className="text-[15px] font-black text-[#1d4ed8] tabular-nums">
                                                        +{Math.abs(summary.balance).toLocaleString()}원
                                                    </span>
                                                </div>
                                            ) : (
                                                <div className="bg-blue-50 border-2 border-[#1d4ed8] rounded py-2 px-3 text-center">
                                                    <span className="text-[13.5px] font-black text-[#1d4ed8]">
                                                        입금완료(완납)
                                                    </span>
                                                </div>
                                            )}
                                        </div>
                                    </section>

                                    {/* 구획 4: 배송지 */}
                                    <section className="bg-white rounded border border-slate-300 shadow-sm overflow-hidden">
                                        <div className="bg-slate-100 border-b border-slate-200 px-3 py-1.5 flex items-center justify-between">
                                            <h3 className="text-[12.5px] font-extrabold text-slate-900">

                                            {currentUser.address && !isEditingAddress && (
                                                <button 
                                                    type="button"
                                                    onClick={openAddressEditor}
                                                    className="text-[11px] font-bold text-slate-700 bg-white border border-slate-300 hover:bg-slate-50 px-2 py-0.5 rounded"
                                                >
                                                    변경
                                                </button>
                                            )}
                                        </div>

                                        <div className="px-3 py-2">
                                            {!isEditingAddress && currentUser.address ? (
                                                <div className="space-y-0.5 text-[12.5px] text-slate-800 leading-snug">
                                                    <div className="font-bold text-slate-900">
                                                        {maskName(currentUser.address.realname)} · <span className="tabular-nums font-semibold">{maskPhone(currentUser.address.phone)}</span>

                                                    <div>
                                                        ({currentUser.address.zipcode}) {currentUser.address.baseAddress} {maskDetailAddress(currentUser.address.detailAddress)}
                                                    </div>

                                                        <div className="text-[11.5px] text-slate-500">
                                                            메모: {currentUser.address.memo}
                                                        </div>
                                                    )}
                                                </div>
                                            ) : (
                                                <form onSubmit={handleSaveAddress} className="space-y-2">
                                                    <div className="flex items-center justify-between">
                                                        <span className="text-[12px] font-bold text-[#1d4ed8]">
                                                            {currentUser.address ? '배송지 변경' : '배송지 입력'}
                                                        </span>
                                                        {currentUser.address && (
                                                            <button 
                                                                type="button" 
                                                                onClick={() => setIsEditingAddress(false)}
                                                                className="text-[11px] font-bold text-slate-500"

                                                            </button>
                                                        )}

                                                            type="text" 
                                                            value={addrForm.realname}

                                                            className="w-full border border-slate-300 rounded px-2.5 py-1.5 text-[12.5px] outline-none focus:border-[#1d4ed8]" 
                                                        />
                                                        <input 
                                                            type="tel" 
                                                            inputMode="numeric"
                                                            value={addrForm.phone} 
                                                            onChange={e => setAddrForm({...addrForm, phone: e.target.value.replace(/[^0-9]/g, '')})} 
                                                            placeholder="연락처(숫자만) *" 
                                                            className="w-full border border-slate-300 rounded px-2.5 py-1.5 text-[12.5px] outline-none focus:border-[#1d4ed8]" 
                                                        />
                                                    </div>

                                                        <div className="flex gap-1.5">
                                                            <input type="text" value={addrForm.zipcode} readOnly placeholder="우편번호" className="w-20 border border-slate-300 rounded px-2.5 py-1.5 text-[12px] bg-slate-50" />

                                                        </div>
                                                        <input type="text" value={addrForm.baseAddress} readOnly placeholder="기본 주소" className="w-full border border-slate-300 rounded px-2.5 py-1.5 text-[12px] bg-slate-50" />
                                                        <input type="text" value={addrForm.detailAddress} onChange={e => setAddrForm({...addrForm, detailAddress: e.target.value})} placeholder="상세 주소 (동, 호수)" className="w-full border border-slate-300 rounded px-2.5 py-1.5 text-[12.5px] outline-none focus:border-[#1d4ed8]" />
                                                        <input type="text" value={addrForm.memo} onChange={e => setAddrForm({...addrForm, memo: e.target.value})} placeholder="배송 메모 (선택)" className="w-full border border-slate-300 rounded px-2.5 py-1.5 text-[12.5px] outline-none focus:border-[#1d4ed8]" />
                                                    </div>

                                                    {}

                                                        <div className="font-extrabold text-slate-900 text-[12px] border-b border-slate-200 pb-1.5">

                                                        <div className="grid grid-cols-[72px_10px_1fr] gap-y-1 text-slate-700 leading-snug">
                                                            <span className="font-bold text-slate-800">수집·이용 목적</span>
                                                            <span className="text-slate-400">:</span>
                                                            <span>상품 주문 확인, 배송, 고객 상담 및 민원 처리</span>

                                                            <span className="font-bold text-slate-800">수집 항목</span>
                                                            <span className="text-slate-400">:</span>
                                                            <span>성명, 연락처, 배송지 주소, 유튜브 닉네임</span>

                                                            <span className="font-bold text-slate-800">제3자 제공</span>
                                                            <span className="text-slate-400">:</span>
                                                            <span>위탁 배송을 위해 해당 상품 공급사에 배송 정보(성명, 연락처, 주소) 제공</span>

                                                            <span className="font-bold text-slate-800">보유 및 이용</span>
                                                            <span className="text-slate-400">:</span>
                                                            <span className="font-bold text-slate-900">주소 입력일로부터 30일</span>
                                                        </div>
                                                        <div className="text-[11px] text-slate-600 pt-1 border-t border-dashed border-slate-200 leading-snug">

                                                        </div>
                                                        <label className="flex items-center gap-2 cursor-pointer pt-1.5 border-t border-slate-200">
                                                            <input 
                                                                type="checkbox" 
                                                                checked={addrForm.agreePrivacy} 
                                                                onChange={e => setAddrForm({...addrForm, agreePrivacy: e.target.checked})} 
                                                                className="w-4 h-4 accent-slate-900 rounded" 
                                                            />
                                                            <span className="text-slate-900 font-extrabold text-[12px]">[필수] 위 내용에 동의합니다.</span>
                                                        </label>
                                                    </div>

                                                    <button type="submit" className="w-full bg-slate-900 hover:bg-black text-white font-bold py-2.5 rounded text-[12.5px] shadow-sm transition-colors">
                                                        배송지 저장
                                                    </button>
                                                </form>
                                            )}
                                        </div>
                                    </section>

                                    {/* 구획 5: 확인 및 카톡 버튼 */}
                                    <section className="space-y-1.5 pt-0.5">
                                        {isOrderConfirmedByCustomer ? (
                                            <div className="w-full bg-blue-50 border border-[#1d4ed8] text-[#1d4ed8] font-bold py-2.5 px-3 rounded text-center text-[12.5px]">
                                                ✓ 확인 완료되었습니다
                                            </div>
                                        ) : (
                                            <button 
                                                type="button"
                                                onClick={handleConfirmOrder}
                                                className="w-full bg-[#1d4ed8] hover:bg-[#1e40af] text-white font-bold py-2.5 px-3 rounded text-[13px] shadow-sm"
                                            >
                                                네, 주문내역과 배송지가 모두 맞습니다
                                            </button>
                                        )}

                                        <a 
                                            href="#kakao-cs"
                                            onClick={(e) => { e.preventDefault(); showToast("카카오톡 상담창으로 연결됩니다."); }}
                                            className="w-full bg-[#FEE500] hover:bg-[#fada0a] text-slate-900 font-bold text-[12px] py-2 px-3 rounded flex items-center justify-center gap-1.5 border border-[#e5ce00]"
                                        >
                                            <Icon name="chat-circle-dots" weight="fill" size={14} />
                                            <span>품목 수정 등 카톡 연락하기</span>
                                        </a>
                                    </section>
                                </main>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CustomerPortalApp />);
    </script>
</body>
</html>
